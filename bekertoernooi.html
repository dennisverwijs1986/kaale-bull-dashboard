<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaale Bull — Bekertoernooi</title>
<style>
:root {
  /* Dartbord-palet, zelfde tinten als bekerloting.html */
  --bg:      #0d241b;
  --s1:      #16352a;
  --s2:      #1c4231;
  --s3:      #22503c;
  --border:  #2c5c46;
  --text:    #f3ead6;
  --muted:   #a9c2b4;
  --green:   #4a9d6f;
  --red:     #9c2b3b;
  --orange:  #d9ab3f;
  --blue:    #3b7a6b;
  --purple:  #8a6d3b;
  --gold-bright: #f0c25f;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

.topbar{background:#081712;border-bottom:2px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;}
.topbar h1{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:8px;}
.topbar .sub{font-size:0.75rem;color:var(--muted);}
.topbar-actions{display:flex;gap:10px;align-items:center;}

.wrap{max-width:900px;margin:0 auto;padding:20px 16px 80px;}

.card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
.card h2{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.card .desc{font-size:0.8rem;color:var(--muted);margin-bottom:12px;}
.badge{font-size:0.65rem;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:0.3px;}
.badge.open{background:rgba(217,171,63,0.15);color:var(--orange);}
.badge.done{background:rgba(74,157,111,0.15);color:var(--green);}
.badge.wr{background:rgba(59,122,107,0.2);color:var(--blue);}
.badge.vr{background:rgba(138,109,59,0.22);color:var(--purple);}

.btn{background:var(--s3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 16px;font-size:0.85rem;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;}
.btn:hover{background:#2c5c46;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-green{background:var(--green);color:#081712;border-color:var(--green);}
.btn-green:hover{background:#5cb582;}
.btn-orange{background:var(--orange);color:#241a04;border-color:var(--orange);}
.btn-sm{padding:5px 10px;font-size:0.72rem;}

.toggle-row{display:flex;align-items:center;gap:8px;font-size:0.8rem;color:var(--muted);}
.toggle-row input{width:16px;height:16px;}

.matches{display:flex;flex-direction:column;gap:8px;}
.match{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:0.85rem;flex-wrap:wrap;}
.match .nr{width:22px;flex:0 0 auto;color:var(--muted);font-size:0.72rem;text-align:center;}
.match .naam{flex:1;padding:7px 10px;border-radius:6px;background:var(--s3);text-align:center;border:2px solid transparent;transition:.12s;min-width:100px;}
.match .naam.winner{background:rgba(74,157,111,0.22);border-color:var(--green);font-weight:700;}
.match .naam.loser{opacity:0.55;}
.match .score-in{width:38px;background:var(--s3);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:6px 2px;text-align:center;font-family:inherit;font-size:0.9rem;}
.match .score-sep{color:var(--muted);flex:0 0 auto;}
.match .vs{font-size:0.68rem;color:var(--muted);flex:0 0 auto;}
.match.bye{opacity:0.75;}
.match .side.bye-label{background:transparent;color:var(--muted);cursor:default;font-style:italic;flex:1;padding:7px 10px;}
.match .sync{font-size:0.65rem;flex:0 0 auto;width:60px;text-align:center;}
.sync.ok{color:var(--green);} .sync.pending{color:var(--orange);} .sync.error{color:var(--red);}
.match .btn-sm{flex:0 0 auto;}

.faseGroup{margin-bottom:22px;}
.faseGroup-hdr{font-size:0.7rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state h2{color:var(--text);margin-bottom:10px;}
.empty-state p{font-size:0.85rem;max-width:420px;margin:0 auto 20px;line-height:1.5;}
.link-btn{display:inline-block;text-decoration:none;background:var(--orange);color:#241a04;border:none;border-radius:8px;padding:9px 16px;font-size:0.85rem;font-weight:700;cursor:pointer;font-family:inherit;}
#resetToernooiBtn{background:var(--red);color:#fff0f0;}
#resetToernooiBtn:hover{background:var(--red-bright,#c23a4e);}
.link-btn:hover{background:var(--gold-bright);}

.roadmap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
.roadmap .pill{font-size:0.68rem;font-weight:600;padding:5px 10px;border-radius:20px;border:1px solid var(--border);color:var(--muted);background:var(--s1);white-space:nowrap;}
.roadmap .pill.voltooid{border-color:var(--green);color:var(--green);background:rgba(74,157,111,0.12);}
.roadmap .pill.bezig{border-color:var(--orange);color:var(--orange);background:rgba(217,171,63,0.12);}
.roadmap .pill.nog-niet{opacity:0.55;}

.champ-banner{background:linear-gradient(135deg, rgba(217,171,63,0.22), rgba(217,171,63,0.05));border:1px solid var(--orange);border-radius:10px;padding:16px 18px;margin-bottom:16px;text-align:center;box-shadow:0 0 24px rgba(217,171,63,0.15);}
.champ-banner .icon{font-size:1.6rem;}
.champ-banner .naam{font-size:1.2rem;font-weight:800;color:var(--orange);}
.champ-banner .lbl{font-size:0.72rem;color:var(--muted);}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:10px 18px;font-size:0.82rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;}
.toast.show{opacity:1;}
.toast.green{border-color:var(--green);color:var(--green);}
.toast.red{border-color:var(--red);color:var(--red);}

@media(max-width:600px){
  .match{flex-wrap:wrap;}
  .match .sync{display:none;}
}

/* ── PDF/print-weergave ──
   #printView wordt alleen gevuld en getoond op het moment dat er geprint/als
   PDF opgeslagen wordt; in de normale schermweergave staat hij verborgen. */
#printView{display:none;}
.print-hdr{margin-bottom:14px;}
.print-hdr h1{font-size:1.3rem;font-weight:800;}
.print-hdr .sub{font-size:0.8rem;color:#555;margin-top:2px;}
.print-champs{margin:10px 0 18px;font-size:0.9rem;}
.print-champs div{margin-bottom:2px;}
.print-fase{margin-bottom:14px;}
.print-fase h2{font-size:0.85rem;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid #999;padding-bottom:3px;margin-bottom:6px;}
.print-match{display:flex;align-items:baseline;gap:6px;font-size:0.85rem;padding:2px 0;}
.print-match .pm-nr{width:20px;flex:0 0 auto;color:#666;}
.print-match .pm-naam{flex:1;}
.print-match .pm-naam.pm-winner{font-weight:800;}
.print-match .pm-score{flex:0 0 auto;font-weight:700;min-width:46px;text-align:center;}
.print-match .pm-open{flex:0 0 auto;color:#777;font-style:italic;font-size:0.78rem;}
.print-bye{font-size:0.8rem;color:#555;font-style:italic;margin-top:2px;}

@media print{
  body *{ visibility:hidden; }
  #printView, #printView *{ visibility:visible; }
  #printView{
    display:block;
    position:absolute; top:0; left:0; width:100%;
    background:#fff; color:#111; padding:0;
  }
  @page{ margin:14mm; }
}
</style>
</head>
<body>

<div class="topbar">
  <h1>🏆 Bekertoernooi <span class="sub" id="seizoenLbl"></span></h1>
  <div class="topbar-actions">
    <label class="toggle-row"><input type="checkbox" id="syncToggle"> Wedstrijden wegschrijven naar planning</label>
    <button type="button" class="link-btn" id="pdfBtn" style="display:none;">📄 PDF / delen</button>
    <button type="button" class="link-btn" id="resetToernooiBtn" style="display:none;">↺ Toernooi resetten</button>
  </div>
</div>

<div class="wrap" id="app">
  <div class="empty-state" id="loadingState">
    <p>Laden…</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Alleen zichtbaar bij het printen/PDF opslaan (zie @media print hierboven) -->
<div id="printView"></div>

<script>
// ══════════════════════════════════════════
//  SUPABASE
// ══════════════════════════════════════════
const SB_URL = 'https://ctxurzqtglckairgbjno.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0eHVyenF0Z2xja2Fpcmdiam5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzExNjYsImV4cCI6MjA5NDcwNzE2Nn0.Ty3nNEyNfZVebxqXRS5RALM7JA5AdghIYAS6VjfFITQ';
const HDR = { 'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=representation' };
const sbGet   = async (t,q='') => { const r=await fetch(`${SB_URL}/rest/v1/${t}?${q}`,{headers:HDR}); if(!r.ok) throw new Error(await r.text()); return r.json(); };
const sbPost  = async (t,b)    => { const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:{...HDR,'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(b)}); if(!r.ok) throw new Error(await r.text()); return r.json(); };
const sbPatch = async (t,id,b) => { const r=await fetch(`${SB_URL}/rest/v1/${t}?id=eq.${id}`,{method:'PATCH',headers:HDR,body:JSON.stringify(b)}); if(!r.ok) throw new Error(await r.text()); return r.json(); };
// Hoeveel legs een speler nodig heeft om een Bo5/Bo7/Bo9-wedstrijd te winnen.
function legsNodig(bo){ return (bo+1)/2; }
// Bepaalt op basis van de ingevoerde score wie er heeft gewonnen ('a'/'b'), of
// null als de score nog geen geldige eindstand is (bv. nog niemand op het
// vereiste aantal legs).
function bepaalWinnaarUitScore(bo, scoreA, scoreB){
  const nodig = legsNodig(bo);
  if(scoreA===nodig && scoreB<nodig) return 'a';
  if(scoreB===nodig && scoreA<nodig) return 'b';
  return null;
}

function escapeHtml(str){
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show '+type;
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),3200);
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function powerOf2LE(n){ let p=1; while(p*2<=n) p*=2; return p; }
function pairUp(namen){
  const s=shuffle(namen);
  const matches=[];
  for(let i=0;i<s.length;i+=2) matches.push({a:s[i],b:s[i+1],winnaar:null,sync:null});
  return matches;
}

// ══════════════════════════════════════════
//  SEIZOEN / STATE
// ══════════════════════════════════════════
const SEIZOEN = '2026-2027';
let state = null; // volledige toernooi-staat (uit Supabase)

// Vaste bracket-structuur: elke fase weet hoeveel Bo, welke tak, en welke fase(s)
// eraan vooraf moeten gaan voordat hij gegenereerd kan worden.
// VR2 bestaat uit de 10 ronde1-verliezers ÉN de bye-spelers die hun eerste
// wedstrijd (in WR2) verliezen (hun ene troostronde) — die pool is pas compleet
// zodra WR2 helemaal is uitgespeeld, dus VR2 wordt pas dán geloot (niet meteen
// na ronde1). Als die pool geen macht van 2 is, wordt binnen dezelfde VR2-loting
// eerst een aantal bye's getrokken (net als bij ronde 1) en daarna de resterende
// wedstrijden — dat verving de losse "tussenronde"-fase die hier eerder stond.
const FASES = {
  ronde1:        { label:'Ronde 1',                tak:'gemengd',       bo:5 },
  wr2:           { label:'Winnaarsronde 2',         tak:'winnaarsronde', bo:5, dependsOn:['ronde1'] },
  vr2:           { label:'Verliezersronde 2',       tak:'verliezersronde',bo:5, dependsOn:['wr2'] },
  vr3:           { label:'Verliezersronde 3',       tak:'verliezersronde',bo:5, dependsOn:['vr2'] },
  wr3:           { label:'Winnaarsronde 3',         tak:'winnaarsronde', bo:5, dependsOn:['wr2'] },
  wr_kwart:      { label:'Winnaarsronde — kwartfinale', tak:'winnaarsronde', bo:5, dependsOn:['wr3'] },
  vr_kwart:      { label:'Verliezersronde — kwartfinale', tak:'verliezersronde', bo:5, dependsOn:['vr3'] },
  wr_halve:      { label:'Winnaarsronde — halve finale', tak:'winnaarsronde', bo:7, dependsOn:['wr_kwart'] },
  vr_halve:      { label:'Verliezersronde — halve finale', tak:'verliezersronde', bo:7, dependsOn:['vr_kwart'] },
  wr_finale:     { label:'Winnaarsronde — FINALE',  tak:'winnaarsronde', bo:9, dependsOn:['wr_halve'] },
  vr_finale:     { label:'Verliezersronde — FINALE',tak:'verliezersronde',bo:9, dependsOn:['vr_halve'] },
};
const FASE_VOLGORDE = ['ronde1','wr2','vr2','vr3','wr3','wr_kwart','vr_kwart','wr_halve','vr_halve','wr_finale','vr_finale'];

async function init(){
  document.getElementById('seizoenLbl').textContent = '— seizoen ' + SEIZOEN;
  try{
    const rows = await sbGet('beker_toernooi', `id=eq.${encodeURIComponent(SEIZOEN)}`);
    if(rows.length){
      state = rows[0].staat;
      document.getElementById('syncToggle').checked = !!state.syncEnabled;
    }
  }catch(e){ /* nog geen tabel-toegang of nog geen rij: gewoon starten met leeg */ }
  document.getElementById('syncToggle').addEventListener('change', e=>{
    state = state || {};
    state.syncEnabled = e.target.checked;
    bewaarState();
  });
  document.getElementById('resetToernooiBtn').addEventListener('click', resetToernooi);
  document.getElementById('pdfBtn').addEventListener('click', openPdfView);
  render();
}

// ══════════════════════════════════════════
//  PDF / DELEN (via de print-dialoog van de browser: "Opslaan als PDF")
// ══════════════════════════════════════════
function pdfMatchRow(m){
  const isBye = !m.a || !m.b;
  if(isBye){
    const naam = m.a || m.b || '';
    return `<div class="print-match"><span class="pm-nr">${m.nr||''}</span><span class="pm-naam">${escapeHtml(naam)}</span><span class="pm-open">bye</span></div>`;
  }
  const aWin = m.winnaar && m.winnaar===m.a;
  const bWin = m.winnaar && m.winnaar===m.b;
  const scoreTxt = m.winnaar ? `${m.scoreA}–${m.scoreB}` : '';
  return `<div class="print-match">
    <span class="pm-nr">${m.nr||''}</span>
    <span class="pm-naam${aWin?' pm-winner':''}">${escapeHtml(m.a)}</span>
    ${m.winnaar ? `<span class="pm-score">${scoreTxt}</span>` : `<span class="pm-open">nog te spelen</span>`}
    <span class="pm-naam${bWin?' pm-winner':''}">${escapeHtml(m.b)}</span>
  </div>`;
}

function openPdfView(){
  if(!state){ toast('Nog geen toernooi om te delen.','red'); return; }
  const view = document.getElementById('printView');
  const datumTxt = new Date().toLocaleDateString('nl-NL', { day:'numeric', month:'long', year:'numeric' });

  let html = `<div class="print-hdr">
    <h1>🏆 Bekertoernooi — De Kaale Bull</h1>
    <div class="sub">Seizoen ${escapeHtml(SEIZOEN)} · stand op ${datumTxt}</div>
  </div>`;

  if(state.kampioenWR || state.kampioenVR){
    html += '<div class="print-champs">';
    if(state.kampioenWR) html += `<div>🏆 <strong>Bekerwinnaar:</strong> ${escapeHtml(state.kampioenWR)}</div>`;
    if(state.kampioenVR) html += `<div>🥈 <strong>Winnaar verliezersronde:</strong> ${escapeHtml(state.kampioenVR)}</div>`;
    html += '</div>';
  }

  FASE_VOLGORDE.forEach(faseId=>{
    const fase = state.fases[faseId];
    if(!fase) return;
    const meta = FASES[faseId];
    const statusTxt = fase.afgerond ? 'afgerond' : 'bezig';
    html += `<div class="print-fase"><h2>${escapeHtml(meta.label)} — ${statusTxt}</h2>`;
    if(fase.matches.length){
      html += fase.matches.map(pdfMatchRow).join('');
    } else {
      html += '<div class="print-bye">Alle spelers hadden een bye deze ronde.</div>';
    }
    if(fase.bye && fase.bye.length){
      html += `<div class="print-bye">➕ Bye door naar de volgende fase: ${fase.bye.map(escapeHtml).join(', ')}</div>`;
    }
    html += '</div>';
  });

  view.innerHTML = html;
  window.print();
}

async function resetToernooi(){
  if(!window.confirm('Weet je zeker dat je het hele bekertoernooi wilt resetten? Alle geloot wedstrijden, ingevoerde scores en de voortgang gaan verloren — inclusief eventuele bekerwedstrijden die al in de planning staan. De loting moet dan opnieuw via het rad.')) return;
  try{
    await fetch(`${SB_URL}/rest/v1/beker_toernooi?id=eq.${encodeURIComponent(SEIZOEN)}`, { method:'DELETE', headers:HDR });
  }catch(e){ toast('Kon toernooi niet resetten: '+e.message,'red'); return; }
  try{
    // Ruim ook alle bekerwedstrijden op die eventueel al (via de sync-optie) in de
    // planning terecht zijn gekomen, zodat een reset ook echt een schone lei geeft.
    await fetch(`${SB_URL}/rest/v1/wedstrijden?divisie=ilike.Beker*`, { method:'DELETE', headers:HDR });
  }catch(e){ toast('Toernooi is gereset, maar bekerwedstrijden in de planning konden niet worden opgeruimd: '+e.message,'red'); }
  state = null;
  document.getElementById('syncToggle').checked = false;
  toast('Toernooi volledig gereset — start een nieuwe loting via het rad.');
  render();
}

async function bewaarState(){
  try{
    await fetch(`${SB_URL}/rest/v1/beker_toernooi`, {
      method:'POST',
      headers:{...HDR,'Prefer':'resolution=merge-duplicates,return=representation'},
      body:JSON.stringify([{ id:SEIZOEN, seizoen:SEIZOEN, staat:state }])
    });
  }catch(e){ toast('Kon voortgang niet opslaan: '+e.message,'red'); }
}

// ══════════════════════════════════════════
//  WEDSTRIJDEN WEGSCHRIJVEN NAAR PLANNING (optioneel)
// ══════════════════════════════════════════
async function schrijfWedstrijd(match, faseId){
  const fase = FASES[faseId];
  const tak = match._tak || fase.tak; // ronde1 heeft matches uit beide takken
  const bo  = match._bo  || fase.bo;
  const naamTak = tak === 'winnaarsronde' ? 'winnaarsronde' : 'verliezersronde';
  const gespeeld = !!match.winnaar;
  const payload = {
    datum: new Date().toISOString().slice(0,10),
    tijdstip: null,
    divisie: `Beker ${naamTak} (Bo${bo})`,
    thuis: match.a, uit: match.b,
    speelronde: null,
    status: gespeeld ? 'gespeeld' : 'gepland',
    uitslag: gespeeld ? `${match.scoreA}-${match.scoreB}` : null,
    is_inhaal:false, datum_nnb:true
  };
  match.sync = 'pending'; render();
  try{
    if(match._wedstrijdId){
      // Wedstrijd stond al in de planning (fixture) — bijwerken i.p.v. dupliceren.
      await sbPatch('wedstrijden', match._wedstrijdId, { status:payload.status, uitslag:payload.uitslag });
    } else {
      const rows = await sbPost('wedstrijden', [payload]);
      match._wedstrijdId = rows[0].id;
    }
    match.sync = 'ok';
  }catch(e){ match.sync = 'error'; }
  await bewaarState(); render();
}

// ══════════════════════════════════════════
//  FASE-GENERATOREN
// ══════════════════════════════════════════
// De loting zelf gebeurt in bekerloting.html (het "rad van namen"). Die schrijft
// de complete ronde-1-staat rechtstreeks naar beker_toernooi in exact het
// format dat genereerRonde1() hieronder ook zou produceren — deze functie
// blijft staan als referentie voor dat format, maar wordt vanuit deze pagina
// niet meer aangeroepen.
function genereerRonde1(spelers42){
  const shuffled = shuffle(spelers42);
  const totaal = shuffled.length;
  const doel = powerOf2LE(totaal);          // bv. 32 bij 42 spelers
  const x = totaal - doel;                  // aantal ronde1-wedstrijden (bv. 10)
  const bye = shuffled.slice(0, totaal - x*2);
  const spelenNamen = shuffled.slice(totaal - x*2);
  const matches = pairUp(spelenNamen);
  matches.forEach((m,i)=>{ m.nr=i+1; });

  // Verdeel de bye-spelers: x van hen krijgen straks in WR2 de winnaar van
  // een ronde1-wedstrijd als tegenstander (voorkomt dat twee ronde1-winnaars
  // elkaar treffen); de rest speelt in WR2 meteen tegen elkaar.
  const byeShuffled = shuffle(bye);
  const preSeed   = byeShuffled.slice(0, x);
  const directBye = byeShuffled.slice(x);
  const wr2ByeMatches = pairUp(directBye);
  wr2ByeMatches.forEach(m=>{ m._tak='winnaarsronde'; });
  const wr2Slots = preSeed.map((naam,i)=>({ byeSpeler:naam, winnaarVanWedstrijd:i+1 }));

  state = {
    spelers: spelers42,
    syncEnabled: document.getElementById('syncToggle').checked,
    kampioenWR: null, kampioenVR: null,
    fases: {
      ronde1: { matches, bye, afgerond:false },
    },
    wr2Voorbereiding: { byeMatches: wr2ByeMatches, slots: wr2Slots }
  };
  bewaarState();
  render();
  toast(`Ronde 1 geloot: ${x} wedstrijden, ${bye.length} bye's.`,'green');
}

function alleGespeeld(matches){ return matches.every(m => m.winnaar); }

function slaScoreOp(faseId, matchIdx){
  const fase = state.fases[faseId];
  const m = fase.matches[matchIdx];
  if(!m.a || !m.b) return; // placeholder nog niet ingevuld
  const bo = m._bo || FASES[faseId].bo;
  const scoreAEl = document.getElementById(`scoreA-${faseId}-${matchIdx}`);
  const scoreBEl = document.getElementById(`scoreB-${faseId}-${matchIdx}`);
  const scoreA = parseInt(scoreAEl.value, 10);
  const scoreB = parseInt(scoreBEl.value, 10);
  if(Number.isNaN(scoreA) || Number.isNaN(scoreB)){ toast('Vul bij beide spelers een score in.','red'); return; }
  const kant = bepaalWinnaarUitScore(bo, scoreA, scoreB);
  if(!kant){ toast(`Bij Bo${bo} moet één speler op ${legsNodig(bo)} staan en de ander lager.`,'red'); return; }
  m.scoreA = scoreA; m.scoreB = scoreB;
  m.winnaar = kant === 'a' ? m.a : m.b;
  fase.afgerond = alleGespeeld(fase.matches);
  bewaarState();
  berekenVolgendeFases();
  render();
  if(state.syncEnabled) schrijfWedstrijd(m, faseId);
}

// Bepaalt welke fases nu gegenereerd kunnen worden en doet dat (idempotent).
function berekenVolgendeFases(){
  if(!state) return;
  state.fases = state.fases || {};

  // WR2: klaar zodra ronde1 afgerond is
  if(state.fases.ronde1 && state.fases.ronde1.afgerond && !state.fases.wr2){
    const { byeMatches, slots } = state.wr2Voorbereiding;
    const slotMatches = slots.map(s=>{
      const winnaarWedstrijd = state.fases.ronde1.matches.find(m=>m.nr===s.winnaarVanWedstrijd);
      return { a: winnaarWedstrijd.winnaar, b: s.byeSpeler, winnaar:null, sync:null, _tak:'winnaarsronde' };
    });
    const matches = [...byeMatches, ...slotMatches];
    matches.forEach((m,i)=>m.nr=i+1);
    state.fases.wr2 = { matches, afgerond:false };
  }

  // VR2, vr3, wr3 en de generieke halvering worden niet meer hier automatisch
  // gegenereerd — die lotingen gebeuren nu via het rad in bekerloting.html. Zie
  // bepaalTeLoten() hieronder, die detecteert wanneer een volgende fase klaar
  // is om geloot te worden.

  // Onthoud wie er in ronde1 heeft gewonnen (nodig om te bepalen wie bij
  // verlies in WR2 nog naar de verliezersronde mag — alleen wie nog geen
  // wedstrijd heeft gewonnen krijgt die herkansing).
  const ronde1Winnaars = state.fases.ronde1 ? new Set(state.fases.ronde1.matches.map(m=>m.winnaar)) : new Set();

  // VR2: klaar zodra WR2 helemaal afgerond is. De pool bestaat dan uit de 10
  // ronde1-verliezers plus de bye-spelers die hun eerste wedstrijd (in WR2)
  // verloren (hun ene troostronde) — pas als WR2 klaar is, is die pool compleet.
  // Is de pool geen macht van 2, dan wordt dat automatisch afgehandeld: is x===0
  // dan is er niets te loten (iedereen gaat automatisch door), anders wordt het
  // een loting via het rad (zie bepaalTeLoten hieronder).
  if(state.fases.wr2 && state.fases.wr2.afgerond && !state.fases.vr2){
    const ronde1Verliezers = state.fases.ronde1.matches.map(m => m.winnaar===m.a ? m.b : m.a);
    const wr2Doorstromers = state.fases.wr2.matches
      .map(m => m.winnaar===m.a ? m.b : m.a)          // de verliezer
      .filter(verliezer => !ronde1Winnaars.has(verliezer)); // alleen als 'ie geen ronde1-winnaar was
    const pool = [...ronde1Verliezers, ...wr2Doorstromers];
    const doel = powerOf2LE(pool.length);
    const x = pool.length - doel;
    if(x === 0){
      state.fases.vr2 = { matches:[], bye:pool, afgerond:true, doorgestroomd:pool };
    }
    // x > 0: geen auto-generatie meer — dit wordt een loting via het rad.
  }

  // Kampioenen
  if(state.fases.wr_finale && state.fases.wr_finale.afgerond && !state.kampioenWR){
    state.kampioenWR = state.fases.wr_finale.matches[0].winnaar;
  }
  if(state.fases.vr_finale && state.fases.vr_finale.afgerond && !state.kampioenVR){
    state.kampioenVR = state.fases.vr_finale.matches[0].winnaar;
  }
}

// Bepaalt welke fase nu klaar is om geloot te worden via het rad (bekerloting.html),
// of null als er op dit moment niets te loten valt. Spiegelt exact dezelfde
// afhankelijkheids-checks die vroeger in berekenVolgendeFases() automatisch
// genereerden — maar geeft nu alleen een beschrijving terug i.p.v. te genereren.
function bepaalTeLoten(state){
  if(!state || !state.fases || !state.fases.ronde1){
    return { type:'ronde1' };
  }
  const fases = state.fases;
  const ronde1Winnaars = new Set(fases.ronde1.matches.map(m=>m.winnaar));

  if(fases.wr2 && fases.wr2.afgerond && !fases.vr2){
    const ronde1Verliezers = fases.ronde1.matches.map(m => m.winnaar===m.a ? m.b : m.a);
    const wr2Doorstromers = fases.wr2.matches
      .map(m => m.winnaar===m.a ? m.b : m.a)
      .filter(verliezer => !ronde1Winnaars.has(verliezer));
    const pool = [...ronde1Verliezers, ...wr2Doorstromers];
    const doel = powerOf2LE(pool.length);
    const x = pool.length - doel;
    if(x > 0){
      return { type:'tussenronde', faseId:'vr2', pool, x };
    }
    // x === 0: geen loting nodig, bekertoernooi.html vult dit automatisch
  }

  if(fases.vr2 && fases.vr2.afgerond && !fases.vr3){
    const pool = [...fases.vr2.matches.map(m=>m.winnaar), ...(fases.vr2.bye||[])];
    return { type:'fase', faseId:'vr3', pool };
  }

  if(fases.wr2 && fases.wr2.afgerond && !fases.wr3){
    const pool = fases.wr2.matches.map(m=>m.winnaar);
    return { type:'fase', faseId:'wr3', pool };
  }

  const generiek = [
    ['wr3','wr_kwart'], ['vr3','vr_kwart'],
    ['wr_kwart','wr_halve'], ['vr_kwart','vr_halve'],
    ['wr_halve','wr_finale'], ['vr_halve','vr_finale'],
  ];
  for(const [van,naar] of generiek){
    if(fases[van] && fases[van].afgerond && !fases[naar]){
      const pool = fases[van].matches.map(m=>m.winnaar);
      return { type:'fase', faseId:naar, pool };
    }
  }

  return null; // niets te loten op dit moment
}

// ══════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════
function matchHtml(faseId, m, idx){
  const isBye = !m.a || !m.b;
  const bo = m._bo || (FASES[faseId] ? FASES[faseId].bo : 5);
  if(isBye){
    const naam = m.a || m.b || '';
    return `<div class="match bye"><span class="nr">${m.nr||''}</span>
      <div class="side bye-label">${escapeHtml(naam)} — bye (automatisch door)</div></div>`;
  }
  const aCls = m.winnaar ? (m.winnaar===m.a?'winner':'loser') : '';
  const bCls = m.winnaar ? (m.winnaar===m.b?'winner':'loser') : '';
  const syncHtml = m.sync ? `<span class="sync ${m.sync}">${m.sync==='ok'?(m.winnaar?'✓ opgeslagen':'✓ gepland'):m.sync==='pending'?'…':'✗ fout'}</span>` : '<span class="sync"></span>';
  const scoreAVal = m.scoreA===undefined||m.scoreA===null ? '' : m.scoreA;
  const scoreBVal = m.scoreB===undefined||m.scoreB===null ? '' : m.scoreB;
  return `<div class="match">
    <span class="nr">${m.nr||''}</span>
    <div class="naam ${aCls}">${escapeHtml(m.a)}</div>
    <input class="score-in" type="number" min="0" max="${legsNodig(bo)}" id="scoreA-${faseId}-${idx}" value="${scoreAVal}">
    <span class="score-sep">–</span>
    <input class="score-in" type="number" min="0" max="${legsNodig(bo)}" id="scoreB-${faseId}-${idx}" value="${scoreBVal}">
    <div class="naam ${bCls}">${escapeHtml(m.b)}</div>
    <button class="btn btn-sm ${m.winnaar?'':'btn-orange'}" onclick="slaScoreOp('${faseId}',${idx})">${m.winnaar?'Wijzig':'Opslaan'}</button>
    ${syncHtml}
  </div>`;
}
window.slaScoreOp = slaScoreOp;

function faseCardHtml(faseId){
  const fase = state.fases[faseId];
  const meta = FASES[faseId];
  if(!fase) return '';
  const tak = meta.tak === 'winnaarsronde' ? 'wr' : meta.tak === 'verliezersronde' ? 'vr' : '';
  const badgeTak = tak ? `<span class="badge ${tak}">${tak.toUpperCase()}</span>` : '';
  const badgeStatus = fase.afgerond ? '<span class="badge done">✓ afgerond</span>' : '<span class="badge open">bezig</span>';
  const matchesHtml = fase.matches.length
    ? fase.matches.map((m,i)=>matchHtml(faseId,m,i)).join('')
    : '<div class="desc">Alle spelers hadden een bye deze ronde.</div>';
  const byeNote = fase.bye && fase.bye.length
    ? `<div class="desc">➕ ${fase.bye.length} speler${fase.bye.length===1?'':'s'} kreeg automatisch een bye door naar de volgende fase.</div>` : '';
  return `<div class="card">
    <h2>${meta.label} ${badgeTak} ${badgeStatus}</h2>
    ${meta.label.includes('tussenronde') ? '<div class="desc">Extra tussenronde om terug te komen op een rond aantal spelers.</div>' : ''}
    <div class="matches">${matchesHtml}</div>
    ${byeNote}
  </div>`;
}

function roadmapHtml(){
  if(!state) return '';
  const fases = state.fases || {};
  const pills = FASE_VOLGORDE.map(faseId=>{
    const meta = FASES[faseId];
    const fase = fases[faseId];
    let statusCls = 'nog-niet', statusLbl = 'nog niet begonnen';
    if(fase && fase.afgerond){ statusCls = 'voltooid'; statusLbl = 'voltooid'; }
    else if(fase){ statusCls = 'bezig'; statusLbl = 'bezig'; }
    return `<span class="pill ${statusCls}" title="${escapeHtml(statusLbl)}">${escapeHtml(meta.label)}</span>`;
  }).join('');
  return `<div class="roadmap">${pills}</div>`;
}

function render(){
  const app = document.getElementById('app');
  document.getElementById('resetToernooiBtn').style.display = state ? 'inline-block' : 'none';
  document.getElementById('pdfBtn').style.display = state ? 'inline-block' : 'none';
  if(!state){
    app.innerHTML = `<div class="empty-state">
      <h2>🏆 Nog geen bekertoernooi gestart</h2>
      <p>De loting van ronde 1 (bye's en eerste wedstrijden) gebeurt via het rad van namen. Zodra die loting daar is afgerond, verschijnt het volledige schema hier automatisch.</p>
      <a class="link-btn" href="bekerloting.html">🎡 Ga naar de bekerloting</a>
    </div>`;
    return;
  }

  let html = roadmapHtml();

  if(state.kampioenWR || state.kampioenVR){
    html += '<div class="champ-banner">';
    if(state.kampioenWR) html += `<div class="icon">🏆</div><div class="lbl">Bekerwinnaar</div><div class="naam">${escapeHtml(state.kampioenWR)}</div>`;
    if(state.kampioenVR) html += `<div class="icon" style="margin-top:10px;">🥈</div><div class="lbl">Winnaar verliezersronde</div><div class="naam">${escapeHtml(state.kampioenVR)}</div>`;
    html += '</div>';
  }

  const teLoten = bepaalTeLoten(state);
  if(teLoten){
    const label = teLoten.type==='ronde1' ? FASES.ronde1.label : FASES[teLoten.faseId].label;
    const aantal = teLoten.type==='ronde1' ? '' : ` (${teLoten.pool.length} spelers)`;
    html += `<div class="card" style="border-color:var(--orange);">
      <h2>🎡 Klaar om te loten: ${escapeHtml(label)}${aantal}</h2>
      <div class="desc">Deze loting gebeurt via het rad van namen, niet automatisch hier.</div>
      <a class="link-btn" href="bekerloting.html">🎡 Ga naar de bekerloting</a>
    </div>`;
  }

  FASE_VOLGORDE.forEach(faseId=>{
    if(state.fases[faseId]) html += faseCardHtml(faseId);
  });

  app.innerHTML = html || '<div class="empty-state"><p>Nog niets te tonen.</p></div>';
}

init();
</script>
</body>
</html>
