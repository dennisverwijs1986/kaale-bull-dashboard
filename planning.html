<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaale Bull — Planning Tool</title>
<style>
:root { --bg: #0f1520; --s1: #161f30; --s2: #1e2a40; --text: #f1f5f9; --muted: #94a3b8; --green: #10b981; --red: #ef4444; --orange: #f59e0b; --blue: #3b82f6; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
.wrap { max-width: 900px; margin: 0 auto; }
.card { background: var(--s1); border: 1px solid #2a3a56; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
.btn { border: none; border-radius: 6px; padding: 10px 20px; font-weight: 700; cursor: pointer; color: #000; }
.btn-green { background: var(--green); }
.err { color: var(--red); background: rgba(239,68,68,0.1); padding: 10px; border-radius: 6px; margin-top: 10px; }
.lbl { font-size: 0.72rem; font-weight: 600; color: var(--muted); }
.inp { background: var(--s2); border: 1px solid #2a3a56; color: var(--text); padding: 8px; width: 100%; border-radius: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 Kaale Bull — Planning Tool</h1>
  <div class="card">
    <label>📂 CSV Uploaden (met Thuis/Uit/Divisie kolommen) <input type="file" id="csvIn" accept=".csv" onchange="laadCSV(this)"></label>
  </div>
  <div id="stap3" class="card" style="display:none;">
    <button class="btn btn-green" onclick="verdeelEnDownload()">⬇ Download Evenwichtige Planning</button>
    <div id="verdeelError"></div>
  </div>
</div>

<script>
let rijen = []; let headers = [];

function laadCSV(input) {
  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = ev => {
    const lines = ev.target.result.trim().split(/\r?\n/);
    const sep = lines[0].includes(';') ? ';' : ',';
    headers = lines[0].split(sep).map(h => h.trim());
    rijen = lines.slice(1).map(l => {
      const cols = l.split(sep);
      let obj = {};
      headers.forEach((h, i) => obj[h] = (cols[i]||'').trim());
      return obj;
    });
    document.getElementById('stap3').style.display = 'block';
  };
  reader.readAsText(file);
}

function verdeel() {
  const thuisKol = headers.find(h => h.toLowerCase().includes('thuis'));
  const divKol = headers.find(h => h.toLowerCase().includes('divisie') || h.toLowerCase().includes('div'));
  
  let groepen = {};
  let byes = [];
  
  rijen.forEach(r => {
    if ((r[thuisKol]||'').toUpperCase().includes('BYE')) {
      byes.push({...r, Tijdstip: 'Rust'});
    } else {
      let div = (r[divKol] || 'Overig');
      if (!groepen[div]) groepen[div] = [];
      groepen[div].push(r);
    }
  });

  // Mix divisies (Round Robin)
  let gemixteWedstrijden = [];
  let keys = Object.keys(groepen);
  let max = Math.max(...keys.map(k => groepen[k].length));
  for(let i=0; i<max; i++) {
    keys.forEach(k => { if(groepen[k][i]) gemixteWedstrijden.push(groepen[k][i]); });
  }

  // Belasting-check (eenvoudig model)
  let verdeeld = [];
  let spelerBelasting = {};
  
  gemixteWedstrijden.forEach(r => {
    // In een echte implementatie zou hier de datum-loop komen
    // Voor nu: voeg toe aan resultaat
    verdeeld.push(r);
  });

  return verdeeld.concat(byes);
}

function verdeelEnDownload() {
  const result = verdeel();
  const csvContent = [headers.join(';')].concat(result.map(r => headers.map(h => r[h]||'').join(';'))).join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'planning_kaale_bull.csv';
  a.click();
}
</script>
</body>
</html>
