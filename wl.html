<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KB Wedstrijdleiding">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Kaale Bull — Wedstrijdleiding mobiel</title>
<style>
:root{
  --bg:#0f1520; --s1:#161f30; --s2:#1e2a40; --s3:#243350; --border:#2a3a56;
  --text:#f1f5f9; --muted:#94a3b8;
  --green:#10b981; --red:#ef4444; --orange:#f59e0b; --blue:#3b82f6;
  --ere:#a855f7; --eerste:#3b82f6; --beker:#f59e0b; --inhaal:#ef4444; --nnb:#06b6d4;
  --top: env(safe-area-inset-top, 0px);
  --bot: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.35;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;
  padding-top:calc(56px + var(--top));padding-bottom:calc(66px + var(--bot));min-height:100vh;}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}

/* ── TOPBAR ── */
.top{position:fixed;top:0;left:0;right:0;z-index:30;background:#080d16;border-bottom:1px solid var(--border);
  padding:var(--top) 16px 0;height:calc(56px + var(--top));display:flex;align-items:center;gap:10px;}
.top-title{font-weight:800;font-size:1.05rem;letter-spacing:.3px;flex:1;display:flex;align-items:center;gap:8px;min-width:0;}
.top-title small{font-weight:600;color:var(--muted);font-size:.75rem;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.dot.ok{background:var(--green);} .dot.bezig{background:var(--orange);} .dot.fout{background:var(--red);}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:1.15rem;background:var(--s2);}
.icon-btn:active{background:var(--s3);}
a.icon-btn{color:var(--text);text-decoration:none;}

/* ── BOTTOM NAV ── */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#080d16;border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:var(--bot);}
.nav button{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:.72rem;color:var(--muted);font-weight:600;position:relative;}
.nav button .ic{font-size:1.25rem;line-height:1;}
.nav button.act{color:var(--text);}
.nav button.act::before{content:'';position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--blue);}
.badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--nnb);color:#04222a;font-size:.68rem;font-weight:800;display:grid;place-items:center;}
.badge[hidden]{display:none;}
.badge.plan{background:var(--orange);color:#2b1a00;}
/* ── PLANNER ── */
.dchip .dn.knel{color:var(--orange);font-weight:800;}
.dchip .dn.ok{color:var(--green);font-weight:800;}
.dchip.sel .dn.knel,.dchip.sel .dn.ok{color:#fff;}
.dchip.ongedeeld:not(.sel){border-style:dashed;opacity:.8;}
.pl-uitleg{font-size:.8rem;color:var(--muted);margin:2px 2px 10px;line-height:1.45;}
.pl-lijst{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.vrij{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-top:1px solid var(--border);cursor:pointer;}
.vrij:first-child{border-top:none;}
.vrij input{width:20px;height:20px;flex-shrink:0;margin-top:1px;accent-color:var(--blue);}
.vrij .wie{font-size:.9rem;font-weight:600;line-height:1.3;}
.vrij .tijden{font-size:.85rem;margin-top:3px;font-variant-numeric:tabular-nums;}
.vrij .tijden .oud{color:var(--muted);text-decoration:line-through;}
.vrij .tijden .nw{font-weight:800;}
.vrij.uit .wie,.vrij.uit .tijden{opacity:.45;}
.pl-knel{font-size:.84rem;padding:8px 12px;border-top:1px solid var(--border);}
.pl-knel:first-child{border-top:none;}
.pl-knel .soort{font-size:.7rem;font-weight:800;padding:1px 6px;border-radius:6px;margin-left:4px;white-space:nowrap;}
.pl-knel .soort.krap{background:rgba(245,158,11,.15);color:var(--orange);}
.pl-knel .soort.rood{background:rgba(239,68,68,.15);color:var(--red);}
.pl-balk{position:sticky;bottom:calc(66px + var(--bot));z-index:20;display:flex;gap:8px;margin:12px -16px 0;padding:10px 16px;background:rgba(15,21,32,.96);border-top:1px solid var(--border);backdrop-filter:blur(6px);}
.pl-balk .btn{flex:1;min-height:46px;}
.pl-balk .btn-pri{flex:2;}
.pl-schema summary{cursor:pointer;font-size:.72rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;list-style:none;}
.pl-schema summary::-webkit-details-marker{display:none;}
.pl-slot{display:flex;gap:10px;padding:8px 12px;border-top:1px solid var(--border);font-size:.82rem;}
.pl-slot:first-child{border-top:none;}
.pl-slot .t{font-weight:800;min-width:44px;font-variant-numeric:tabular-nums;}
.pl-slot .w div{line-height:1.4;}
.pl-slot .w .nieuw{color:#93c5fd;}

/* ── ALGEMEEN ── */
.wrap{padding:12px 16px 24px;}
.sec-title{font-size:.72rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;}
.sec-title:first-child{margin-top:4px;}
.muted{color:var(--muted);}
.leeg{padding:28px 12px;text-align:center;color:var(--muted);background:var(--s1);border:1px dashed var(--border);border-radius:12px;}
.fout-box{padding:12px 14px;border-radius:10px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fecaca;margin-bottom:12px;}

/* datum-chips (horizontaal scrollen) */
.datums{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;scrollbar-width:none;scroll-snap-type:x proximity;}
.datums::-webkit-scrollbar{display:none;}
.dchip{flex-shrink:0;scroll-snap-align:center;min-width:74px;padding:8px 10px;border-radius:12px;background:var(--s1);
  border:1px solid var(--border);text-align:center;}
.dchip .dw{font-size:.7rem;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.5px;}
.dchip .dd{font-weight:800;font-size:1rem;}
.dchip .dn{font-size:.68rem;color:var(--muted);margin-top:1px;}
.dchip.sel{background:var(--blue);border-color:var(--blue);}
.dchip.sel .dw,.dchip.sel .dn{color:#dbeafe;}
.dchip.vandaag:not(.sel){border-color:var(--green);}
.dchip.vol .dn{color:var(--orange);font-weight:700;}
.dchip.teveel .dn{color:var(--red);font-weight:800;}
.dchip.sel.vol .dn,.dchip.sel.teveel .dn{color:#fff;}

.stats{display:flex;gap:8px;margin:2px 0 10px;flex-wrap:wrap;}
.stat{flex:1;min-width:70px;background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:7px 8px;text-align:center;}
.stat b{display:block;font-size:1.1rem;}
.stat span{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}

.seg{display:flex;background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px;margin-bottom:6px;}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:.82rem;font-weight:700;color:var(--muted);}
.seg button.act{background:var(--s3);color:var(--text);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);margin:6px 2px 2px;}
.switch{position:relative;width:44px;height:26px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch span{position:absolute;inset:0;border-radius:13px;background:var(--s3);transition:.15s;}
.switch span::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#cbd5e1;transition:.15s;}
.switch input:checked + span{background:var(--green);}
.switch input:checked + span::after{transform:translateX(18px);background:#fff;}

/* tijdslot-groep */
.slot-hdr{display:flex;align-items:baseline;gap:8px;margin:16px 2px 6px;}
.slot-hdr .t{font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums;}
.slot-hdr .c{font-size:.75rem;color:var(--muted);font-weight:700;}
.slot-hdr .c.vol{color:var(--orange);}

/* wedstrijdkaart — namen onder elkaar, altijd volledig leesbaar */
.card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--s1);border:1px solid var(--border);
  border-left:4px solid var(--muted);border-radius:12px;padding:10px 10px 10px 12px;margin-bottom:8px;}
.card:active{background:var(--s2);}
.card.ere{border-left-color:var(--ere);} .card.eerste{border-left-color:var(--eerste);} .card.beker{border-left-color:var(--beker);}
.card.gespeeld{opacity:.5;}
.card.conflict{box-shadow:inset 0 0 0 1px rgba(239,68,68,.55);}
.card-main{flex:1;min-width:0;}
.card-when{font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:3px;font-variant-numeric:tabular-nums;}
.names{display:flex;flex-direction:column;}
.names .n{font-weight:700;font-size:1.02rem;overflow-wrap:anywhere;}
.names .vs{font-size:.68rem;color:var(--muted);font-weight:600;margin:1px 0;letter-spacing:.5px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.chip{font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--s3);color:var(--muted);white-space:nowrap;}
.chip.ere{background:rgba(168,85,247,.18);color:#d8b4fe;} .chip.eerste{background:rgba(59,130,246,.18);color:#93c5fd;}
.chip.beker{background:rgba(245,158,11,.18);color:#fcd34d;} .chip.inhaal{background:rgba(239,68,68,.16);color:#fca5a5;}
.chip.nnb{background:rgba(6,182,212,.16);color:#67e8f9;} .chip.rood{background:rgba(239,68,68,.2);color:#fecaca;}
.chip.groen{background:rgba(16,185,129,.18);color:#6ee7b7;}
.chip.oranje{background:rgba(245,158,11,.18);color:#fcd34d;}
/* ── RUILEN ── */
.ruil-knop{width:100%;margin-top:10px;padding:12px;border-radius:10px;border:1.5px solid var(--blue);background:rgba(59,130,246,.10);color:var(--text);font-weight:800;font-size:.92rem;}
.ruil-lijst{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.ruil-rij{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-top:1px solid var(--border);border-left:4px solid var(--green);}
.ruil-rij:first-child{border-top:none;}
.ruil-rij.krap{border-left-color:var(--orange);}
.ruil-rij.rood{border-left-color:var(--red);}
.ruil-rij:active{background:var(--s2);}
.ruil-rij .t{font-weight:800;min-width:46px;font-variant-numeric:tabular-nums;}
.ruil-rij .w{flex:1;min-width:0;font-size:.9rem;font-weight:600;line-height:1.3;}
.ruil-rij .w .chips{margin-top:4px;}
.ruil-rij.uit{opacity:.45;pointer-events:none;border-left-color:var(--border);}
.card-go{font-size:1.4rem;color:var(--muted);flex-shrink:0;}

/* zoeken */
.zoek{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);background:var(--s1);font-size:1rem;outline:none;}
.zoek:focus{border-color:var(--blue);}

/* formulieren */
.veld{margin-bottom:12px;}
.veld label{display:block;font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.inp{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--s2);font-size:1rem;outline:none;min-height:46px;}
.inp:focus{border-color:var(--blue);}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px;}
.rij2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pill-rij{display:flex;gap:8px;flex-wrap:wrap;}
.pill{padding:10px 14px;border-radius:10px;background:var(--s2);border:1px solid var(--border);font-weight:700;font-size:.88rem;}
.pill.act{background:var(--blue);border-color:var(--blue);}
.pill.nnb.act{background:var(--nnb);border-color:var(--nnb);color:#04222a;}

/* tijdslot-raster */
.sloten{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.slot{padding:10px 4px;border-radius:10px;border:1.5px solid var(--green);background:rgba(16,185,129,.08);text-align:center;}
.slot .st{font-weight:800;font-size:1.02rem;font-variant-numeric:tabular-nums;}
.slot .sl{font-size:.68rem;opacity:.9;margin-top:1px;}
.slot.conflict{border-color:var(--red);background:rgba(239,68,68,.12);}
.slot.krap{border-color:var(--orange);background:rgba(245,158,11,.10);}
.slot.vol{border-color:var(--muted);background:rgba(148,163,184,.08);color:var(--muted);}
.slot.sel{outline:3px solid var(--text);outline-offset:1px;}
.slot-legenda{font-size:.72rem;color:var(--muted);margin-top:8px;}
.link-btn{color:var(--blue);font-weight:700;font-size:.85rem;padding:8px 0;}

/* spelers-context in het verzetscherm */
.ctx{background:var(--s1);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.ctx-rij{display:flex;gap:10px;padding:9px 12px;border-top:1px solid var(--border);font-size:.88rem;align-items:baseline;}
.ctx-rij:first-child{border-top:none;}
.ctx-rij .t{font-weight:800;min-width:44px;font-variant-numeric:tabular-nums;}
.ctx-rij.rood{background:rgba(239,68,68,.12);}
.ctx-rij.rood .t{color:#fca5a5;}
.ctx-rij.nieuw{background:rgba(59,130,246,.12);}
.ctx-rij.krap .t{color:var(--orange);}
.ruimte{border:1px solid var(--blue);background:rgba(59,130,246,.10);border-radius:10px;padding:10px 12px;font-size:.86rem;margin-top:12px;line-height:1.45;}
.ruimte .ctx{margin-top:8px;}
.ruimte-knop{width:100%;margin-top:12px;padding:12px;border-radius:10px;border:1.5px solid var(--blue);background:rgba(59,130,246,.12);color:var(--text);font-weight:800;font-size:.92rem;}

.warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.45);color:#fde68a;border-radius:10px;padding:10px 12px;font-size:.86rem;margin-top:12px;}
.warn div+div{margin-top:5px;}
.info{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.35);border-radius:10px;padding:10px 12px;font-size:.86rem;margin-top:10px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:.92rem;}
.check input{width:22px;height:22px;accent-color:var(--blue);flex-shrink:0;}

.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 12px;border-radius:12px;font-weight:800;font-size:.92rem;white-space:nowrap;}
.btn-pri{background:var(--green);color:#022c1f;}
.btn-sec{background:var(--s3);}
.btn-warn{background:var(--orange);color:#2b1a00;}
.btn:disabled{opacity:1;background:var(--s3);color:var(--muted);}
.btn-klein{min-height:36px;padding:0 12px;font-size:.82rem;border-radius:9px;background:var(--s3);font-weight:700;}

/* ── SHEET (verzetten) ── */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s;}
.sheet-bg.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - 24px - var(--top));background:var(--bg);
  border-radius:18px 18px 0 0;border-top:1px solid var(--border);display:flex;flex-direction:column;
  transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease;}
.sheet-kop{padding:12px 16px 12px;border-bottom:1px solid var(--border);background:var(--s1);border-radius:18px 18px 0 0;display:flex;gap:10px;align-items:flex-start;}
.sheet-kop .names .n{font-size:1.15rem;}
.sheet-kop .nu{font-size:.8rem;color:var(--muted);margin-top:6px;font-weight:600;}
.sheet-body{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch;flex:1;}
/* ── mededelingen (TV + spelers-app) ── */
.mdd-btn{position:relative;}
.mdd-btn .live{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--s2);}
.mdd-btn .live[hidden]{display:none;}
.mdd-blok{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px;}
.mdd-blok-kop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.mdd-blok-kop b{font-size:.98rem;}
.mdd-stat{font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--s3);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.mdd-stat.live{background:var(--green);color:#022c1f;}
.mdd-blok textarea{width:100%;min-height:84px;resize:vertical;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;color:var(--text);font-size:16px;}
.mdd-blok textarea:focus{outline:none;border-color:var(--blue);}
.mdd-onder{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;}
.mdd-teller{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;}
.schakel{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:700;cursor:pointer;}
.schakel input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--s3);position:relative;transition:background .15s;flex-shrink:0;}
.schakel input::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;}
.schakel input:checked{background:var(--green);}
.schakel input:checked::after{transform:translateX(18px);}
.mdd-leeg{font-size:.8rem;color:var(--muted);margin-top:6px;}
.mdd-wis{font-size:.8rem;font-weight:700;color:var(--red);padding:6px 0;}
.sheet-voet{padding:10px 16px calc(10px + var(--bot));border-top:1px solid var(--border);background:var(--s1);display:grid;grid-template-columns:1fr 1.3fr;gap:10px;}

/* installatie-hint */
.install{display:flex;gap:10px;align-items:center;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.35);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.85rem;}
.install div{flex:1;}

.bk-kop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px;}
.bk-kop h2{font-size:1.1rem;font-weight:800;}
.bk-kop h2 small{font-size:.72rem;color:var(--muted);font-weight:700;margin-left:4px;}
.bk-link{font-size:.82rem;font-weight:700;color:var(--blue);text-decoration:none;padding:8px 0;white-space:nowrap;}
.bk-voortgang{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.bk-fase{font-size:.74rem;font-weight:800;padding:5px 9px;border-radius:8px;background:var(--s1);border:1px solid var(--border);color:var(--muted);}
.bk-fase.klaar{border-color:rgba(16,185,129,.5);color:#6ee7b7;}
.bk-fase.bezig{border-color:rgba(245,158,11,.5);color:#fcd34d;}
.bk-kampioen{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.45);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:.95rem;}
.uitslag{display:grid;grid-template-columns:1fr auto;gap:3px 12px;align-items:baseline;}
.uitslag .n{font-weight:600;font-size:1rem;overflow-wrap:anywhere;}
.uitslag .n.win{font-weight:800;}
.uitslag .n.verlies{color:var(--muted);}
.uitslag .s{font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums;color:var(--muted);}
.uitslag .s.win{color:#6ee7b7;}
details.bk-wacht{margin-top:16px;background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
details.bk-wacht summary{padding:12px;font-size:.85rem;font-weight:800;color:var(--muted);cursor:pointer;list-style-position:inside;}
.bk-wacht-rij{font-size:.86rem;padding:9px 12px;border-top:1px solid var(--border);}
.score-kol{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;}
.score-kol .kt{font-size:.8rem;font-weight:800;color:var(--muted);align-self:end;overflow-wrap:anywhere;}
.score-btn{display:block;width:100%;padding:13px 4px;border-radius:12px;border:1.5px solid var(--border);background:var(--s1);font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums;}
.score-btn:active{background:var(--s2);}
.score-btn.hint{border-color:var(--green);border-style:dashed;}
.score-btn.sel{background:var(--green);border-color:var(--green);border-style:solid;color:#022c1f;}
.gevolg{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.4);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-top:6px;}
.gevolg div+div{margin-top:4px;}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + var(--bot));z-index:60;padding:12px 14px;border-radius:12px;background:var(--s3);
  border:1px solid var(--border);font-weight:600;font-size:.9rem;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;}
.toast.show{opacity:1;transform:none;}
.toast.groen{background:#064e3b;border-color:var(--green);} .toast.rood{background:#7f1d1d;border-color:var(--red);} .toast.oranje{background:#78350f;border-color:var(--orange);}


@media (min-width:700px){ .wrap,.sheet{max-width:640px;margin-left:auto;margin-right:auto;} .sheet{border-left:1px solid var(--border);border-right:1px solid var(--border);} }

/* ── compacte kaart: namen links zonder losse vs-regel, chips rechts ── */
.card{padding:7px 8px 7px 12px;margin-bottom:6px;border-radius:10px;}
.names .n{line-height:1.22;}
.names .vs{display:inline;font-size:.68rem;margin:0 5px 0 0;text-transform:uppercase;}
.card-main .chips{margin-top:4px;gap:4px;}
.card-main .chip{padding:1px 6px;}
</style>

  <a class="icon-btn" href="index.html" aria-label="Volledig dashboard" title="Volledig dashboard">🖥</a>

<div class="sheet-bg" id="sheetBg" onclick="sluitSheet()"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog"></section>
<div class="toast" id="toast"></div>

<script src="planner-kern.js?v=1"></script>
<script>
// ══════════════════════════════════════════
//  SUPABASE (zelfde project en sleutel als index.html)
// ══════════════════════════════════════════
const SB_URL = 'https://ctxurzqtglckairgbjno.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0eHVyenF0Z2xja2Fpcmdiam5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzExNjYsImV4cCI6MjA5NDcwNzE2Nn0.Ty3nNEyNfZVebxqXRS5RALM7JA5AdghIYAS6VjfFITQ';
const HDR = { 'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=representation' };
const sbGet   = async (t,q='') => { const r=await fetch(`${SB_URL}/rest/v1/${t}?${q}`,{headers:HDR,cache:'no-store'}); if(!r.ok) throw new Error(await r.text()); return r.json(); };
const sbPost  = async (t,b)    => { const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:HDR,body:JSON.stringify(b)}); if(!r.ok) throw new Error(await r.text()); return r.json(); };
const sbPatch = async (t,id,b) => { const r=await fetch(`${SB_URL}/rest/v1/${t}?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:HDR,body:JSON.stringify(b)}); if(!r.ok) throw new Error(await r.text()); return r.json(); };

// Zelfde vaste tijdsloten en regels als de Planning Tool / verzet-modal in index.html
const PT_SLOTS = [
  {tijd:'19:30',cap:4},{tijd:'19:50',cap:4},{tijd:'20:10',cap:4},
  {tijd:'20:30',cap:4},{tijd:'20:50',cap:4},{tijd:'21:10',cap:4},
  {tijd:'21:30',cap:4},{tijd:'21:50',cap:3},{tijd:'22:10',cap:3},
  {tijd:'22:30',cap:3},{tijd:'22:50',cap:3}
];
const MAX_PER_AVOND = PT_SLOTS.reduce((t,s)=>t+s.cap, 0); // nu 40
const MIN_RUST_MIN  = 20;

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let W = [], spelers = [], leiders = [];
let geladen = false, laadFout = '';
const S = { view:'avond', datum:null, div:'alle', toonGespeeld:false, zoek:'' };
let sheet = null;
let installPrompt = null;

// ══════════════════════════════════════════
//  HULPFUNCTIES
// ══════════════════════════════════════════
const $ = s => document.querySelector(s);
function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jsAttr(v){ return esc(JSON.stringify(v===undefined?null:v)); }
const naarMin = t => { const d=/^(\d{1,2}):(\d{2})/.exec(t||''); return d ? (+d[1])*60+(+d[2]) : null; };
function vandaag(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
const WD=['zo','ma','di','wo','do','vr','za'], WDL=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MND=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
function dObj(d){ const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd); }
function fmtKort(d){ if(!d) return ''; const o=dObj(d); return `${WD[o.getDay()]} ${o.getDate()} ${MND[o.getMonth()]}`; }
function fmtLang(d){ if(!d) return ''; const o=dObj(d); return `${WDL[o.getDay()]} ${o.getDate()} ${MND[o.getMonth()]}`; }
const isBeker = m => (m.divisie||'').toLowerCase().includes('beker');
function divKey(m){
  const d=(m.divisie||'').toLowerCase();
  if(d.includes('beker')) return 'beker';
  if(d.includes('ere')) return 'ere';
  if(d.includes('eerste')||d.includes('1e')) return 'eerste';
  return 'overig';
}
function divChip(m){
  const k=divKey(m);
  return `<span class="chip ${k}">${{ere:'Ere',eerste:'1e Div',beker:'Beker',overig:esc(m.divisie||'Div')}[k]}</span>`;
}
const deelSpeler = (a,b) => a.thuis===b.thuis || a.thuis===b.uit || a.uit===b.thuis || a.uit===b.uit;
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

function toast(msg,type=''){
  const t=$('#toast'); t.textContent=msg; t.className=`toast show ${type}`;
  clearTimeout(t._h); t._h=setTimeout(()=>t.className='toast',3400);
}
function zetDot(s){ $('#dot').className='dot '+s; }
function lsGet(k){ try{return localStorage.getItem(k)||'';}catch(e){return '';} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }

// Speelavonden = datums met minstens één wedstrijd met een echte datum
function avonden(){ return [...new Set(W.filter(w=>!w.datum_nnb && w.datum).map(w=>w.datum))].sort(); }
function telAvond(d, zonderId){ return W.filter(w=>w.datum===d && !w.datum_nnb && w.id!==zonderId).length; }

// Avondplanner-kern (planner-kern.js), gedeeld met index.html en optimaliseer.html
let _ap=null;
function ap(){ return _ap || (_ap = AvondPlanner.maak(PT_SLOTS)); }
// Tijdstip zoals het wordt als het 'Ruimte maken'-voorstel in het verzet-scherm wordt doorgevoerd
function tijdNaPlan(w){
  const p=sheet?.plan; if(p){ const mv=p.moves.find(x=>x.id===w.id); if(mv) return mv.nieuw; }
  return w.tijdstip;
}

// Status van één tijdslot voor een (nieuwe) wedstrijd — gelijk aan verzetSlotStatus() in index.html
//  niveau: 'ok' (≥2 slots rust) · 'krap' (direct achter elkaar of één slot ertussen) · 'zelfde' (zelfde slot)
function slotStatus(datum, tijd, paar, zonderId){
  const nieuw=naarMin(tijd);
  const def=PT_SLOTS.find(s=>s.tijd===tijd);
  const cap=def?def.cap:4;
  const bezet=W.filter(w=>w.datum===datum && tijdNaPlan(w)===tijd && w.id!==zonderId && !w.datum_nnb).length;
  let niveau='ok';
  if(paar && paar.thuis && paar.uit && nieuw!==null){
    const andere=W.filter(w=>w.id!==zonderId && w.datum===datum && !w.datum_nnb && tijdNaPlan(w) && deelSpeler(w,paar))
      .map(w=>naarMin(tijdNaPlan(w))).filter(x=>x!==null);
    niveau=ap().rustNiveau(nieuw, andere);
  }
  return { bezet, cap, vol: bezet>=cap, conflict: niveau==='zelfde', niveau };
}
// Beste slot voor wedstrijd m op datum d: eerst groen, anders krap; nooit dubbel of vol.
function besteSlot(d, m){
  let krap=null;
  for(const s of PT_SLOTS){
    const x=slotStatus(d,s.tijd,m,m.id);
    if(x.vol || x.conflict) continue;
    if(x.niveau==='ok') return s.tijd;
    if(!krap) krap=s.tijd;
  }
  return krap;
}
function rustConflicten(datum, tijd, paar, zonderId){
  const nieuw=naarMin(tijd); if(nieuw===null) return [];
  return W.filter(w=>{
    if(w.id===zonderId || w.datum!==datum || w.datum_nnb || !tijdNaPlan(w)) return false;
    const wm=naarMin(tijdNaPlan(w)); if(wm===null) return false;
    return deelSpeler(w,paar) && Math.abs(wm-nieuw) < MIN_RUST_MIN;
  });
}
// Bestaande rustconflicten binnen de huidige planning (voor de rode markering op kaarten)
function heeftRustConflict(m){
  if(m.datum_nnb || !m.tijdstip) return false;
  return rustConflicten(m.datum, m.tijdstip, m, m.id).length>0;
}

// ══════════════════════════════════════════
//  DATA
// ══════════════════════════════════════════
let laadBezig=false;
async function laadData(stil){
  if(laadBezig) return; laadBezig=true;
  zetDot('bezig');
  try{
    let kantelRij;
    [W, spelers, leiders, , kantelRij] = await Promise.all([
      sbGet('wedstrijden','select=id,datum,tijdstip,divisie,thuis,uit,speelronde,status,uitslag,datum_nnb,is_inhaal,originele_datum,notitie,bord&order=datum.asc,tijdstip.asc'),
      sbGet('spelers','select=naam&order=naam.asc'),
      sbGet('wedstrijdleiding','select=naam&actief=eq.true&order=naam.asc'),
      laadBeker(),
      sbGet('instellingen','sleutel=eq.planning_kantel_dag&select=waarde').catch(()=>[])
    ]);
    const k=parseInt(kantelRij?.[0]?.waarde,10); PL.kantel = k>=1 && k<=28 ? k : 24;
    geladen=true; laadFout='';
    zetDot('ok');
    if(!stil) toast('Bijgewerkt','');
  }catch(e){
    laadFout = navigator.onLine===false ? 'Geen internetverbinding.' : `Kan data niet laden: ${e.message}`;
    zetDot('fout');
  }finally{ laadBezig=false; }
  updateBadge();
  render();
  if(sheet) renderSheet();
  else if(scoreSheet && !scoreSheet.bezig) renderScoreSheet();
}
function updateBadge(){
  updatePlanBadge();
  const n=W.filter(w=>w.datum_nnb && w.status!=='gespeeld').length;
  const b=$('#nnbBadge'); b.hidden=!n; b.textContent=n;
}

// ══════════════════════════════════════════
//  PLANNER — avonden zonder spelen-schrijven-spelen (zelfde kern als optimaliseer.html)
//  Alleen schuiven binnen een avond, geen mail: spelers zien het in de app en agenda.
// ══════════════════════════════════════════
const PL = { datum:null, cache:{}, bezig:false, kantel:24 };
// Laatste datum die al met de leden gedeeld is (zelfde regel als de agenda-feed en de spelersapp):
// vóór de kanteldag t/m eind volgende maand, vanaf de kanteldag t/m eind van de maand daarna.
function plGedeeldTot(){
  const n=new Date(); const extra = n.getDate() >= PL.kantel ? 3 : 2;
  const e=new Date(n.getFullYear(), n.getMonth()+extra, 0);
  return `${e.getFullYear()}-${String(e.getMonth()+1).padStart(2,'0')}-${String(e.getDate()).padStart(2,'0')}`;
}
const PL_SOORT = { zelfde:['2× in hetzelfde slot','rood'], direct:['direct achter elkaar','rood'], eenErtussen:['spelen → schrijven → spelen','krap'] };

function plWedstrijden(d){
  return W.filter(w=>w.datum===d && !w.datum_nnb && ap().slotIndex(w.tijdstip)>=0)
    .map(w=>({...w, vast: w.status==='gespeeld' || w.bord!=null}));
}
function plTel(d){
  const ms=plWedstrijden(d); const AP=ap();
  const t=AP.telKnelpunten(AP.knelpunten(ms, ms.map(w=>AP.slotIndex(w.tijdstip))));
  return t.zelfde+t.direct+t.eenErtussen;
}
function updatePlanBadge(){
  const b=$('#planBadge'); if(!b || !geladen) return;
  const v=vandaag();
  const tot=plGedeeldTot();
  const n=avonden().filter(d=>d>=v && d<=tot && plTel(d)>0).length;
  b.hidden=!n; b.textContent=n;
}
function plKiesAvond(d){ PL.datum=d; render(); }

// Voorstel voor een avond; opnieuw berekend zodra de planning van die avond verandert.
function plVoorstel(d){
  const ms=plWedstrijden(d);
  const sig=ms.map(w=>w.id+'@'+w.tijdstip+(w.vast?'!':'')).sort().join('|');
  const c=PL.cache[d];
  if(c && c.sig===sig) return c;
  if(c && c.rekenen) return c;
  const nieuw={ sig, rekenen:true, ms };
  PL.cache[d]=nieuw;
  setTimeout(()=>{
    const AP=ap();
    const orig=ms.map(w=>AP.slotIndex(w.tijdstip));
    const voorstel=AP.optimaliseer(ms);
    const gekozen=new Set(voorstel.map((s,i)=>s!==orig[i]?i:-1).filter(i=>i>=0));
    Object.assign(nieuw,{ rekenen:false, orig, voorstel, gekozen, cap:AP.capaciteiten(orig, Math.max(...orig)) });
    if(S.view==='plan' && PL.datum===d) render();
  },30);
  return nieuw;
}

function plDatumChips(gekozen){
  const v=vandaag();
  return `<div class="datums" id="planDatums">` + avonden().filter(d=>d>=v).map(d=>{
    const n=plTel(d), gedeeld=d<=plGedeeldTot();
    return `<button class="dchip ${d===gekozen?'sel':''} ${d===v?'vandaag':''} ${gedeeld?'':'ongedeeld'}" onclick="plKiesAvond(${jsAttr(d)})">
      <div class="dw">${d===v?'vandaag':WD[dObj(d).getDay()]}${gedeeld?'':' 🔒'}</div>
      <div class="dd">${dObj(d).getDate()} ${MND[dObj(d).getMonth()]}</div>
      <div class="dn ${n?'knel':'ok'}">${n?`${n} knelp.`:'✓ goed'}</div></button>`;
  }).join('') + `</div>`;
}

function plKnelHtml(ms, slots){
  const AP=ap(); const lijst=AP.knelpunten(ms, slots);
  if(!lijst.length) return '';
  return `<div class="pl-lijst">${lijst.map(k=>{
    const [txt,cls]=PL_SOORT[k.soort];
    return `<div class="pl-knel"><b>${esc(k.speler)}</b> · ${PT_SLOTS[slots[k.a]].tijd} en ${PT_SLOTS[slots[k.b]].tijd}<span class="soort ${cls}">${txt}</span></div>`;
  }).join('')}</div>`;
}

function htmlPlan(){
  const v=vandaag();
  const datums=avonden().filter(d=>d>=v);
  if(!datums.length) return '<div class="leeg">Geen komende speelavonden.</div>';
  if(!PL.datum || !datums.includes(PL.datum)) PL.datum = datums.find(d=>plTel(d)>0) || datums[0];
  const d=PL.datum;
  const kop = plDatumChips(d) + `<div class="pl-uitleg">Elke speler minstens twee tijdsloten rust, zodat niemand spelen, schrijven en weer spelen achter elkaar heeft. Alleen schuiven binnen de avond, geen mail.${d>plGedeeldTot()?'<br>🔒 Deze avond is nog niet met de leden gedeeld.':''}</div>`;
  const vs=plVoorstel(d);
  if(vs.rekenen) return kop + '<div class="leeg">🧩 Avond doorrekenen…</div>';

  const AP=ap(); const { ms, orig, voorstel, gekozen, cap } = vs;
  const nu=AP.telKnelpunten(AP.knelpunten(ms, orig));
  const naSlots=AP.slotsMetSelectie(orig, voorstel, gekozen);
  const na=AP.telKnelpunten(AP.knelpunten(ms, naSlots));
  const vol=AP.overvol(naSlots, cap);
  const versch=voorstel.map((s,i)=>({i,s})).filter(x=>x.s!==orig[x.i]).sort((a,b)=>orig[a.i]-orig[b.i]);
  const totNu=nu.zelfde+nu.direct+nu.eenErtussen, totNa=na.zelfde+na.direct+na.eenErtussen;

  const stats = `<div class="stats">
    <div class="stat"><b style="color:${nu.direct?'var(--red)':'var(--green)'}">${nu.direct}${versch.length?`<span style="font-size:.75rem;color:var(--muted)"> → ${na.direct}</span>`:''}</b><span>achter elkaar</span></div>
    <div class="stat"><b style="color:${nu.eenErtussen?'var(--orange)':'var(--green)'}">${nu.eenErtussen}${versch.length?`<span style="font-size:.75rem;color:var(--muted)"> → ${na.eenErtussen}</span>`:''}</b><span>1 slot ertussen</span></div>
    <div class="stat"><b style="color:var(--blue)">${gekozen.size}</b><span>verschuiven</span></div>
  </div>`;

  if(!versch.length){
    return kop + stats + (totNu
      ? `<div class="warn"><div>⚠ Hier vindt de planner geen betere indeling binnen de avond. Kijk of een wedstrijd naar een andere avond kan.</div></div><div class="sec-title">Knelpunten</div>${plKnelHtml(ms, orig)}`
      : '<div class="leeg">Deze avond staat goed 🎯<br>Iedereen heeft genoeg rust.</div>');
  }

  const rijen = versch.map(({i,s})=>{ const w=ms[i]; const aan=gekozen.has(i);
    return `<label class="vrij ${aan?'':'uit'}"><input type="checkbox" ${aan?'checked':''} onchange="plToggle(${i},this.checked)">
      <div><div class="wie">${esc(w.thuis)} – ${esc(w.uit)}</div>
      <div class="tijden"><span class="oud">${PT_SLOTS[orig[i]].tijd}</span> → <span class="nw">${PT_SLOTS[s].tijd}</span> ${divChip(w)}${w.is_inhaal?' <span class="chip inhaal">Inhaal</span>':''}</div></div></label>`; }).join('');

  let melding='';
  if(vol.length) melding=`<div class="warn"><div>⚠ Met deze selectie zit ${vol.map(x=>`${PT_SLOTS[x.i].tijd} (${x.n}/${x.cap})`).join(', ')} te vol. Vink de wedstrijd die erop past ook aan.</div></div>`;
  else if(gekozen.size && totNa) melding=`<div class="warn"><div>⚠ Met alleen deze selectie blijven er ${totNa} knelpunt${totNa>1?'en':''} over: de verschuivingen hangen samen.</div></div>`;

  const schema = PT_SLOTS.map((sl,si)=>{
    const hier=ms.map((w,i)=>({w,i})).filter(x=>naSlots[x.i]===si);
    if(!hier.length) return '';
    return `<div class="pl-slot"><span class="t">${sl.tijd}</span><div class="w">${hier.map(({w,i})=>`<div class="${naSlots[i]!==orig[i]?'nieuw':''}">${esc(w.thuis)} – ${esc(w.uit)}${naSlots[i]!==orig[i]?` <span class="muted">(was ${PT_SLOTS[orig[i]].tijd})</span>`:''}</div>`).join('')}</div></div>`;
  }).join('');

  return kop + stats + `
    <div class="sec-title">Voorgestelde verschuivingen</div>
    <div class="pl-lijst">${rijen}</div>
    ${melding}
    ${totNa ? `<div class="sec-title">Knelpunten na selectie</div>${plKnelHtml(ms, naSlots)}` : ''}
    <details class="pl-schema"><summary>▸ Schema na selectie</summary><div class="pl-lijst">${schema}</div></details>
    <div class="pl-balk">
      <button class="btn btn-sec" onclick="plAlles(false)">Niets</button>
      <button class="btn btn-sec" onclick="plAlles(true)">Alles</button>
      <button class="btn btn-pri" ${(!gekozen.size||vol.length||PL.bezig)?'disabled':''} onclick="plDoorvoeren()">${PL.bezig?'Bezig…':`Doorvoeren (${gekozen.size})`}</button>
    </div>`;
}

function plToggle(i,aan){ const c=PL.cache[PL.datum]; if(!c) return; aan?c.gekozen.add(i):c.gekozen.delete(i); const y=window.scrollY; render(); window.scrollTo(0,y); }
function plAlles(aan){ const c=PL.cache[PL.datum]; if(!c) return; c.gekozen=new Set(aan?c.voorstel.map((s,i)=>s!==c.orig[i]?i:-1).filter(i=>i>=0):[]); const y=window.scrollY; render(); window.scrollTo(0,y); }

async function plDoorvoeren(){
  const d=PL.datum, c=PL.cache[d]; if(!c || PL.bezig) return;
  const keuze=[...c.gekozen]; if(!keuze.length) return;
  if(!confirm(`${keuze.length} wedstrijd(en) op ${fmtKort(d)} naar een ander tijdslot zetten?\n\nSpelers krijgen geen mail; de app en hun agenda passen zich vanzelf aan.`)) return;
  PL.bezig=true; render();
  try{
    const vers=await sbGet('wedstrijden',`datum=eq.${d}&select=id,tijdstip,status,bord,datum_nnb`);
    const perId=new Map(vers.map(w=>[w.id,w]));
    const versIn=vers.filter(v=>!v.datum_nnb && ap().slotIndex(v.tijdstip)>=0);
    const gewijzigd = versIn.length!==c.ms.length
      || c.ms.some((w,i)=>{ const v=perId.get(w.id); return !v || v.datum_nnb || v.tijdstip!==PT_SLOTS[c.orig[i]].tijd; })
      || keuze.some(i=>{ const v=perId.get(c.ms[i].id); return v.status==='gespeeld' || v.bord!=null; });
    if(gewijzigd){ PL.bezig=false; delete PL.cache[d]; toast('De avond is intussen gewijzigd. Ik reken opnieuw.','rood'); await laadData(true); return; }

    const door=lsGet('wl_door') || 'Wedstrijdleiding';
    let gelukt=0, fouten=0;
    for(const i of keuze){
      const w=c.ms[i], oud=PT_SLOTS[c.orig[i]].tijd, nw=PT_SLOTS[c.voorstel[i]].tijd;
      try{
        await sbPatch('wedstrijden', w.id, { tijdstip:nw });
        const lw=W.find(x=>x.id===w.id); if(lw) lw.tijdstip=nw;
        gelukt++;
        try{
          await sbPost('wijziging_log',{ wedstrijd_id:w.id, thuis:w.thuis, uit:w.uit, divisie:w.divisie||null, actie:'verzet',
            oude_datum:d, nieuwe_datum:d, oude_tijdstip:oud, nieuwe_tijdstip:nw,
            gewijzigd_door:`${door} (avondplanner)`, notitie:'Ander tijdslot (zelfde avond) – avondplanner', mail_verstuurd:false });
        }catch(e){ console.error('Kon verschuiving niet loggen:',e); }
      }catch(e){ fouten++; console.error(e); }
    }
    toast(`✓ ${gelukt} verschoven${fouten?` · ${fouten} mislukt`:''}`, fouten?'rood':'groen');
  }catch(e){ toast(`Fout: ${e.message}`,'rood'); }
  PL.bezig=false; delete PL.cache[d];
  await laadData(true);
}

function centreerDatum(sel){

  box.scrollLeft = c.offsetLeft - box.clientWidth/2 + c.offsetWidth/2;

function datumChips(id, gekozen, klik, zonderId, alleenVanaf){

    const cls=[d===gekozen?'sel':'', d===v?'vandaag':'', n>=MAX_PER_AVOND?'teveel':(n>=MAX_PER_AVOND-2?'vol':'')].join(' ');

function kiesAvond(d){ S.datum=d; render(); }
function htmlAvond(){
  const datums=avonden();
  if(!datums.length) return '<div class="leeg">Geen wedstrijden gevonden.</div>';
  if(!S.datum || !datums.includes(S.datum)) S.datum = datums.find(d=>d>=vandaag()) || datums[datums.length-1];
  const d=S.datum;
  const alle=W.filter(w=>w.datum===d && !w.datum_nnb);
  const open=alle.filter(w=>w.status!=='gespeeld');
  const eind = (()=>{ const t=new Date(dObj(d)); t.setHours(19,30+Math.ceil(alle.length/4)*20,0,0); return `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`; })();

  let lijst=alle.filter(w=>S.toonGespeeld || w.status!=='gespeeld');
  if(S.div!=='alle') lijst=lijst.filter(w=>divKey(w)===S.div);

  const groepen={};
  lijst.forEach(w=>{ const k=(!isBeker(w) && w.tijdstip) ? w.tijdstip : (w.tijdstip||'zonder'); (groepen[k]=groepen[k]||[]).push(w); });
  const sleutels=Object.keys(groepen).sort((a,b)=> a==='zonder'?1 : b==='zonder'?-1 : a.localeCompare(b));

  const telSlot = t => alle.filter(w=>w.tijdstip===t).length;
  const capSlot = t => (PT_SLOTS.find(s=>s.tijd===t)||{cap:null}).cap;

  const lijstHtml = sleutels.length ? sleutels.map(k=>{
    const cap=capSlot(k), n=k==='zonder'?groepen[k].length:telSlot(k);
    return `<div class="slot-hdr"><span class="t">${k==='zonder'?'Zonder tijd':esc(k)}</span>
      ${k!=='zonder'&&cap?`<span class="c ${n>cap?'vol':''}">${n}/${cap}</span>`:''}</div>` +
      groepen[k].map(w=>kaart(w)).join('');
  }).join('') : `<div class="leeg">${open.length?'Niets in deze selectie.':'Alles gespeeld op deze avond 🎯'}</div>`;

  return `
    ${datumChips('avondDatums', d, 'kiesAvond', null, false)}
    <div class="stats">
      <div class="stat"><b>${alle.length}</b><span>totaal</span></div>
      <div class="stat"><b style="color:var(--orange)">${open.length}</b><span>open</span></div>
      <div class="stat"><b style="color:var(--blue)">${eind}</b><span>einde ±</span></div>
    </div>
    <div class="seg">
      ${[['alle','Alles'],['ere','Ere'],['eerste','1e Div'],['beker','Beker']].map(([k,l])=>`<button class="${S.div===k?'act':''}" onclick="S.div='${k}';render()">${l}</button>`).join('')}
    </div>
    <div class="toggle-row"><span>Gespeelde wedstrijden tonen</span>
      <label class="switch"><input type="checkbox" ${S.toonGespeeld?'checked':''} onchange="S.toonGespeeld=this.checked;render()"><span></span></label></div>
    ${lijstHtml}`;
}

function kaart(w, opts={}){
  const gespeeld = w.status==='gespeeld';
  const conflict = !gespeeld && heeftRustConflict(w);
  const chips = [
    divChip(w),
    w.is_inhaal ? '<span class="chip inhaal">Inhaal</span>' : '',
    w.datum_nnb ? '<span class="chip nnb">NNB</span>' : '',
    w.speelronde ? `<span class="chip">SR ${esc(w.speelronde)}</span>` : '',
    w.bord ? `<span class="chip groen">🎯 Bord ${esc(w.bord)}</span>` : '',
    conflict ? `<span class="chip rood">⚠ &lt;${MIN_RUST_MIN} min rust</span>` : '',
    w.notitie ? '<span class="chip">📝</span>' : '',
    gespeeld ? '<span class="chip groen">✓ gespeeld</span>' : ''
  ].join('');
  const wanneer = opts.toonDatum
    ? `<div class="card-when">${w.datum_nnb?'Datum nog niet bekend':esc(fmtKort(w.datum))}${!w.datum_nnb&&w.tijdstip?' · '+esc(w.tijdstip):''}</div>` : '';
  const bk = gespeeld && isBeker(w) ? bekerMatchVoorWedstrijd(w.id) : null;
  const scoreOpen = !!(bk && !bk.m.winnaar);
  const klik = scoreOpen ? `onclick="openScoreVoorWedstrijd(${jsAttr(w.id)})"` : gespeeld ? '' : `onclick="openVerzet(${jsAttr(w.id)})"`;
  const uit = gespeeld && !scoreOpen;
  return `<button class="card ${divKey(w)} ${uit?'gespeeld':''} ${conflict?'conflict':''}" ${klik} ${uit?'disabled':''}>
    <div class="card-main">${wanneer}
      <div class="names"><span class="n">${esc(w.thuis)}</span><span class="n"><span class="vs">vs</span>${esc(w.uit)}</span></div>
      <div class="chips">${chips}${scoreOpen?'<span class="chip beker">🏆 score invullen</span>':''}</div>
    </div>${uit?'':'<span class="card-go">›</span>'}</button>`;
}

function openVerzet(id){
  const m=W.find(w=>w.id===id); if(!m || m.status==='gespeeld') return;
  const eersteKeerBeker = isBeker(m) && m.datum_nnb && !m.originele_datum && !m.is_inhaal;
  const standaard = !m.tijdstip || PT_SLOTS.some(s=>s.tijd===m.tijdstip);
  scoreSheet = null;
  sheet = {
    id, datum: m.datum_nnb ? '' : (m.datum||''), tijd: m.tijdstip||'',
    handmatig: !standaard, nnb: !!m.datum_nnb, inhaal: !eersteKeerBeker,
    door: lsGet('wl_door'), andereDatum:false, bezig:false, tijdAangepast:false, plan:null
  };
  renderSheet();
  $('#sheet').classList.add('open'); $('#sheetBg').classList.add('open');
  document.body.style.overflow='hidden';

function sluitSheet(){
  sheet=null; scoreSheet=null; mddSheet=null;
  $('#sheet').classList.remove('open'); $('#sheetBg').classList.remove('open');
  document.body.style.overflow='';
}

function sheetKiesDatum(d){
  const m=W.find(w=>w.id===sheet.id); if(!m) return;
  sheet.datum=d; sheet.nnb=false; sheet.tijdAangepast=false; sheet.plan=null;
  // Heeft de gekozen tijd op deze avond niet genoeg rust (of zit hij vol)? Dan het beste slot voorstellen.
  if(!sheet.handmatig){
    const st = sheet.tijd ? slotStatus(d, sheet.tijd, m, m.id) : null;
    if(!st || st.niveau!=='ok' || st.vol){
      const beste = besteSlot(d, m);
      if(beste){ sheet.tijdAangepast = !!sheet.tijd && sheet.tijd!==beste; sheet.tijd=beste; }
    }
  }
  renderSheet();
}
function sheetKiesSlot(t){ sheet.tijd=t; sheet.handmatig=false; sheet.tijdAangepast=false; sheet.plan=null; renderSheet(); }

// 'Ruimte maken': de avondplanner herschikt de avond met deze wedstrijd erbij.
// Andere wedstrijden schuiven alleen binnen de avond (zonder mail); de verzet-mail gaat daarna met de definitieve tijd.
function sheetMaakRuimte(){
  const m=W.find(w=>w.id===sheet?.id); if(!m || !sheet.datum) return;
  const d=sheet.datum;
  sheet.plan=null; sheet.rekenen=true; renderSheet();
  setTimeout(()=>{
    if(!sheet || sheet.id!==m.id || sheet.datum!==d){ return; }
    const AP=ap();
    const andere=W.filter(w=>w.id!==m.id && w.datum===d && !w.datum_nnb && AP.slotIndex(w.tijdstip)>=0)
      .map(w=>({ id:w.id, thuis:w.thuis, uit:w.uit, tijdstip:w.tijdstip, vast: w.status==='gespeeld' || w.bord!=null }));
    const cnt=new Array(PT_SLOTS.length).fill(0); andere.forEach(w=>cnt[AP.slotIndex(w.tijdstip)]++);
    const score={ok:0,krap:1,zelfde:2}; let start=-1, best=99;
    PT_SLOTS.forEach((s,i)=>{ if(cnt[i]>=s.cap) return; const sc=score[slotStatus(d,s.tijd,m,m.id).niveau]; if(sc<best){best=sc;start=i;} });
    sheet.rekenen=false;
    if(start<0){ toast('Deze avond zit vol: alle tijdsloten zijn bezet','rood'); renderSheet(); return; }
    const laatsteNu = andere.length ? Math.max(...andere.map(w=>AP.slotIndex(w.tijdstip))) : 0;
    const ms=[...andere, { id:m.id, thuis:m.thuis, uit:m.uit, tijdstip:PT_SLOTS[start].tijd, vrijeKeuze:true }];
    const orig=ms.map(w=>AP.slotIndex(w.tijdstip));
    const na=AP.optimaliseer(ms,{ laatste: Math.max(laatsteNu,start) });
    const tel=sl=>{ const t=AP.telKnelpunten(AP.knelpunten(ms,sl)); return t.zelfde+t.direct+t.eenErtussen; };
    const mi=ms.length-1;
    sheet.plan={
      datum:d, mTijd:PT_SLOTS[na[mi]].tijd, voor:tel(orig), na:tel(na),
      moves: ms.slice(0,mi).map((w,i)=>({ id:w.id, thuis:w.thuis, uit:w.uit, oud:w.tijdstip, nieuw:PT_SLOTS[na[i]].tijd }))
               .filter(x=>x.oud!==x.nieuw).sort((a,b)=>a.oud.localeCompare(b.oud))
    };
    sheet.tijd=sheet.plan.mTijd; sheet.tijdAangepast=false;
    renderSheet();
  },30);
}

function sheetWaarschuwingen(m){
  const w=[];
  if(sheet.nnb || !sheet.datum) return w;
  if(sheet.datum!==m.datum){
    const n=telAvond(sheet.datum, m.id)+1;
    if(n>MAX_PER_AVOND) w.push(`${esc(fmtKort(sheet.datum))} komt hiermee op <b>${n}</b> wedstrijden (max ${MAX_PER_AVOND}).`);
  }
  if(sheet.tijd){
    const conf=rustConflicten(sheet.datum, sheet.tijd, m, m.id);
    if(conf.length){
      const namen=[...new Set(conf.flatMap(c=>[c.thuis,c.uit]).filter(n=>n===m.thuis||n===m.uit))];
      w.push(`<b>${namen.map(esc).join(' en ')}</b> ${namen.length>1?'hebben':'heeft'} al een wedstrijd binnen ${MIN_RUST_MIN} min van ${esc(sheet.tijd)}.`);
    }
    const st=slotStatus(sheet.datum, sheet.tijd, null, m.id);
    if(PT_SLOTS.some(s=>s.tijd===sheet.tijd) && st.bezet>=st.cap) w.push(`Tijdslot ${esc(sheet.tijd)} zit al vol (${st.bezet}/${st.cap}).`);
  }
  if(m.bord) w.push(`Deze wedstrijd staat nu op <b>bord ${esc(m.bord)}</b>.`);
  return w;
}

// ══════════════════════════════════════════
//  RUILEN — twee wedstrijden op dezelfde avond wisselen van tijdstip (zoals sleep-wissel in index.html)
//  Geen mail: binnen één avond zien spelers het in de app en agenda.
// ══════════════════════════════════════════
const kanRuilen = m => !m.datum_nnb && !!m.datum && !!m.tijdstip && m.status!=='gespeeld' && m.bord==null;

// Hoe valt de rust uit als a en b van tijd ruilen? niveau: ok/krap/zelfde (voor de 4 betrokken spelers),
// plus het totaal aantal knelpunten op de avond voor en na.
function ruilEffect(a, b){
  const AP=ap();
  const ms=W.filter(w=>w.datum===a.datum && !w.datum_nnb && AP.slotIndex(w.tijdstip)>=0).map(w=>({...w}));
  const ia=ms.findIndex(w=>w.id===a.id), ib=ms.findIndex(w=>w.id===b.id);
  const voorS=ms.map(w=>AP.slotIndex(w.tijdstip));
  const naS=voorS.slice();
  const kanTel = ia>=0 && ib>=0;
  if(kanTel){ naS[ia]=voorS[ib]; naS[ib]=voorS[ia]; }
  const tot=sl=>{ const t=AP.telKnelpunten(AP.knelpunten(ms,sl)); return t.zelfde+t.direct+t.eenErtussen; };
  // Rustniveau op basis van minuten, zodat ook afwijkende tijden (bv. beker) meetellen
  const niveauVoor=(wed, nieuweTijd, ander, anderTijd)=>{
    const andere=W.filter(w=>w.id!==wed.id && w.datum===wed.datum && !w.datum_nnb && w.tijdstip && deelSpeler(w,wed))
      .map(w=>naarMin(w.id===ander.id ? anderTijd : w.tijdstip)).filter(x=>x!==null);
    return AP.rustNiveau(naarMin(nieuweTijd), andere);
  };
  const n1=niveauVoor(a, b.tijdstip, b, a.tijdstip), n2=niveauVoor(b, a.tijdstip, a, b.tijdstip);
  const rang={ok:0,krap:1,zelfde:2};
  const niveau = rang[n1]>=rang[n2] ? n1 : n2;
  return { niveau, voor: kanTel?tot(voorS):null, na: kanTel?tot(naS):null };
}

function renderRuil(m, nu){
  const el=$('#sheet');
  const kandidaten=W.filter(w=>w.id!==m.id && w.datum===m.datum && !w.datum_nnb && w.tijdstip)
    .sort((x,y)=>x.tijdstip.localeCompare(y.tijdstip) || x.thuis.localeCompare(y.thuis));
  const effecten=new Map(kandidaten.filter(w=>kanRuilen(w) && w.tijdstip!==m.tijdstip).map(w=>[w.id, ruilEffect(m,w)]));
  const huidig = effecten.size ? [...effecten.values()][0].voor : null;
  const rijHtml = w=>{
    const e=effecten.get(w.id);
    const reden = w.status==='gespeeld' ? 'gespeeld' : w.bord!=null ? `op bord ${w.bord}` : w.tijdstip===m.tijdstip ? 'zelfde tijd' : '';
    if(!e) return `<div class="ruil-rij uit"><span class="t">${esc(w.tijdstip)}</span><div class="w">${esc(w.thuis)} – ${esc(w.uit)}<div class="chips"><span class="chip">${esc(reden)}</span></div></div></div>`;
    const cls = e.niveau==='zelfde' ? 'rood' : e.niveau==='krap' ? 'krap' : '';
    const label = e.niveau==='zelfde' ? '<span class="chip rood">dubbel</span>' : e.niveau==='krap' ? '<span class="chip oranje">krap</span>' : '<span class="chip groen">rust ok</span>';
    const delta = (e.voor!==null && e.na!==e.voor) ? `<span class="chip ${e.na<e.voor?'groen':'rood'}">knelpunten ${e.voor} → ${e.na}</span>` : '';
    return `<button class="ruil-rij ${cls}" onclick="ruilMet(${jsAttr(w.id)})"><span class="t">${esc(w.tijdstip)}</span>
      <div class="w">${esc(w.thuis)} – ${esc(w.uit)}<div class="chips">${label}${delta}${divChip(w)}${w.is_inhaal?'<span class="chip inhaal">Inhaal</span>':''}</div></div></button>`;
  };
  const rijen = kandidaten.map(rijHtml).join('');
  // Beste opties: ruilen waarbij iedereen genoeg rust houdt, minste knelpunten op de avond eerst
  const beste = kandidaten.filter(w=>effecten.get(w.id)?.niveau==='ok')
    .sort((x,y)=>(effecten.get(x.id).na??0)-(effecten.get(y.id).na??0) || x.tijdstip.localeCompare(y.tijdstip)).slice(0,3);
  const leiderOpts = '<option value="">— kies —</option>' + leiders.map(l=>`<option ${l.naam===sheet.door?'selected':''}>${esc(l.naam)}</option>`).join('');
  el.innerHTML = `
    <div class="sheet-kop">
      <div style="flex:1;min-width:0;">
        <div class="names"><span class="n">${esc(m.thuis)}</span><span class="n"><span class="vs">vs</span>${esc(m.uit)}</span></div>
        <div class="chips">${divChip(m)}${m.is_inhaal?'<span class="chip inhaal">Inhaal</span>':''}</div>
        <div class="nu">${nu}</div>
      </div>
      <button class="icon-btn" onclick="sluitSheet()" aria-label="Sluiten">✕</button>
    </div>
    <div class="sheet-body">
      <button class="link-btn" onclick="sheet.ruil=false;renderSheet()">← Terug naar verzetten</button>
      <div class="sec-title" style="margin-top:6px">Ruilen met · ${esc(fmtKort(m.datum))}</div>
      <div class="pl-uitleg" style="margin:0 2px 10px">Tik op een wedstrijd: die krijgt <b>${esc(m.tijdstip)}</b> en deze wedstrijd zijn tijd. Groen = iedereen houdt genoeg rust, oranje = krap, rood = iemand staat dan dubbel.${huidig?` Nu ${huidig} knelpunt${huidig>1?'en':''} op deze avond.`:''} Spelers krijgen geen mail.</div>
      ${beste.length ? `<div class="sec-title">Beste opties</div><div class="ruil-lijst">${beste.map(rijHtml).join('')}</div><div class="sec-title">Alle wedstrijden</div>` : (kandidaten.length ? '<div class="warn" style="margin:0 0 10px"><div>Geen ruil waarbij iedereen genoeg rust houdt.</div></div>' : '')}
      <div class="ruil-lijst">${rijen || '<div class="leeg">Geen andere wedstrijden op deze avond.</div>'}</div>
      <div class="veld" style="margin-top:14px"><label>Gewijzigd door</label><select class="inp" onchange="sheet.door=this.value;lsSet('wl_door',this.value)">${leiderOpts}</select></div>
    </div>`;
}

async function ruilMet(id2){
  if(!sheet || sheet.bezig) return;
  const a=W.find(w=>w.id===sheet.id), b=W.find(w=>w.id===id2);
  if(!a || !b) return;
  if(!sheet.door){ toast('Kies onderaan wie de wijziging doet','rood'); return; }
  const e=ruilEffect(a,b);
  const waarsch = e.niveau==='zelfde' ? '\n\n⚠ Daarna staat een speler dubbel in één tijdslot.' : e.niveau==='krap' ? '\n\n⚠ Daarna heeft een speler krappe rust.' : '';
  if(!confirm(`Tijden ruilen op ${fmtKort(a.datum)}?\n\n${a.thuis} – ${a.uit}: ${a.tijdstip} → ${b.tijdstip}\n${b.thuis} – ${b.uit}: ${b.tijdstip} → ${a.tijdstip}${waarsch}\n\nSpelers krijgen geen mail.`)) return;
  sheet.bezig=true;
  const t1=a.tijdstip, t2=b.tijdstip, door=sheet.door;
  try{
    const vers=await sbGet('wedstrijden',`id=in.(${encodeURIComponent(a.id)},${encodeURIComponent(b.id)})&select=id,datum,tijdstip,status,bord,datum_nnb`);
    const va=vers.find(x=>x.id===a.id), vb=vers.find(x=>x.id===b.id);
    if(!va || !vb || va.tijdstip!==t1 || vb.tijdstip!==t2 || va.datum!==vb.datum || va.datum_nnb || vb.datum_nnb
       || va.status==='gespeeld' || vb.status==='gespeeld' || va.bord!=null || vb.bord!=null){
      sheet.bezig=false; toast('Een van beide wedstrijden is intussen gewijzigd. Probeer opnieuw.','rood'); await laadData(true); return;
    }
    await sbPatch('wedstrijden', a.id, { tijdstip:t2 });
    await sbPatch('wedstrijden', b.id, { tijdstip:t1 });
    a.tijdstip=t2; b.tijdstip=t1;
    sluitSheet(); render();
    toast(`⇄ Geruild: ${a.thuis} – ${a.uit} nu ${t2}`,'groen');
    try{
      await sbPost('wijziging_log',{ wedstrijd_id:a.id, thuis:a.thuis, uit:a.uit, divisie:a.divisie||null, actie:'tijd_wissel',
        oude_tijdstip:t1, nieuwe_tijdstip:t2, gewijzigd_door:`${door} (WL-app wissel)`, mail_verstuurd:false });
      await sbPost('wijziging_log',{ wedstrijd_id:b.id, thuis:b.thuis, uit:b.uit, divisie:b.divisie||null, actie:'tijd_wissel',
        oude_tijdstip:t2, nieuwe_tijdstip:t1, gewijzigd_door:`${door} (WL-app wissel)`, mail_verstuurd:false });
    }catch(err){ console.error('Kon wissel niet loggen:',err); }
    laadData(true);
  }catch(err){
    if(sheet) sheet.bezig=false;
    toast(`Fout: ${err.message}`,'rood');
  }
}

function ruimteHtml(m){
  if(!sheet.datum || sheet.nnb || sheet.handmatig) return '';
  if(sheet.rekenen) return `<div class="ruimte">🧩 Avond herschikken…</div>`;
  const p=sheet.plan;
  if(p && p.datum===sheet.datum){
    const rij=p.moves.map(x=>`<div class="ctx-rij"><span class="t">${esc(x.oud)}→${esc(x.nieuw)}</span><span>${esc(x.thuis)} – ${esc(x.uit)}</span></div>`).join('');
    return `<div class="ruimte"><b>🧩 Voorstel: deze wedstrijd om ${esc(p.mTijd)}</b>
      ${p.moves.length ? `<div class="muted" style="margin-top:4px;">Daarvoor krijgen ${p.moves.length} andere wedstrijd${p.moves.length>1?'en':''} een ander tijdstip (zonder mail, ze zien het in de app en agenda):</div><div class="ctx">${rij}</div>`
                       : `<div class="muted" style="margin-top:4px;">Er hoeven geen andere wedstrijden te schuiven.</div>`}
      <div class="muted" style="margin-top:6px;">Knelpunten op deze avond: ${p.voor} → ${p.na}. Wordt doorgevoerd bij Opslaan.</div>
      <button class="link-btn" onclick="sheet.plan=null;sheet.tijd=besteSlot(sheet.datum,W.find(w=>w.id===sheet.id))||'';renderSheet()">Voorstel wissen</button></div>`;
  }
  const geenGroen = !PT_SLOTS.some(s=>{ const x=slotStatus(sheet.datum,s.tijd,m,m.id); return x.niveau==='ok' && !x.vol; });
  return geenGroen ? `<button class="ruimte-knop" onclick="sheetMaakRuimte()">🧩 Ruimte maken: avond herschikken zodat iedereen rust heeft</button>` : '';
}

function renderSheet(){
  if(!sheet) return;
  const m=W.find(w=>w.id===sheet.id);
  const el=$('#sheet');
  if(!m){ el.innerHTML=`<div class="sheet-body"><div class="leeg" style="margin-top:16px">Deze wedstrijd bestaat niet meer.</div></div>`; return; }

  const nu = m.datum_nnb ? 'Nu: datum nog niet bekend (NNB)' : `Nu: ${esc(fmtLang(m.datum))}${m.tijdstip?' · '+esc(m.tijdstip):''}`;
  if(sheet.ruil){ renderRuil(m, nu); return; }
  const v=vandaag();
  const extraDatum = sheet.datum && !avonden().includes(sheet.datum);

  // Tijdsloten
  let slotenHtml='';
  if(!sheet.nnb && sheet.datum){
    slotenHtml = sheet.handmatig
      ? `<input class="inp" type="time" value="${esc(sheet.tijd)}" onchange="sheet.tijd=this.value;sheet.plan=null;renderSheet()">
         <button class="link-btn" onclick="sheet.handmatig=false;renderSheet()">← Terug naar tijdsloten</button>`
      : `<div class="sloten">${PT_SLOTS.map(s=>{
            const st=slotStatus(sheet.datum,s.tijd,m,m.id);
            const cls=st.conflict?'conflict':st.vol?'vol':st.niveau==='krap'?'krap':'';
            const lbl=`${st.bezet}/${st.cap}${st.conflict?' · dubbel':st.vol?' · vol':st.niveau==='krap'?' · krap':''}`;
            return `<button class="slot ${cls} ${s.tijd===sheet.tijd?'sel':''}" onclick="sheetKiesSlot('${s.tijd}')"><div class="st">${s.tijd}</div><div class="sl">${lbl}</div></button>`;
          }).join('')}</div>
         <div class="slot-legenda">Groen = beide spelers minstens 2 slots rust · oranje = krap (spelen-schrijven-spelen) · rood = al een wedstrijd in dat slot · grijs = vol</div>
         ${ruimteHtml(m)}
         <button class="link-btn" onclick="sheet.handmatig=true;sheet.plan=null;renderSheet()">Andere tijd invullen…</button>`;
  }

  // Wat spelen deze twee spelers nog meer op de gekozen avond?
  let ctxHtml='';
  if(!sheet.nnb && sheet.datum){
    const nieuw=naarMin(sheet.tijd);
    const anders=W.filter(w=>w.id!==m.id && w.datum===sheet.datum && !w.datum_nnb && deelSpeler(w,m))
      .map(w=>{ const t=tijdNaPlan(w); return t===w.tijdstip ? w : {...w, tijdstip:t, _was:w.tijdstip}; })
      .sort((a,b)=>(a.tijdstip||'99').localeCompare(b.tijdstip||'99'));
    const rijen=anders.map(w=>{
      const wm=naarMin(w.tijdstip);
      const rood = nieuw!==null && wm!==null && Math.abs(wm-nieuw)<MIN_RUST_MIN;
      const krap = !rood && nieuw!==null && wm!==null && Math.abs(wm-nieuw)<60;
      return {t:w.tijdstip||'—', html:`<div class="ctx-rij ${rood?'rood':krap?'krap':''}"><span class="t">${esc(w.tijdstip||'—')}</span><span>${esc(w.thuis)} – ${esc(w.uit)}${w._was?` <span class="muted">(was ${esc(w._was)})</span>`:''}${w.status==='gespeeld'?' <span class="muted">✓</span>':''}</span></div>`};
    });
    if(sheet.tijd) rijen.push({t:sheet.tijd, html:`<div class="ctx-rij nieuw"><span class="t">${esc(sheet.tijd)}</span><span><b>Deze wedstrijd</b></span></div>`});
    rijen.sort((a,b)=>a.t.localeCompare(b.t));
    ctxHtml = `<div class="sec-title">${esc(m.thuis)} & ${esc(m.uit)} op ${esc(fmtKort(sheet.datum))}</div>
      ${anders.length ? `<div class="ctx">${rijen.map(r=>r.html).join('')}</div>` : '<div class="muted" style="font-size:.88rem;">Geen andere wedstrijden op deze avond.</div>'}`;
  }

  const warns=sheetWaarschuwingen(m);
  const warnHtml = warns.length ? `<div class="warn">${warns.map(x=>`<div>⚠ ${x}</div>`).join('')}</div>` : '';
  const aangepast = sheet.tijdAangepast ? `<div class="info"><span>Tijd aangepast naar het beste slot op deze avond: <b>${esc(sheet.tijd)}</b></span></div>` : '';
  const orig = m.originele_datum ? `<div class="info"><span>📌 Oorspronkelijke datum: <b>${esc(fmtKort(m.originele_datum))}</b></span><button class="btn-klein" onclick="herstelOrig()">Terugzetten</button></div>` : '';

  const leiderOpts = '<option value="">— kies —</option>' + leiders.map(l=>`<option ${l.naam===sheet.door?'selected':''}>${esc(l.naam)}</option>`).join('');
  const lblOpslaan = warns.length ? '⚠ Toch opslaan' : 'Opslaan';
  const lblMail = warns.length ? '⚠ Toch + mail' : 'Opslaan & mail';
  const oudScroll = el.querySelector('.sheet-body')?.scrollTop || 0; // scrollpositie behouden bij het kiezen van een slot
  const bk = isBeker(m) ? bekerMatchVoorWedstrijd(m.id) : null;
  const bkKnop = bk && bk.m.a && bk.m.b && !bk.m.winnaar
    ? `<div class="info"><span>🏆 Al gespeeld? Vul hier de bekeruitslag in.</span><button class="btn-klein" onclick="openScore('${bk.faseId}',${bk.m.nr})">Score invullen</button></div>` : '';

  el.innerHTML = `
    <div class="sheet-kop">
      <div style="flex:1;min-width:0;">
        <div class="names"><span class="n">${esc(m.thuis)}</span><span class="n"><span class="vs">vs</span>${esc(m.uit)}</span></div>
        <div class="chips">${divChip(m)}${m.is_inhaal?'<span class="chip inhaal">Inhaal</span>':''}${m.speelronde?`<span class="chip">SR ${esc(m.speelronde)}</span>`:''}</div>
        <div class="nu">${nu}</div>
      </div>
      <button class="icon-btn" onclick="sluitSheet()" aria-label="Sluiten">✕</button>
    </div>
    <div class="sheet-body">
      ${bkKnop}
      ${orig}
      ${kanRuilen(m) ? `<button class="ruil-knop" onclick="sheet.ruil=true;renderSheet()">⇄ Tijd ruilen met een andere wedstrijd op ${esc(fmtKort(m.datum))}</button>` : ''}
      <div class="sec-title">Nieuwe datum</div>
      ${datumChips('sheetDatums', sheet.nnb?'':sheet.datum, 'sheetKiesDatum', m.id, true)}
      <div class="pill-rij">
        <button class="pill ${sheet.andereDatum||extraDatum?'act':''}" onclick="sheet.andereDatum=true;renderSheet()">📅 Andere datum</button>
        <button class="pill nnb ${sheet.nnb?'act':''}" onclick="sheet.nnb=!sheet.nnb;sheet.plan=null;if(sheet.nnb){sheet.datum='';sheet.tijd='';}renderSheet()">🕓 Nog niet bekend</button>
      </div>
      ${(sheet.andereDatum||extraDatum)&&!sheet.nnb ? `<input class="inp" style="margin-top:10px" type="date" value="${esc(sheet.datum)}" min="${v}" onchange="sheetKiesDatum(this.value)">` : ''}
      ${slotenHtml ? `<div class="sec-title">Tijdslot</div>${slotenHtml}` : ''}
      ${aangepast}
      ${ctxHtml}
      ${warnHtml}
      <div class="sec-title">Opslaan</div>
      <label class="check"><input type="checkbox" ${sheet.inhaal?'checked':''} onchange="sheet.inhaal=this.checked"> Telt als inhaalwedstrijd (oorspronkelijke datum bewaren)</label>
      <div class="veld"><label>Gewijzigd door</label><select class="inp" onchange="sheet.door=this.value;lsSet('wl_door',this.value)">${leiderOpts}</select></div>
    </div>
    <div class="sheet-voet">
      <button class="btn btn-sec" ${sheet.bezig?'disabled':''} onclick="slaVerzetOp(false)">${lblOpslaan}</button>
      <button class="btn ${warns.length?'btn-warn':'btn-pri'}" ${sheet.bezig?'disabled':''} onclick="slaVerzetOp(true)">${sheet.bezig?'Bezig…':lblMail}</button>
    </div>`;
  centreerDatum('#sheetDatums');
  el.querySelector('.sheet-body').scrollTop = oudScroll;
}

// Zelfde gegevens, log en mail als slaVerzetOp() in index.html
async function slaVerzetOp(informeer){
  if(!sheet || sheet.bezig) return;
  const m=W.find(w=>w.id===sheet.id); if(!m) return;
  const isNNB=sheet.nnb;
  if(!isNNB && !sheet.datum){ toast('Kies een datum (of "Nog niet bekend")','rood'); return; }
  if(!sheet.door){ toast('Kies wie de wijziging doet','rood'); return; }
  const tijdInp=(sheet.tijd||'').trim();
  if(tijdInp && !/^([01]\d|2[0-3]):[0-5]\d$/.test(tijdInp)){ toast('Tijd moet UU:MM zijn (bv. 19:30)','rood'); return; }

  const id=m.id, oudeDatum=m.datum||null, oudeTijd=m.tijdstip||null;
  const nieuweTijd = isNNB ? null : (tijdInp||null);
  const origDatum  = sheet.inhaal ? (m.originele_datum || m.datum) : null;
  const nieuweDatum = isNNB ? (m.datum || oudeDatum) : sheet.datum;
  const door=sheet.door;

  sheet.bezig=true; renderSheet();
  // 'Ruimte maken'-voorstel eerst doorvoeren (zonder mail), zodat de verzet-mail de definitieve tijd heeft
  const plan = (!isNNB && sheet.plan && sheet.plan.datum===nieuweDatum && sheet.plan.mTijd===nieuweTijd) ? sheet.plan : null;
  if(plan && plan.moves.length){
    try{
      const vers=await sbGet('wedstrijden',`datum=eq.${nieuweDatum}&select=id,tijdstip,status,bord,datum_nnb`);
      const perId=new Map(vers.map(w=>[w.id,w]));
      const verouderd=plan.moves.some(x=>{ const v=perId.get(x.id); return !v || v.datum_nnb || v.tijdstip!==x.oud || v.status==='gespeeld' || v.bord!=null; });
      if(verouderd){
        sheet.plan=null; sheet.bezig=false; renderSheet();
        toast('De avond is intussen gewijzigd. Maak opnieuw ruimte of kies zelf een slot.','rood');
        laadData(true); return;
      }
      for(const x of plan.moves){
        await sbPatch('wedstrijden', x.id, { tijdstip:x.nieuw });
        const lw=W.find(w=>w.id===x.id); if(lw) lw.tijdstip=x.nieuw;
        try{
          await sbPost('wijziging_log',{
            wedstrijd_id:x.id, thuis:x.thuis, uit:x.uit, divisie:lw?.divisie||null, actie:'verzet',
            oude_datum:nieuweDatum, nieuwe_datum:nieuweDatum, oude_tijdstip:x.oud, nieuwe_tijdstip:x.nieuw,
            gewijzigd_door:door, notitie:`Ander tijdslot (zelfde avond) – ruimte gemaakt voor ${m.thuis} – ${m.uit}`, mail_verstuurd:false
          });
        }catch(e){ console.error('Kon herschikking niet loggen:',e); }
      }
    }catch(e){
      if(sheet){ sheet.bezig=false; renderSheet(); }
      toast(`Ruimte maken mislukt: ${e.message}`,'rood'); laadData(true); return;
    }
  }
  try{
    await sbPatch('wedstrijden', id, { datum:nieuweDatum, tijdstip:nieuweTijd, datum_nnb:isNNB, is_inhaal:sheet.inhaal, originele_datum:origDatum, status:'gepland' });
    Object.assign(m,{ datum:nieuweDatum, tijdstip:nieuweTijd, datum_nnb:isNNB, is_inhaal:sheet.inhaal, originele_datum:origDatum, status:'gepland' });
    sluitSheet();
    if(!isNNB && S.view==='avond') S.datum=nieuweDatum;
    render(); updateBadge();
    const tijdGewijzigd = !isNNB && nieuweTijd && nieuweTijd!==oudeTijd;
    toast(isNNB ? '🕓 Gemarkeerd als NNB' : `📅 Verzet naar ${fmtKort(nieuweDatum)}${tijdGewijzigd?` om ${nieuweTijd}`:''}`, 'oranje');

    let logId=null;
    try{
      const rij=await sbPost('wijziging_log',{
        wedstrijd_id:id, thuis:m.thuis||null, uit:m.uit||null, divisie:m.divisie||null, actie:'verzet',
        oude_datum:oudeDatum, nieuwe_datum:isNNB?null:nieuweDatum, oude_tijdstip:oudeTijd, nieuwe_tijdstip:nieuweTijd,
        gewijzigd_door:door, notitie:isNNB?'Nog niet bekend (NNB)':null, mail_verstuurd:false
      });
      logId=rij?.[0]?.id||null;
    }catch(e){ console.error('Kon wijziging niet loggen:',e); }

    if(informeer){
      try{
        const res=await fetch(`${SB_URL}/functions/v1/notify-wedstrijd`,{
          method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${SB_KEY}`,'apikey':SB_KEY},
          body:JSON.stringify({ type:'verzet', wedstrijd_id:id, gewijzigd_door:door, wijziging_log_id:logId, oude_tijdstip:oudeTijd, nieuwe_tijdstip:nieuweTijd })
        });
        const data=await res.json().catch(()=>({}));
        if(!res.ok) throw new Error(data.error||'Onbekende fout');
        toast(`📧 Spelers geïnformeerd (${data.verzonden_naar ?? '?'} mail(s))`,'groen');
      }catch(e){ toast(`⚠ Verzet gelukt, maar mail mislukt: ${e.message}`,'rood'); }
    }
    laadData(true);
  }catch(e){
    if(sheet){ sheet.bezig=false; renderSheet(); }
    toast(`Fout: ${e.message}`,'rood');
  }
}

async function herstelOrig(){
  const m=W.find(w=>w.id===sheet?.id); if(!m||!m.originele_datum) return;
  if(!confirm(`${m.thuis} vs ${m.uit} terugzetten naar ${fmtKort(m.originele_datum)}?`)) return;
  try{
    await sbPatch('wedstrijden', m.id, { datum:m.originele_datum, is_inhaal:false, originele_datum:null, datum_nnb:false });
    const d=m.originele_datum;
    Object.assign(m,{ datum:d, is_inhaal:false, originele_datum:null, datum_nnb:false });
    sluitSheet(); S.datum=d; render(); updateBadge();
    toast(`↩ Teruggezet naar ${fmtKort(d)}`,'groen');
    laadData(true);
  }catch(e){ toast(`Fout: ${e.message}`,'rood'); }
}
