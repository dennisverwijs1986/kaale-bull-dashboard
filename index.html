<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dart Competitie Dashboard - Volledig Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #121824;
            --bg-card: #1a2333;
            --bg-inner: #243146;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --brand-green: #10b981;
            --brand-red: #ef4444;
            --brand-orange: #f59e0b;
            --beker-color: #f59e0b; 
            --ere-divisie: #a855f7; 
            --eerste-divisie: #3b82f6; 
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-main); color: var(--text-main); padding: 20px; }
        .dashboard { max-width: 1400px; margin: 0 auto; background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid #2e3d56; }
        .topbar { background-color: #0f141f; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2e3d56; }
        .sync-status { font-weight: bold; color: var(--brand-green); }
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
        h2 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; color: #fff; padding-bottom: 5px; border-bottom: 1px solid #2e3d56;}
        
        .beker-panel { background: linear-gradient(135deg, #1e2538 0%, #161d2a 100%); padding: 15px; border-radius: 8px; border: 1px solid rgba(245, 158, 11, 0.3); }
        .beker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .beker-select { background: var(--bg-main); border: 1px solid #2e3d56; color: #fff; padding: 8px; border-radius: 4px; width: 100%; }

        .boards-container { display: flex; flex-direction: column; gap: 15px; }
        .board-card { background: var(--bg-inner); border-radius: 8px; padding: 15px; border-left: 5px solid var(--brand-green); }
        .board-card.busy { border-left-color: var(--brand-red); }
        .board-header { display: flex; justify-content: space-between; font-weight: bold; }
        .match-details { font-size: 1.2rem; font-weight: 600; margin: 10px 0; color: #fff; }

        .queue-container { display: flex; flex-direction: column; gap: 10px; }
        .queue-item { background: var(--bg-inner); border-radius: 8px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        
        .divisie-separator {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 10px;
            margin-top: 10px;
            margin-bottom: 5px;
            border-radius: 4px;
        }
        .separator-ere { background: rgba(168, 85, 247, 0.15); color: var(--ere-divisie); border-left: 4px solid var(--ere-divisie); }
        .separator-eerste { background: rgba(59, 130, 246, 0.15); color: var(--eerste-divisie); border-left: 4px solid var(--eerste-divisie); }
        .separator-beker { background: rgba(245, 158, 11, 0.15); color: var(--beker-color); border-left: 4px solid var(--beker-color); }

        .type-badge { font-size: 0.75rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; margin-right: 5px;}
        .type-badge.ere { background: rgba(168, 85, 247, 0.2); color: var(--ere-divisie); border: 1px solid rgba(168, 85, 247, 0.4); }
        .type-badge.eerste { background: rgba(59, 130, 246, 0.2); color: var(--eerste-divisie); border: 1px solid rgba(59, 130, 246, 0.4); }
        .type-badge.beker { background: rgba(245, 158, 11, 0.2); color: var(--beker-color); border: 1px solid rgba(245, 158, 11, 0.4); }
        
        .btn { background: #2e3d56; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: 500; }
        .btn-primary { background: var(--brand-green); color: #000; font-weight: bold; }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--brand-red); border: 1px solid var(--brand-red); }
        .filter-section { background: #161d2a; padding: 12px 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #2e3d56; display: flex; align-items: center; gap: 15px; }
        .filter-select { background: var(--bg-inner); border: 1px solid #2e3d56; color: #fff; padding: 6px 12px; border-radius: 4px; min-width: 220px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="topbar">
        <h1>🎯 Dart Dashboard <span style="font-size: 1rem; color: var(--text-muted);">| Supabase Live Matrix</span></h1>
        <div class="meta-info">Status: <span id="sync-indicator" class="sync-status">SUPABASE LIVE</span></div>
    </div>

    <div class="main-content">
        <div class="boards-container">
            <h2>🟢 Live Banen Status</h2>
            <div id="boards-list"></div>

            <div class="beker-panel">
                <h3 style="margin-top: 0; color: var(--beker-color);">🏆 Live Beker Loting</h3>
                <div class="beker-grid">
                    <div>
                        <label style="font-size: 0.8rem; color: var(--text-muted);">Thuis:</label>
                        <select id="beker-thuis" class="beker-select"><option value="">-- Kies Thuis --</option></select>
                    </div>
                    <div>
                        <label style="font-size: 0.8rem; color: var(--text-muted);">Uit:</label>
                        <select id="beker-uit" class="beker-select"><option value="">-- Kies Uit --</option></select>
                    </div>
                </div>
                <button class="btn btn-primary" style="background: var(--beker-color); color: #000; width: 100%;" onclick="genereerEnSlaBekerOp()">🔥 Genereer & Sla Direct Op in DB</button>
            </div>
        </div>

        <div class="queue-container">
            <h2>📋 Wachtrij</h2>
            <div class="filter-section">
                <span style="font-size: 0.9rem; font-weight: bold;">📅 Datum Speelavond:</span>
                <select id="date-filter" class="filter-select" onchange="renderQueue()">
                    </select>
            </div>
            <div id="queue-list">Data laden...</div>
            
            <div style="margin-top: 25px;">
                <h2>🏆 Gespeelde Wedstrijden vanavond</h2>
                <div id="history-list">Nog geen wedstrijden gespeeld.</div>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://JOUW_PROJECT_ID.supabase.co"; 
    const SUPABASE_KEY = "JOUW_ANON_PUBLIC_KEY";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let activeMatches = { 1: { id: null, isBeker: false }, 2: { id: null, isBeker: false }, 3: { id: null, isBeker: false }, 4: { id: null, isBeker: false } };
    
    let reguliereWedstrijden = [];
    let bekerWedstrijden = [];
    
    let gespeeldeReguliereIds = new Set();
    let gespeeldeBekerIds = new Set();
    let alleUniekeSpelersNamen = new Set();

    async function haalAlleData() {
        // Haal parallel de data op uit beide tabellen
        const [reguliereRes, bekerRes] = await Promise.all([
            supabase.from('wedstrijden').select('*'),
            supabase.from('beker_wedstrijden').select('*')
        ]);

        reguliereWedstrijden = reguliereRes.data || [];
        bekerWedstrijden = bekerRes.data || [];
        
        // Sync de 'gespeeld' status vanuit de database
        reguliereWedstrijden.forEach(w => {
            if(w.status === 'gespeeld') gespeeldeReguliereIds.add(w.id);
            if(w.thuis && w.thuis.toLowerCase() !== 'bye') alleUniekeSpelersNamen.add(w.thuis);
            if(w.uit && w.uit.toLowerCase() !== 'bye') alleUniekeSpelersNamen.add(w.uit);
        });

        bekerWedstrijden.forEach(w => {
            if(w.status === 'gespeeld') gespeeldeBekerIds.add(w.id);
        });

        vulDatumFilter();
        vulDropdowns();
        renderBoards();
        renderQueue();
        renderHistory();
    }

    function vulDatumFilter() {
        let uniekeDatums = new Set();
        reguliereWedstrijden.forEach(w => { if (w.datum) uniekeDatums.add(w.datum); });
        
        const filterSelect = document.getElementById('date-filter');
        if (filterSelect.innerHTML.trim() === "") {
            filterSelect.innerHTML = '<option value="ALL">-- Toon alle datums --</option>';
            Array.from(uniekeDatums).sort().forEach(datum => {
                filterSelect.innerHTML += `<option value="${datum}">${datum}</option>`;
            });
            if(uniekeDatums.size > 0) filterSelect.selectedIndex = 1; 
        }
    }

    function vulDropdowns() {
        let html = '<option value="">-- Kies Speler --</option>';
        Array.from(alleUniekeSpelersNamen).sort().forEach(n => html += `<option value="${n}">${n}</option>`);
        document.getElementById('beker-thuis').innerHTML = html;
        document.getElementById('beker-uit').innerHTML = html;
    }

    // BEKER MATCH TOEVOEGEN: Schiet direct naar de beker_wedstrijden tabel
    async function genereerEnSlaBekerOp() {
        const thuis = document.getElementById('beker-thuis').value;
        const uit = document.getElementById('beker-uit').value;
        const gekozenDatum = document.getElementById('date-filter').value;
        
        if(!thuis || !uit || thuis === uit) return alert("Kies twee verschillende spelers!");
        let speelAvondDatum = gekozenDatum === "ALL" ? new Date().toISOString().split('T')[0] : gekozenDatum;

        const { data, error } = await supabase
            .from('beker_wedstrijden')
            .insert([{
                ronde: "Beker Loting",
                datum: speelAvondDatum,
                thuis: thuis,
                uit: uit,
                status: "wachtrij"
            }])
            .select();

        if (error) {
            alert("Fout bij opslaan in database: " + error.message);
        } else {
            document.getElementById('beker-thuis').value = "";
            document.getElementById('beker-uit').value = "";
            // Herlaad de data om de nieuwe match in de wachtrij te zetten
            const { data: upToDateBeker } = await supabase.from('beker_wedstrijden').select('*');
            bekerWedstrijden = upToDateBeker || [];
            renderQueue();
        }
    }

    function renderBoards() {
        const container = document.getElementById('boards-list');
        container.innerHTML = '';
        for (let i = 1; i <= 4; i++) {
            let active = activeMatches[i];
            let card = document.createElement('div');
            card.className = `board-card ${active.id ? 'busy' : ''}`;
            if (!active.id) {
                card.innerHTML = `<div class="board-header"><span>🎯 Bord ${i}</span><span>Vrij</span></div><div class="match-details">Wacht op match...</div>`;
            } else {
                let m = active.isBeker 
                    ? bekerWedstrijden.find(w => w.id === active.id)
                    : reguliereWedstrijden.find(w => w.id === active.id);
                
                let divLabel = active.isBeker ? "Beker" : (m.divisie || "Competitie");
                card.innerHTML = `
                    <div class="board-header"><span>🎯 Bord ${i} [${divLabel}]</span><span>Bezig</span></div>
                    <div class="match-details">${m.thuis} vs ${m.uit}</div>
                    <button class="btn btn-danger" onclick="stopMatch(${i})">🏁 Klaar</button>`;
            }
            container.appendChild(card);
        }
    }

    function renderQueue() {
        const container = document.getElementById('queue-list');
        container.innerHTML = '';
        
        let gekozenDatum = document.getElementById('date-filter').value;

        // Filter openstaande beker- en reguliere wedstrijden
        let openBeker = bekerWedstrijden.filter(m => !gespeeldeBekerIds.has(m.id) && !Object.values(activeMatches).some(a => a.isBeker && a.id === m.id) && (gekozenDatum === "ALL" || m.datum === gekozenDatum));
        let openRegulier = reguliereWedstrijden.filter(m => !gespeeldeReguliereIds.has(m.id) && !Object.values(activeMatches).some(a => !a.isBeker && a.id === m.id) && (gekozenDatum === "ALL" || m.datum === gekozenDatum));

        if(openBeker.length === 0 && openRegulier.length === 0) {
            container.innerHTML = "Geen openstaande wedstrijden voor deze avond.";
            return;
        }

        // 1. Toon Beker bovenaan
        if (openBeker.length > 0) {
            let sep = document.createElement('div'); sep.className = 'divisie-separator separator-beker'; sep.innerHTML = '🏆 Actieve Beker Loting'; container.appendChild(sep);
            openBeker.forEach(m => appendQueueCard(container, m, true));
        }

        // 2. Toon Regulier (Ere / Eerste)
        let openEre = openRegulier.filter(m => m.divisie && m.divisie.toLowerCase().includes('ere'));
        let openEerste = openRegulier.filter(m => m.divisie && !m.divisie.toLowerCase().includes('ere'));

        if (openEre.length > 0) {
            let sep = document.createElement('div'); sep.className = 'divisie-separator separator-ere'; sep.innerHTML = '🏆 Ere Divisie'; container.appendChild(sep);
            openEre.forEach(m => appendQueueCard(container, m, false));
        }
        if (openEerste.length > 0) {
            let sep = document.createElement('div'); sep.className = 'divisie-separator separator-eerste'; sep.innerHTML = '🎯 Eerste Divisie'; container.appendChild(sep);
            openEerste.forEach(m => appendQueueCard(container, m, false));
        }
    }

    function appendQueueCard(targetContainer, match, isBeker) {
        let card = document.createElement('div');
        card.className = 'queue-item';
        let badge = isBeker ? '<span class="type-badge beker">Beker</span>' : `<span class="type-badge eerste">${match.divisie || 'Comp'}</span>`;
        card.innerHTML = `<div>${badge} <b>${match.thuis} vs ${match.uit}</b></div>
                         <button class="btn btn-primary" onclick="startMatch(${match.id}, ${isBeker})">Speel</button>`;
        targetContainer.appendChild(card);
    }

    function startMatch(id, isBeker) {
        let bord = Object.keys(activeMatches).find(b => activeMatches[b].id === null);
        if(!bord) return alert("Alle banen bezet!");
        activeMatches[bord].id = id;
        activeMatches[bord].isBeker = isBeker;
        renderBoards();
        renderQueue();
    }

    // WEDSTRIJD KLAAR: Update direct de juiste tabel in Supabase naar 'gespeeld'
    async function stopMatch(bord) {
        let matchId = activeMatches[bord].id;
        let isBeker = activeMatches[bord].isBeker;

        if (isBeker) {
            gespeeldeBekerIds.add(matchId);
            await supabase.from('beker_wedstrijden').update({ status: 'gespeeld' }).eq('id', matchId);
        } else {
            gespeeldeReguliereIds.add(matchId);
            await supabase.from('wedstrijden').update({ status: 'gespeeld' }).eq('id', matchId);
        }

        activeMatches[bord].id = null;
        activeMatches[bord].isBeker = false;
        renderBoards();
        renderQueue();
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('history-list');
        container.innerHTML = '';
        let gekozenDatum = document.getElementById('date-filter').value;

        reguliereWedstrijden.forEach(m => {
            if(gespeeldeReguliereIds.has(m.id) && (gekozenDatum === "ALL" || m.datum === gekozenDatum)) {
                container.innerHTML += `<div style="font-size:0.9rem; margin-bottom:5px;">✅ [Comp] ${m.thuis} vs ${m.uit}</div>`;
            }
        });
        bekerWedstrijden.forEach(m => {
            if(gespeeldeBekerIds.has(m.id) && (gekozenDatum === "ALL" || m.datum === gekozenDatum)) {
                container.innerHTML += `<div style="font-size:0.9rem; margin-bottom:5px;">✅ [Beker] ${m.thuis} vs ${m.uit}</div>`;
            }
        });
    }

    window.onload = haalAlleData;
</script>
</body>
</html>
