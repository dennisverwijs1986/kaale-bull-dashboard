<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaale Bull Dart Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #162447;
            --accent: #e43f5a;
            --text-color: #ffffff;
            --text-muted: #95a5a6;
            --success: #2ecc71;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            display: block;
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--card-bg);
            position: relative;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            right: 20px;
            background-color: var(--success);
            color: black;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .dashboard-container {
            display: block;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Borden / Banen Grid */
        .boards-grid {
            display: block;
            margin-bottom: 40px;
        }

        .board-card {
            display: inline-block;
            width: 31%;
            margin: 1%;
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            vertical-align: top;
            border-left: 5px solid var(--accent);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        @media (max-width: 900px) {
            .board-card { width: 48%; }
        }
        @media (max-width: 600px) {
            .board-card { width: 98%; }
        }

        .board-card h3 {
            margin: 0 0 15px 0;
            color: var(--accent);
            font-size: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        .match-details {
            font-size: 16px;
            line-height: 1.5;
        }

        .match-details div {
            margin-bottom: 8px;
        }

        .player-vs {
            font-weight: bold;
            font-size: 18px;
        }

        /* Wachtrij / Wedstrijden Sectie */
        .queue-section {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .queue-section h2 {
            margin: 0 0 20px 0;
            font-size: 22px;
            border-left: 4px solid var(--accent);
            padding-left: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        th {
            background-color: rgba(0,0,0,0.2);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
        }

        tr:hover {
            background-color: rgba(255,255,255,0.05);
        }

        .loading, .empty-msg {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 16px;
            font-style: italic;
        }
    </style>
</head>

                    <td><span style="color: var(--accent); font-weight: bold;">${w.status || 'Wacht'}</span></td>

            });
