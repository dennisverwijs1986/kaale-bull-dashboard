<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>De Kaale Bull • Live Dart Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg:#07111f;
    --bg2:#0d1b2d;
    --panel:rgba(17,27,43,.88);
    --panel-border:rgba(255,255,255,.08);

    --accent:#ff2b2b;
    --blue:#1ea7ff;
    --green:#21d07a;
    --orange:#ff9f1a;

    --text:#ffffff;
    --muted:#9fb3c8;

    --shadow:0 10px 30px rgba(0,0,0,.35);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top left, rgba(30,167,255,.12), transparent 35%),
        radial-gradient(circle at bottom right, rgba(255,43,43,.10), transparent 35%),
        linear-gradient(135deg,var(--bg),var(--bg2));
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
}

.container{
    width:min(1800px,95%);
    margin:auto;
    padding:24px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding:22px 28px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:24px;
    backdrop-filter:blur(12px);
    box-shadow:var(--shadow);
    margin-bottom:24px;
}

.brand{
    display:flex;
    flex-direction:column;
}

.brand h1{
    font-size:2rem;
    letter-spacing:1px;
    font-weight:900;
}

.brand span{
    color:var(--muted);
    margin-top:4px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:16px;
}

.live-clock{
    font-size:2rem;
    font-weight:800;
}

.status-badge{
    padding:10px 18px;
    border-radius:999px;
    font-size:.9rem;
    font-weight:700;
    letter-spacing:.5px;
}

.status-online{
    background:rgba(33,208,122,.15);
    border:1px solid rgba(33,208,122,.35);
    color:var(--green);
}

.status-offline{
    background:rgba(255,43,43,.15);
    border:1px solid rgba(255,43,43,.35);
    color:var(--accent);
}

/* LIVE BOARDS */

.section-title{
    display:flex;
    align-items:center;
    gap:12px;
    margin:30px 0 18px;
}

.section-title h2{
    font-size:1.4rem;
}

.live-dot{
    width:12px;
    height:12px;
    background:var(--accent);
    border-radius:50%;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);opacity:1;}
    50%{transform:scale(1.35);opacity:.5;}
    100%{transform:scale(1);opacity:1;}
}

.boards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.board{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:24px;
    padding:24px;
    position:relative;
    overflow:hidden;
    backdrop-filter:blur(12px);
    box-shadow:var(--shadow);
    min-height:260px;
}

.board::after{
    content:"";
    position:absolute;
    top:-80px;
    right:-80px;
    width:180px;
    height:180px;
    background:radial-gradient(circle, rgba(255,43,43,.12), transparent 70%);
}

.board-number{
    font-size:3rem;
    font-weight:900;
    color:rgba(255,255,255,.08);
    position:absolute;
    top:10px;
    right:20px;
}

.board-status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    border-radius:999px;
    font-size:.8rem;
    font-weight:700;
    margin-bottom:22px;
}

.board-live{
    background:rgba(255,43,43,.15);
    color:var(--accent);
    border:1px solid rgba(255,43,43,.3);
}

.board-free{
    background:rgba(255,255,255,.05);
    color:var(--muted);
    border:1px solid rgba(255,255,255,.08);
}

.division{
    color:var(--blue);
    font-weight:700;
    margin-bottom:16px;
}

.teams{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin:20px 0;
}

.team{
    font-size:1.5rem;
    font-weight:800;
}

.vs{
    color:var(--muted);
    font-size:.9rem;
    letter-spacing:2px;
}

.board-footer{
    margin-top:24px;
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:.9rem;
}

/* PROGRAMMA */

.programma{
    margin-top:40px;
}

.programma-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:16px;
}

.match-card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:18px;
    padding:18px;
    backdrop-filter:blur(12px);
}

.match-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:14px;
}

.match-time{
    color:var(--blue);
    font-weight:800;
}

.match-division{
    color:var(--muted);
    font-size:.9rem;
}

.match-teams{
    line-height:1.7;
}

.match-footer{
    margin-top:14px;
    font-size:.85rem;
    color:var(--muted);
}

.inhaal{
    color:var(--orange);
    font-weight:700;
}

/* TICKER */

.ticker-wrap{
    margin-top:30px;
    overflow:hidden;
    border-radius:18px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.05);
}

.ticker{
    white-space:nowrap;
    padding:14px 0;
    display:inline-block;
    animation:ticker 40s linear infinite;
    font-weight:700;
}

@keyframes ticker{
    from{transform:translateX(100%);}
    to{transform:translateX(-100%);}
}

/* EMPTY */

.empty{
    background:rgba(255,255,255,.04);
    border:1px dashed rgba(255,255,255,.12);
    border-radius:18px;
    padding:24px;
    color:var(--muted);
    text-align:center;
}

/* RESPONSIVE */

@media(max-width:900px){

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .live-clock{
        font-size:1.5rem;
    }

    .team{
        font-size:1.2rem;
    }

}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="brand">
            <h1>🎯 DE KAALE BULL</h1>
            <span>Live Dart Dashboard</span>
        </div>

        <div class="header-right">
            <div class="live-clock" id="clock">00:00</div>

            <div class="status-badge status-online" id="statusBadge">
                SUPABASE LIVE
            </div>
        </div>

    </div>

    <!-- LIVE BORDEN -->

    <div class="section-title">
        <div class="live-dot"></div>
        <h2>Live Wedstrijden</h2>
    </div>

    <div class="boards-grid" id="boardsContainer"></div>

    <!-- TICKER -->

    <div class="ticker-wrap">
        <div class="ticker" id="ticker">
            Laden van wedstrijden...
        </div>
    </div>

    <!-- PROGRAMMA -->

    <div class="programma">

        <div class="section-title">
            <h2>Programma</h2>
        </div>

        <div class="programma-grid" id="programmaContainer"></div>

    </div>

</div>

<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL = "JOUW_SUPABASE_URL";
const SUPABASE_KEY = "JOUW_SUPABASE_ANON_KEY";

const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

/* =========================================
   CLOCK
========================================= */

function updateClock(){

    const now = new Date();

    document.getElementById("clock").innerHTML =
        now.toLocaleTimeString("nl-NL", {
            hour:'2-digit',
            minute:'2-digit'
        });

}

setInterval(updateClock,1000);
updateClock();

/* =========================================
   DATA
========================================= */

async function haalDataOp(){

    try{

        const { data, error } = await supabase
            .from('wedstrijden')
            .select('*')
            .order('tijd', { ascending:true });

        if(error) throw error;

        document.getElementById("statusBadge")
            .className =
            "status-badge status-online";

        document.getElementById("statusBadge")
            .innerHTML =
            "SUPABASE LIVE";

        renderBoards(data);
        renderProgramma(data);
        renderTicker(data);

    }
    catch(err){

        console.error(err);

        document.getElementById("statusBadge")
            .className =
            "status-badge status-offline";

        document.getElementById("statusBadge")
            .innerHTML =
            "OFFLINE ERROR";
    }

}

/* =========================================
   LIVE BOARDS
========================================= */

function renderBoards(data){

    const container =
        document.getElementById("boardsContainer");

    container.innerHTML = "";

    const liveMatches =
        data.filter(w =>
            w.status === 'bezig' ||
            w.status === 'Live'
        );

    for(let i=0;i<4;i++){

        const match = liveMatches[i];

        if(match){

            container.innerHTML += `
                <div class="board">

                    <div class="board-number">
                        ${i+1}
                    </div>

                    <div class="board-status board-live">
                        ● LIVE
                    </div>

                    <div class="division">
                        ${match.divisie || '-'}
                    </div>

                    <div class="teams">
                        <div class="team">
                            ${match.thuis}
                        </div>

                        <div class="vs">
                            VS
                        </div>

                        <div class="team">
                            ${match.uit}
                        </div>
                    </div>

                    <div class="board-footer">
                        <span>
                            Ronde ${match.ronde || '-'}
                        </span>

                        <span>
                            ${match.tijd || ''}
                        </span>
                    </div>

                </div>
            `;

        } else {

            container.innerHTML += `
                <div class="board">

                    <div class="board-number">
                        ${i+1}
                    </div>

                    <div class="board-status board-free">
                        Bord Vrij
                    </div>

                    <div class="teams">
                        <div class="team">
                            Geen actieve wedstrijd
                        </div>
                    </div>

                </div>
            `;

        }

    }

}

/* =========================================
   PROGRAMMA
========================================= */

function renderProgramma(data){

    const container =
        document.getElementById("programmaContainer");

    container.innerHTML = "";

    const upcoming =
        data.filter(w =>
            w.status !== 'gespeeld' &&
            w.status !== 'bezig' &&
            w.status !== 'Live'
        );

    if(upcoming.length === 0){

        container.innerHTML = `
            <div class="empty">
                Geen geplande wedstrijden voor vandaag.
            </div>
        `;

        return;
    }

    upcoming.forEach(match => {

        container.innerHTML += `
            <div class="match-card">

                <div class="match-top">

                    <div class="match-time">
                        ${match.tijd || '--:--'}
                    </div>

                    <div class="match-division">
                        ${match.divisie || ''}
                    </div>

                </div>

                <div class="match-teams">
                    <strong>${match.thuis}</strong>
                    <br>
                    vs
                    <br>
                    <strong>${match.uit}</strong>
                </div>

                <div class="match-footer">

                    Ronde ${match.ronde || '-'}

                    ${
                        match.is_inhaal
                        ? '<span class="inhaal"> • INHAALWEDSTRIJD</span>'
                        : ''
                    }

                </div>

            </div>
        `;

    });

}

/* =========================================
   TICKER
========================================= */

function renderTicker(data){

    const ticker =
        document.getElementById("ticker");

    const upcoming =
        data.filter(w =>
            w.status !== 'gespeeld'
        );

    if(upcoming.length === 0){

        ticker.innerHTML =
            "Geen wedstrijden gepland";

        return;
    }

    ticker.innerHTML =
        upcoming.map(match => `
            🎯
            ${match.thuis}
            vs
            ${match.uit}
            •
            ${match.tijd}
            •
            ${match.divisie}
            &nbsp;&nbsp;&nbsp;&nbsp;
        `).join("");

}

/* =========================================
   REALTIME UPDATES
========================================= */

supabase
.channel('live-wedstrijden')
.on(
    'postgres_changes',
    {
        event:'*',
        schema:'public',
        table:'wedstrijden'
    },
    () => {
        haalDataOp();
    }
)
.subscribe();

/* FALLBACK REFRESH */

setInterval(haalDataOp,10000);

/* INIT */

haalDataOp();

</script>

</body>
</html>
