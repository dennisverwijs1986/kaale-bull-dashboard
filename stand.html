<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Stand & statistieken - De Kaale Bull</title>
<style>
  :root{--bg:#0f1520;--s1:#161f30;--s2:#1e2a40;--s3:#243350;--border:#2a3a56;--text:#f1f5f9;--muted:#94a3b8;--dim:#64748b;--green:#10b981;--red:#ef4444;--orange:#f59e0b;--blue:#3b82f6;--ere:#a855f7;--gold:#f5c518}
  *{box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0}
  button,select{font-family:inherit;font-size:inherit;color:inherit}
  header{background:#080d16;padding:14px 20px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:12px}
  header h1{font-size:1.1rem;margin:0;font-weight:800} header .accent{color:var(--orange)}
  #bijgewerkt{margin-left:auto;font-size:.78rem;color:var(--muted)}
  #ververs{background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:.8rem;font-weight:700}
  #ververs:hover{border-color:var(--blue)}
  main{max-width:1600px;margin:0 auto;padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .blok.stats{grid-column:1/-1}
  @media(min-width:1900px){main{max-width:2000px;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr)}.blok.stats{grid-column:auto}}
  @media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
  .blok{overflow-x:auto}
  .blok{background:var(--s1);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .blok-kop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--s2);border-bottom:1px solid var(--border)}
  .blok-kop h2{margin:0;font-size:.95rem;font-weight:800;flex:1;display:flex;align-items:center;gap:8px}
  .blok-kop h2::before{content:'';width:4px;height:16px;border-radius:2px;background:var(--dim)}
  .blok.ere h2::before{background:var(--ere)} .blok.eerste h2::before{background:var(--blue)} .blok.stats h2::before{background:var(--orange)}
  .seg{display:flex;gap:3px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px}
  .seg button{background:none;border:none;color:var(--muted);padding:4px 9px;border-radius:4px;cursor:pointer;font-size:.75rem;font-weight:700}
  .seg button.actief{background:var(--s3);color:var(--text)}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th{color:var(--muted);font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:7px 8px;white-space:nowrap;border-bottom:1px solid var(--border)}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  th.sort{cursor:pointer;user-select:none} th.sort:hover,th.actief-sort{color:var(--text)}
  td{padding:5px 8px;border-top:1px solid rgba(42,58,86,.55);white-space:nowrap}
  tbody tr:nth-child(even) td{background:rgba(255,255,255,.022)}
  td.pos{width:30px;text-align:center;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  tr.leider td.pos{color:var(--gold)}
  tr.zone-po td{background:rgba(245,158,11,.06)!important} tr.zone-po td.pos{color:var(--orange)}
  tr.zone-deg td{background:rgba(239,68,68,.07)!important} tr.zone-deg td.pos{color:var(--red)}
  tr.streep td{border-top:1px dashed rgba(148,163,184,.5)}
  tr.prom td{background:rgba(16,185,129,.07)!important} tr.prom td.pos{color:var(--green)}
  tr.gestopt td{opacity:.5}
  .tag{display:inline-block;font-size:.6rem;font-weight:800;text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
  .tag.po{background:rgba(245,158,11,.2);color:#fcd34d} .tag.deg{background:rgba(239,68,68,.2);color:#fca5a5}
  .tag.prom{background:rgba(16,185,129,.2);color:#6ee7b7} .tag.titel{background:rgba(245,197,24,.18);color:#fde68a} .tag.ticket{background:rgba(59,130,246,.2);color:#93c5fd}
  .div-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .noot{font-size:.74rem;color:var(--muted);padding:8px 12px;border-top:1px solid var(--border);line-height:1.45}
  .leeg{padding:30px;text-align:center;color:var(--muted)}
  .stats-wrap{overflow-x:auto}
  .hoog{color:var(--gold);font-weight:800}
</style>
</head>
<body>
<header>
  <h1>🎯 Kaale Bull <span class="accent">— Stand & statistieken</span></h1>
  <span id="bijgewerkt"></span>
  <button id="ververs" title="Opnieuw ophalen">↻ Vernieuwen</button>
</header>
<main>
  <section class="blok ere" id="blokEre"><div class="leeg">Laden…</div></section>
  <section class="blok eerste" id="blokEerste"><div class="leeg">Laden…</div></section>
  <section class="blok stats" id="blokStats"><div class="leeg">Laden…</div></section>
</main>
<script>
{
const SB_URL = 'https://ctxurzqtglckairgbjno.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0eHVyenF0Z2xja2Fpcmdiam5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzExNjYsImV4cCI6MjA5NDcwNzE2Nn0.Ty3nNEyNfZVebxqXRS5RALM7JA5AdghIYAS6VjfFITQ';
const sbGet = async (t,q='') => { const r = await fetch(`${SB_URL}/rest/v1/${t}?${q}`, { headers:{ apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}` }, cache:'no-store' }); if (!r.ok) throw new Error(await r.text()); return r.json(); };
const esc = s => s==null ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BYE = 'vrije ronde';
const PERIODE_LABELS = {1:'Ronde 1–10', 2:'Ronde 11–21', 3:'Ronde 22–31', 4:'Ronde 32–42'};
const ERE_PLAYOFF = [17,18,19], ERE_DEGRADATIE = [20,21];
const vandaag = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const S = { periode:null, statsDiv:'Eredivisie', statsSort:{k:'gem',hoog:true} };

// ── Rekenregels: letterlijk overgenomen uit de spelers-app (schema/index.html), zodat de stand overal gelijk is ──
function berekenEre(data){
  const t={}, rij=n=>t[n]||(t[n]={speler:n,g:0,w:0,v:0,lv:0,lt:0,p:0,zonder:0});
  const bye=n=>!n||n.toLowerCase()===BYE;
  data.forEach(m=>{
    const metLegs = m.legs_thuis!==null && m.legs_uit!==null;
    let winnaar=null;
    if (metLegs) winnaar = m.legs_thuis>m.legs_uit ? m.thuis : m.uit;
    else if (m.uitslag){
      const mt=m.uitslag.match(/^(Winnaar|Verliezer):\s*(.+)$/i);
      if (mt){ const n=mt[2].trim(); winnaar = mt[1].toLowerCase()==='winnaar' ? n : (n===m.thuis ? m.uit : m.thuis); }
    }
    [[m.thuis,m.legs_thuis,m.legs_uit],[m.uit,m.legs_uit,m.legs_thuis]].forEach(([n,voor,tegen])=>{
      if (bye(n)) return; const r=rij(n); r.g++;
      if (winnaar===n) r.w++; else if (winnaar) r.v++;
      if (metLegs){ r.lv+=voor; r.lt+=tegen; r.p+=voor; } else r.zonder++;
    });
  });
  const l=Object.values(t).sort((a,b)=>b.p-a.p||b.w-a.w||a.v-b.v||(b.lv-b.lt)-(a.lv-a.lt)||a.speler.localeCompare(b.speler));
  l.forEach((r,i)=>{ const v=l[i-1]; r.pos=(v&&v.p===r.p&&v.w===r.w&&v.v===r.v&&(v.lv-v.lt)===(r.lv-r.lt))?v.pos:i+1; });
  return l;
}
// Spelers die tijdens het seizoen gestopt zijn (spelers.gestopt, schakelaar in spelerbeheer):
// hun wedstrijden zijn uit de planning gehaald, maar ze blijven met 0 onderaan de ranglijst
// van hun divisie staan. Ze zijn niet meer te kiezen bij "Wie ben jij?".
// Nieuw seizoen: speler uit spelerbeheer halen of de schakelaar uitzetten.
function isGestopt(naam){ return (S.gestopt||[]).some(g=>g.naam===naam); }
function voegGestoptToe(l, divisie){
  (S.gestopt||[]).filter(g=>g.divisie===divisie && !l.some(r=>r.speler===g.naam))
    .forEach(g=>l.push({speler:g.naam,g:0,w:0,v:0,lv:0,lt:0,p:0,zonder:0,gestopt:true,pos:l.length+1}));
  return l;
}
// Eerste Divisie voorlopig bijwerken met gespeelde wedstrijden waarvan de legstand nog niet is ingelezen.
// Punten (= gewonnen legs) volgen pas na het inlezen; wedstrijden en winst tellen alvast mee, gemarkeerd met *.
// Zonder voorlopige wedstrijden blijft de officiële volgorde uit de view staan.
function winnaarUit(m){
  const mt=String(m.uitslag||'').match(/^(Winnaar|Verliezer):\s*(.+)$/i);
  if (!mt) return null;
  const n=mt[2].trim();
  return mt[1].toLowerCase()==='winnaar' ? n : (n===m.thuis ? m.uit : m.thuis);
}
function voorlopigEerste(rijen, zonder, perPeriode){
  const ptnKey = perPeriode ? 'periodepunten' : 'punten';
  const periodeVan = sr => { const r=parseInt(sr,10); return isNaN(r) ? null : r<=10 ? 1 : r<=21 ? 2 : r<=31 ? 3 : 4; };
  const uit = (rijen||[]).map(r=>({...r, wedstrijden_gespeeld:Number(r.wedstrijden_gespeeld), gewonnen:Number(r.gewonnen),
    [ptnKey]:Number(r[ptnKey]), _orig:Number(r.positie), voorlopig:0}));
  const bye = n => !n || n.toLowerCase()===BYE;
  const geraakt = new Set();
  (zonder||[]).forEach(m=>{
    const per = perPeriode ? periodeVan(m.speelronde) : null;
    if (perPeriode && !per) return;
    const w = winnaarUit(m);
    [m.thuis, m.uit].forEach(n=>{
      if (bye(n)) return;
      let r = uit.find(x=>x.speler===n && (!perPeriode || x.periode===per));
      if (!r){ r={ speler:n, wedstrijden_gespeeld:0, gewonnen:0, [ptnKey]:0, _orig:999, voorlopig:0 }; if (perPeriode) r.periode=per; uit.push(r); }
      r.wedstrijden_gespeeld++; r.voorlopig++; if (w===n) r.gewonnen++;
      geraakt.add(perPeriode ? per : 'x');
    });
  });
  // Herordenen per groep (periode of eindstand) waar voorlopige wedstrijden in zitten
  const groepen = perPeriode ? [1,2,3,4] : ['x'];
  groepen.forEach(g=>{
    if (!geraakt.has(g)) return;
    // Op punten; bij gelijke punten de officiële volgorde, tenzij er een voorlopige wedstrijd in dat gelijke blok zit:
    // dan eerst op winst (zoals de Eredivisie), daarna de officiële volgorde.
    const alle = uit.filter(r=>!perPeriode || r.periode===g);
    const perPunten = {}; alle.forEach(r=>{ (perPunten[r[ptnKey]]=perPunten[r[ptnKey]]||[]).push(r); });
    const l = Object.keys(perPunten).map(Number).sort((a,b)=>b-a).flatMap(pt=>{
      const blok = perPunten[pt], opWinst = blok.some(r=>r.voorlopig);
      return blok.sort((a,b)=>(opWinst ? b.gewonnen-a.gewonnen : 0) || a._orig-b._orig || a.speler.localeCompare(b.speler));
    });
    l.forEach((r,i)=>{ const v=l[i-1];
      const gelijk = v && v[ptnKey]===r[ptnKey] && v._orig===r._orig && (v._orig!==999 || (v.gewonnen===r.gewonnen && v.wedstrijden_gespeeld===r.wedstrijden_gespeeld));
      r.positie = gelijk ? v.positie : i+1; });
  });
  return uit.sort((a,b)=>(perPeriode ? a.periode-b.periode : 0) || a.positie-b.positie || a.speler.localeCompare(b.speler));
}

// Eindstand Eerste Divisie: totaal over de periodes, directe promotie (nr. 1 en 2),
// periodetitels en play-off tickets — zelfde regels als periode.html
// Volgorde (incl. tiebreak: punten > minste wedstrijden > onderling > legsaldo) komt uit de view eindstand_eerste_divisie.
function berekenEind(data, eind){
  const lijst=(eind||[]).map(r=>({speler:r.speler,w:Number(r.wedstrijden_gespeeld),g:Number(r.gewonnen),p:Number(r.punten),pos:r.positie,voorlopig:r.voorlopig||0}));
  const promo=new Set(lijst.slice(0,2).map(t=>t.speler));
  const titels={}, tickets={};
  [1,2,3,4].forEach(p=>{
    const rijen=data.filter(r=>r.periode===p); if (!rijen.length) return;
    (titels[rijen[0].speler]=titels[rijen[0].speler]||[]).push(p);
    const k=rijen.find(r=>!tickets[r.speler] && !promo.has(r.speler)); if (k) tickets[k.speler]=p;
  });
  const vijfde=lijst.find(t=>!tickets[t.speler] && !promo.has(t.speler)); if (vijfde) tickets[vijfde.speler]='E';
  lijst.forEach(t=>{ t.promo=promo.has(t.speler); t.titels=titels[t.speler]||[]; t.ticket=tickets[t.speler]||null; });
  return lijst;
}

// ── Data ──
async function laad(){
  document.getElementById('bijgewerkt').textContent = 'ophalen…';
  try{
    const [pstRuw, ere, stats, volgende, eindRuw, eersteZonder, gestoptRuw, hist] = await Promise.all([
      sbGet('periodestand_eerste_divisie','select=*&order=periode.asc,positie.asc'),
      sbGet('wedstrijden','select=thuis,uit,uitslag,legs_thuis,legs_uit&divisie=eq.Eredivisie&status=eq.gespeeld'),
      sbGet('stats_snapshots','select=peildatum,divisie,speler,wedstrijden,s180,t140,t100,gem,hoogste_finish,beste_leg,first9,checkout_pct&order=peildatum.desc&limit=300'),
      sbGet('wedstrijden',`select=speelronde&divisie=eq.Eerste%20Divisie&status=neq.gespeeld&datum_nnb=eq.false&is_inhaal=eq.false&datum=gte.${vandaag()}&order=datum.asc,tijdstip.asc&limit=20`),
      sbGet('eindstand_eerste_divisie','select=*&order=positie.asc'),
      sbGet('wedstrijden','select=thuis,uit,uitslag,speelronde&divisie=eq.Eerste%20Divisie&status=eq.gespeeld&or=(legs_thuis.is.null,legs_uit.is.null)').catch(()=>[]),
      sbGet('spelers','select=naam,divisie&gestopt=eq.true').catch(()=>[]),
      sbGet('historie_stats','select=seizoen,speler,gem&order=seizoen.desc').catch(()=>[])
    ]);
    S.gestopt = gestoptRuw || [];
    const pst = voorlopigEerste(pstRuw, eersteZonder, true);
    const eindRijen = voorlopigEerste(eindRuw, eersteZonder, false);
    const laatste={}; stats.forEach(r=>{ if (!laatste[r.divisie] || r.peildatum>laatste[r.divisie]) laatste[r.divisie]=r.peildatum; });
    const vorig={}; hist.forEach(h=>{ if (!(h.speler in vorig)) vorig[h.speler]=h.gem; });
    S.d = { pst, ere: voegGestoptToe(berekenEre(ere), 'Eredivisie'), eind: berekenEind(pst, eindRijen),
            stats: stats.filter(r=>r.peildatum===laatste[r.divisie]), peil: laatste, vorig,
            eindLegs: Object.fromEntries(eindRijen.map(r=>[r.speler, r])) };
    if (!S.periode){
      const rondes = volgende.map(w=>parseInt(w.speelronde,10)).filter(n=>!isNaN(n));
      const r = rondes.length ? Math.min(...rondes) : null;
      S.periode = r===null ? 'eind' : r<=10 ? 1 : r<=21 ? 2 : r<=31 ? 3 : 4;
    }
    render();
    const n=new Date(); document.getElementById('bijgewerkt').textContent = `bijgewerkt ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  }catch(e){
    document.getElementById('bijgewerkt').textContent = 'ophalen mislukt';
    if (!S.d) ['blokEre','blokEerste','blokStats'].forEach(id=>document.getElementById(id).innerHTML='<div class="leeg">Kan de stand nu niet ophalen.</div>');
  }
}

// ── Weergave ──
function render(){ renderEre(); renderEerste(); renderStats(); }

function renderEre(){
  const l = S.d.ere, el = document.getElementById('blokEre');
  const geenLegs = l.every(r=>r.lv===0 && r.lt===0);
  const zonder = l.reduce((n,r)=>n+r.zonder,0)/2;
  const rij = (r,i)=>{ const plek=i+1; let cls='', tag='';
    if (plek===1) cls='leider';
    if (ERE_PLAYOFF.includes(plek)){ cls='zone-po'; if (plek===ERE_PLAYOFF[0]) tag='<span class="tag po">play-offs</span>'; }
    if (ERE_DEGRADATIE.includes(plek)){ cls='zone-deg'; if (plek===ERE_DEGRADATIE[0]) tag='<span class="tag deg">degradatie</span>'; }
    if (plek===ERE_PLAYOFF[0]||plek===ERE_DEGRADATIE[0]) cls+=' streep';
    const saldo = r.lv-r.lt;
    return `<tr class="${cls}${r.gestopt?' gestopt':''}"><td class="pos">${r.pos}</td><td>${esc(r.speler)}${r.gestopt?' <span style="color:var(--muted)">(gestopt)</span>':''}${tag}</td>
      <td class="num">${r.g}</td><td class="num">${r.w}</td><td class="num">${r.v}</td><td class="num">${geenLegs?'–':`${r.lv}-${r.lt}`}</td><td class="num">${geenLegs?'–':(saldo>0?'+':'')+saldo}</td><td class="num"><b>${geenLegs?'–':r.p}</b>${r.zonder?' *':''}</td></tr>`;
  };
  el.innerHTML = `<div class="blok-kop"><h2>Eredivisie</h2></div>
    <table><thead><tr><th></th><th>Speler</th><th class="num">G</th><th class="num">W</th><th class="num">V</th><th class="num">Legs</th><th class="num">+/-</th><th class="num">Ptn</th></tr></thead><tbody>${l.map(rij).join('')}</tbody></table>
    <div class="noot">Punten = gewonnen legs.${zonder?` * ${Math.round(zonder)} gespeelde wedstrijd(en) zonder legstand tellen nog niet mee voor de punten.`:''} Nr. 17–19 play-offs, 20–21 degradatie.</div>`;
}

// Legs voor/tegen en saldo uit de views (legs_voor, legs_tegen); voorlopige wedstrijden zonder legstand tellen hier niet mee
function legsCellen(r){
  if (!r || r.legs_voor==null || r.legs_tegen==null) return '<td class="num">–</td><td class="num">–</td>';
  const v=Number(r.legs_voor), t=Number(r.legs_tegen), d=v-t;
  return `<td class="num">${v}-${t}</td><td class="num">${d>0?'+':''}${d}</td>`;
}
function renderEerste(){
  const el = document.getElementById('blokEerste');
  const knop = (v,t) => `<button data-p="${v}" class="${S.periode===v?'actief':''}">${t}</button>`;
  const seg = `<div class="seg">${[1,2,3,4].map(p=>knop(p,'P'+p)).join('')}${knop('eind','Eind')}</div>`;
  let tabel, noot;
  if (S.periode==='eind'){
    const l = S.d.eind;
    tabel = l.map(t=>{ const tags=[];
      if (t.promo) tags.push('<span class="tag prom">⬆ promotie</span>');
      if (t.titels.length) tags.push(`<span class="tag titel">🏆 P${t.titels.join(', P')}</span>`);
      if (t.ticket) tags.push(`<span class="tag ticket">🎟 ${t.ticket==='E'?'eindstand':'P'+t.ticket}</span>`);
      return `<tr class="${t.promo?'prom':''}"><td class="pos">${t.pos}</td><td>${esc(t.speler)}${tags.join('')}</td><td class="num">${t.w}</td><td class="num">${t.g}</td><td class="num">${t.w-t.g}</td>${legsCellen(S.d.eindLegs[t.speler])}<td class="num"><b>${t.p}</b>${t.voorlopig?' *':''}</td></tr>`;
    }).join('');
    noot = 'Nr. 1 en 2 promoveren direct. 🏆 periodetitel · 🎟 play-off ticket (per periode de beste zonder ticket, plus één via de eindstand).';
  } else {
    const rijen = S.d.pst.filter(r=>r.periode===S.periode);
    tabel = rijen.map(r=>`<tr class="${r.positie==1?'leider':''}"><td class="pos">${r.positie==1?'🏆':r.positie}</td><td>${esc(r.speler)}</td><td class="num">${r.wedstrijden_gespeeld}</td><td class="num">${r.gewonnen}</td><td class="num">${r.wedstrijden_gespeeld-r.gewonnen}</td>${legsCellen(r)}<td class="num"><b>${r.periodepunten}</b>${r.voorlopig?' *':''}</td></tr>`).join('');
    noot = `${PERIODE_LABELS[S.periode]}. Punten = gewonnen legs.`;
  }
  const vl = (S.periode==='eind' ? S.d.eind : S.d.pst.filter(r=>r.periode===S.periode)).reduce((n,r)=>n+(r.voorlopig||0),0);
  if (vl) noot += ` * ${Math.round(vl/2)} gespeelde wedstrijd(en) zonder legstand: winst telt al mee, punten volgen na het inlezen.`;
  el.innerHTML = `<div class="blok-kop"><h2>Eerste Divisie</h2>${seg}</div>
    ${tabel ? `<table><thead><tr><th></th><th>Speler</th><th class="num">G</th><th class="num">W</th><th class="num">V</th><th class="num">Legs</th><th class="num">+/-</th><th class="num">Ptn</th></tr></thead><tbody>${tabel}</tbody></table>` : '<div class="leeg">Nog geen gespeelde wedstrijden in deze periode.</div>'}
    <div class="noot">${noot}</div>`;
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ S.periode = b.dataset.p==='eind' ? 'eind' : Number(b.dataset.p); renderEerste(); });
}

const KOLOMMEN = [['gem','Gem',true],['first9','First 9',true],['checkout_pct','Checkout',true],['s180','180',true],['t140','140+',true],['t100','100+',true],['hoogste_finish','HF',true],['beste_leg','BL',false]];
function renderStats(){
  const el = document.getElementById('blokStats');
  const div = S.statsDiv, {k, hoog} = S.statsSort;
  const num = (r,x) => r[x]===null || r[x]===undefined || r[x]==='' ? null : Number(r[x]);
  const rijen = S.d.stats.filter(r=>r.divisie===div).sort((a,b)=>{
    const x=num(a,k), y=num(b,k); if (x===null && y===null) return a.speler.localeCompare(b.speler);
    if (x===null) return 1; if (y===null) return -1; return (hoog ? y-x : x-y) || a.speler.localeCompare(b.speler); });
  const top = {}; KOLOMMEN.forEach(([c,,h])=>{ const w=rijen.map(r=>num(r,c)).filter(v=>v!==null && v!==0); if (w.length) top[c]= h ? Math.max(...w) : Math.min(...w); });
  const fmt = (r,c) => { const v=num(r,c); if (v===null) return '<span style="color:#4a5a76">–</span>';
    const t = c==='gem'||c==='first9' ? v.toFixed(2) : c==='checkout_pct' ? v.toFixed(1)+'%' : v; return top[c]===v ? `<span class="hoog">${t}</span>` : t; };
  const pijl = r => { const v=S.d.vorig[r.speler], g=num(r,'gem'); if (v==null||g===null) return ''; const d=g-v;
    return ` <span style="font-size:.7rem;color:${d>=0?'var(--green)':'var(--red)'}">${d>=0?'▲':'▼'}${Math.abs(d).toFixed(1)}</span>`; };
  const seg = `<div class="seg"><button data-d="Eredivisie" class="${div==='Eredivisie'?'actief':''}">Eredivisie</button><button data-d="Eerste Divisie" class="${div==='Eerste Divisie'?'actief':''}">Eerste Divisie</button></div>`;
  const kop = KOLOMMEN.map(([c,t])=>`<th class="num sort${k===c?' actief-sort':''}" data-k="${c}">${t}${k===c?(hoog?' ▼':' ▲'):''}</th>`).join('');
  el.innerHTML = `<div class="blok-kop"><h2>Statistieken</h2>${seg}</div>
    ${rijen.length ? `<div class="stats-wrap"><table><thead><tr><th></th><th>Speler</th><th class="num">W</th>${kop}</tr></thead><tbody>${
      rijen.map((r,i)=>`<tr><td class="pos">${num(r,k)===null?'':i+1}</td><td>${esc(r.speler)}</td><td class="num">${num(r,'wedstrijden')??''}</td>${KOLOMMEN.map(([c])=>`<td class="num">${fmt(r,c)}${c==='gem'?pijl(r):''}</td>`).join('')}</tr>`).join('')
    }</tbody></table></div>` : `<div class="leeg">Nog geen statistieken voor de ${esc(div)}.</div>`}
    <div class="noot">Uit de laatste leaderboard-upload (${esc(S.d.peil[div]||'–')}), zonder beker. Klik op een kolomkop om te sorteren. Vetgedrukt = beste van de divisie. ▲▼ = gemiddelde t.o.v. vorig seizoen. W = wedstrijden.</div>`;
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ S.statsDiv=b.dataset.d; renderStats(); });
  el.querySelectorAll('[data-k]').forEach(th=>th.onclick=()=>{ const c=th.dataset.k, def=KOLOMMEN.find(x=>x[0]===c)[2];
    S.statsSort = S.statsSort.k===c ? {k:c,hoog:!S.statsSort.hoog} : {k:c,hoog:def}; renderStats(); });
}

document.getElementById('ververs').onclick = laad;
// Elke 5 minuten vanzelf bijwerken zolang de pagina openstaat (bijv. na het uploaden van de exports)
setInterval(()=>{ if (!document.hidden) laad(); }, 5*60*1000);
laad();
}
</script>
