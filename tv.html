<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaale Bull — TV weergave</title>
<style>
:root {
  --bg:      #0f1520;
  --s1:      #161f30;
  --s2:      #1e2a40;
  --s3:      #243350;
  --border:  #2a3a56;
  --text:    #f1f5f9;
  --muted:   #94a3b8;
  --green:   #10b981;
  --red:     #ef4444;
  --orange:  #f59e0b;
  --blue:    #3b82f6;
  --purple:  #a855f7;
  --ere:     #a855f7;
  --eerste:  #3b82f6;
  --beker:   #f59e0b;
  --inhaal:  #ef4444;
  --nnb:     #06b6d4;
  --tv-ondermarge: 4vh;   /* ruimte onder de logobalk i.v.m. TV-overscan */
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;background:var(--s1);border-bottom:1px solid var(--border);
  flex:0 0 auto;
}
.topbar-logo{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:8px;}
.topbar-logo .sub{color:var(--muted);font-size:0.8rem;font-weight:400;}
.topbar-right{display:flex;align-items:center;gap:16px;}
.clock{font-family:monospace;font-size:1.5rem;color:var(--orange);font-weight:bold;}
.datum-lbl{color:var(--muted);font-size:0.85rem;}
.sync-dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;}
.sync-dot.ok{background:var(--green);box-shadow:0 0 6px var(--green);}
.sync-dot.error{background:var(--red);}
.fs-btn{
  background:var(--s2);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:6px 12px;font-size:0.8rem;cursor:pointer;
  display:flex;align-items:center;gap:6px;font-family:inherit;
}
.fs-btn:hover{background:var(--s3);}

/* ── MEDEDELING BANNER (tussen borden en komende wedstrijden, alleen zichtbaar als actief) ── */
.mdd-banner{
  display:none;align-items:center;justify-content:center;gap:22px;
  margin:0 8px 8px;padding:14px 28px;flex:0 0 auto;border-radius:10px;
  background:var(--orange);color:#111;
  box-shadow:0 0 0 3px rgba(245,158,11,0.35);
}
.mdd-banner.show{display:flex;}
.mdd-banner .icon{font-size:2.4rem;flex:0 0 auto;animation:mddPulse 1.8s ease-in-out infinite;}
@keyframes mddPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
.mdd-banner .txt{flex:0 1 auto;font-size:2.4rem;font-weight:900;letter-spacing:0.5px;text-align:center;text-transform:uppercase;line-height:1.15;}

/* ── MAIN LAYOUT ── */
.main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}

/* Boards: 1 kolom, 4 rijen, halve schermbreedte */
.boards-wrap{flex:0 0 56%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:8px;min-width:0;min-height:0;}
.board-tile{
  position:relative;background:#000;border-radius:8px;overflow:hidden;
  border:1px solid var(--border);min-width:0;min-height:0;
}
.board-tile-hdr{
  position:absolute;top:0;left:0;right:0;z-index:5;
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 10px;background:linear-gradient(to bottom, rgba(0,0,0,0.75), rgba(0,0,0,0));
  pointer-events:none;
}
.board-tile-hdr .num{font-weight:800;font-family:monospace;font-size:0.85rem;letter-spacing:1px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.8);}
.board-tile-ctrl{display:flex;gap:4px;opacity:0;transition:opacity 0.2s;pointer-events:auto;}
.board-tile:hover .board-tile-ctrl{opacity:1;}
.tile-btn{
  background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.15);color:#fff;
  width:22px;height:22px;border-radius:4px;font-size:0.75rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.tile-btn:hover{background:rgba(0,0,0,0.8);}
.dc-viewport{position:absolute;inset:0;overflow:hidden;}
.dc-viewport iframe{
  position:absolute;top:0;left:0;border:none;
  width:1600px;height:900px;
  transform-origin:top left;
}
.board-empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:var(--muted);
}
.board-empty .icon{font-size:2rem;opacity:0.5;}
.board-empty .txt{font-size:0.85rem;}

/* ── SPONSOR IN DE SPOTLIGHT (lege bordvakken) ── */
.spot{
  position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(ellipse 55% 70% at 50% 52%, rgba(245,158,11,0.13), transparent 70%),
    linear-gradient(160deg, #131c2e 0%, #0a0f19 100%);
}
.spot::before{ /* langzaam draaiende lichtbundels achter het logo */
  content:'';position:absolute;left:50%;top:52%;width:160%;aspect-ratio:1;
  transform:translate(-50%,-50%);opacity:0.07;
  background:repeating-conic-gradient(from 0deg, #fff 0deg 6deg, transparent 6deg 30deg);
  -webkit-mask:radial-gradient(circle, #000 0%, transparent 60%);
          mask:radial-gradient(circle, #000 0%, transparent 60%);
  animation:spotDraai 120s linear infinite;
}
@keyframes spotDraai{to{transform:translate(-50%,-50%) rotate(360deg);}}
.spot-kop{
  position:absolute;top:10px;left:0;right:0;z-index:3;text-align:center;
  font-size:0.8rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--orange);opacity:0.85;
}
.spot-slide{
  position:absolute;inset:14% 10% 12%;z-index:2;
  display:flex;align-items:center;justify-content:center;
  opacity:0;
}
.spot-slide img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 8px 30px rgba(0,0,0,0.55));}
.spot-slide .naam{font-size:clamp(1.6rem,3.6vw,3.6rem);font-weight:900;color:var(--text);text-align:center;letter-spacing:1px;text-transform:uppercase;}
.spot-slide.in{opacity:1;animation:spotZoom 62s linear forwards;}
/* Logo dat tussen de balk en een groot vak vliegt */
.vlieg-logo{position:fixed;z-index:50;pointer-events:none;object-fit:contain;
  filter:drop-shadow(0 10px 28px rgba(0,0,0,0.6));will-change:left,top,width,height,transform;}
/* Leeg kaartje in de balk terwijl het logo groot in beeld staat */
.sponsor-item.weg{border-style:dashed;border-color:rgba(245,158,11,0.45);background:rgba(245,158,11,0.05);}
.sponsor-item.weg img{opacity:0;}
@keyframes spotZoom{from{scale:1;}to{scale:1.06;}}  /* rustige 'Ken Burns'-zoom tijdens het tonen */
.spot-glans{ /* lichtflits die over het logo veegt bij een wissel */
  position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;
  background:linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.22) 50%, transparent 65%);
  transform:translateX(-100%);
}
.spot-glans.flits{animation:spotGlans 1.6s ease-out forwards;}
@keyframes spotGlans{
  0%{opacity:1;transform:translateX(-100%);}
  100%{opacity:1;transform:translateX(100%);}
}
.spot-voet{
  position:absolute;bottom:10px;left:0;right:0;z-index:3;text-align:center;
  font-size:0.75rem;color:var(--muted);letter-spacing:1px;opacity:0.7;
}
.calib-panel{
  position:absolute;bottom:8px;left:8px;right:8px;z-index:6;
  background:rgba(15,21,32,0.92);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;display:none;gap:10px;flex-wrap:wrap;font-size:0.7rem;
}
.calib-panel.open{display:flex;}
.calib-grp{display:flex;align-items:center;gap:4px;}
.calib-grp span{color:var(--muted);margin-right:2px;}
.calib-btn{
  background:var(--s2);border:1px solid var(--border);color:var(--text);
  width:22px;height:22px;border-radius:4px;cursor:pointer;font-size:0.8rem;
}
.calib-reset{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.7rem;text-decoration:underline;}

/* Onderstrook: komende wedstrijden (horizontaal) + sponsorbalk */
.bottom-bar{
  flex:1 1 auto;background:var(--s1);border-top:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;
  /* Veilige marge onderin: veel TV's snijden de onderrand van het beeld af (overscan).
     Pas TV_ONDERMARGE aan als de logo's nog steeds net buiten beeld vallen. */
  padding-bottom:var(--tv-ondermarge);
}
.upcoming-panel{--k:1;flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding:calc(1.1vh * var(--k)) 28px calc(1vh * var(--k));}
.upcoming-hdr{flex:0 0 auto;font-size:calc(2.4vh * var(--k));font-weight:700;margin-bottom:calc(0.5vh * var(--k));display:flex;align-items:center;gap:10px;}
.upcoming-body{flex:1 1 auto;overflow-y:auto;}
.slot-columns{display:flex;flex-direction:column;gap:8px;min-height:100%;justify-content:safe center;}
.slot-hdr{display:flex;align-items:center;gap:18px;margin-bottom:calc(1.1vh * var(--k));flex:0 0 auto;}
.slot-hdr .tijd{font-family:monospace;font-size:calc(4.4vh * var(--k));font-weight:800;color:var(--orange);flex:0 0 auto;line-height:1;}
.slot-hdr .tag{
  font-size:calc(1.65vh * var(--k));font-weight:700;text-transform:uppercase;letter-spacing:0.5px;
  padding:calc(0.45vh * var(--k)) 14px;border-radius:8px;background:rgba(16,185,129,0.15);color:var(--green);flex:0 0 auto;
}
.slot-hdr .tag.straks{background:rgba(59,130,246,0.15);color:var(--blue);}
/* 2 kolommen: een tijdslot heeft meestal 4 wedstrijden (2x2) */
.slot-list{display:grid;grid-template-columns:1fr 1fr;gap:calc(1.1vh * var(--k)) 16px;overflow-y:auto;}
.match-pill{
  background:var(--s2);border:1px solid var(--border);border-radius:10px;
  padding:calc(1.1vh * var(--k)) 24px;display:flex;align-items:center;gap:16px;min-width:0;
}
.div-chip{font-size:calc(1.55vh * var(--k));font-weight:700;padding:calc(0.4vh * var(--k)) 12px;border-radius:6px;text-transform:uppercase;letter-spacing:0.3px;flex:0 0 auto;}
.div-chip.ere{background:rgba(168,85,247,0.2);color:var(--ere);}
.div-chip.eerste{background:rgba(59,130,246,0.2);color:var(--eerste);}
.div-chip.beker{background:rgba(245,158,11,0.2);color:var(--beker);}
.div-chip.inhaal{background:rgba(239,68,68,0.2);color:var(--inhaal);}
.div-chip.general{background:rgba(148,163,184,0.12);color:var(--muted);}
.match-pill .teams{font-size:calc(3.1vh * var(--k));font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.match-pill .teams .vs{color:var(--muted);font-weight:400;font-size:0.72em;margin:0 0.4em;}
.empty-msg{color:var(--muted);font-size:calc(2.5vh * var(--k));text-align:center;padding:20px 10px;}
.empty-msg .icon{font-size:2.4rem;display:block;margin-bottom:8px;opacity:0.5;}

.sponsor-panel{
  flex:0 0 84px;border-top:1px solid var(--border);
  display:flex;align-items:center;
  padding:0;color:var(--muted);font-size:0.75rem;
  overflow:hidden;position:relative;white-space:nowrap;
}
.sponsor-track{
  display:inline-flex;align-items:center;gap:0;
  animation:sponsorScroll 30s linear infinite;
  will-change:transform;
  --scroll-dist:0px;
}
@keyframes sponsorScroll{
  from{ transform:translateX(0); }
  to{ transform:translateX(calc(-1 * var(--scroll-dist))); }
}
.sponsor-item{
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  margin:0 35px;padding:0 22px;
  background:rgba(148,163,184,0.08);
  border:1px solid var(--border);
  border-radius:14px;
  box-sizing:border-box;
  overflow:hidden;
  height:68px;
  min-width:150px;
}
.sponsor-item img{
  /* Logo vult het kader zo groot mogelijk: vaste hoogte, breedte volgt het logo
     (brede logo's worden begrensd door max-width). Lege randen zijn uit de
     logobestanden zelf geknipt, anders blijven ze klein ogen. */
  height:52px;width:auto;max-width:230px;
  object-fit:contain;object-position:center;
  filter:grayscale(0.1);
  display:block;
}
.sponsor-item.sponsor-naam{
  font-size:1.05rem;font-weight:700;color:var(--muted);letter-spacing:0.4px;
  text-transform:uppercase;opacity:0.85;
}
</style>
</head>
<body>


<div class="topbar">
  <div class="topbar-logo">🎯 Kaale Bull <span class="sub">TV weergave</span></div>
  <div class="topbar-right">
    <span class="datum-lbl" id="datumLbl"></span>
    <span class="sync-dot" id="syncDot" title="verbindingsstatus"></span>
    <div class="clock" id="clock">00:00</div>
    <button class="fs-btn" id="fsBtn" onclick="toggleFullscreen()">⤢ Fullscreen</button>
  </div>
</div>

<div class="main">
  <div class="boards-wrap" id="boardsWrap"></div>
  <div class="mdd-banner" id="mddBanner">
    <span class="icon">📢</span>
    <span class="txt" id="mddTxt"></span>
    <span class="icon">📢</span>
  </div>
  <div class="bottom-bar">
    <div class="upcoming-panel">
      <div class="upcoming-hdr">📋 Komende wedstrijden</div>
      <div class="upcoming-body" id="sidebarBody"></div>
    </div>
    <div class="sponsor-panel" id="sponsorPanel">
      <div class="sponsor-track" id="sponsorTrack"></div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════
const SB_URL = 'https://ctxurzqtglckairgbjno.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0eHVyenF0Z2xja2Fpcmdiam5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzExNjYsImV4cCI6MjA5NDcwNzE2Nn0.Ty3nNEyNfZVebxqXRS5RALM7JA5AdghIYAS6VjfFITQ';
const HDR = { 'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}` };
const sbGet = async (t,q='') => { const r = await fetch(`${SB_URL}/rest/v1/${t}?${q}`,{headers:HDR}); if(!r.ok) throw new Error(await r.text()); return r.json(); };

// Escaped invoegen van tekst uit de database in innerHTML — voorkomt dat een
// speler- of teamnaam met HTML/JS erin als script wordt uitgevoerd.
function escapeHtml(str){
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

const MATCH_REFRESH_MS = 20000;   // wedstrijden + tijdsloten
const MDD_REFRESH_MS   = 30000;   // mededeling bovenaan

// ══════════════════════════════════════════
//  SPONSORS
//  Vul hier de sponsors in — naam verplicht, logo optioneel.
//  Met logo: zet het plaatje ergens online (bijv. in dit GitHub-repo, map "sponsors/")
//  en verwijs naar het pad, bijv. logo:"sponsors/kaalebull-slager.png"
//  Zonder logo (logo:'') wordt gewoon de naam getoond.
// ══════════════════════════════════════════
const SPONSORS = [
  { naam:'Sportcafé Duyf',              logo:'sponsors/duyf.png' },
  { naam:'Jonas Tweewielers Maasdam',   logo:'sponsors/jonas.svg' },
  { naam:'Bouwer Installatie',         logo:'sponsors/bouwer.svg' },
  { naam:'Ademar',                      logo:'sponsors/ademar.png' },
  { naam:'Scents',                      logo:'sponsors/scents.svg' },
  { naam:'Boerboom',                    logo:'sponsors/boerboom.svg' },
  { naam:'Magic Darts',                 logo:'sponsors/magic-darts.png' },
  { naam:'Nonstop Printing',            logo:'sponsors/Nonstop.svg' },
  { naam:'Corvers & Van Veldhoven',     logo:'sponsors/corvers.png' },
  { naam:'MR Solutions',                logo:'sponsors/mr-solutions.png' },
];
const SPONSOR_SNELHEID_PX_PER_SEC = 90; // hoger = sneller scrollen
const CODE_REFRESH_MS  = 10000;   // dartconnect koppelcodes (alleen een GEWIJZIGD bord wordt opnieuw geladen)


let dartCodes = {1:'',2:'',3:'',4:''};

// Opgeslagen waarde → volledige DartConnect-URL.
//  "live/5ypi9/L/KaalBHC/22804"  → bord-weergave (volgt de tablet, blijft de hele avond geldig)
//  "BYPUA/M/kaalebullsingles"    → oud: TV-scoreboard van één wedstrijd
function dcUrl(code){
  if (!code) return '';
  code = String(code).replace(/["'<>\s]/g,'');
  return /^live\//i.test(code)
    ? `https://tv.dartconnect.com/${code}`
    : `https://tv.dartconnect.com/tvscoreboard/${code}`;
}
function dcIsLive(code){ return /^live\//i.test(code||''); }


// Vaste 'binnenmaat' waarop DartConnect altijd rendert (ruim genoeg zodat het nooit intern hoeft te scrollen).
// Wordt daarna automatisch teruggeschaald ('cover') naar de werkelijke tegelgrootte.
const NATIVE_W = 1600, NATIVE_H = 900;
let baseScale = {1:1,2:1,3:1,4:1};

// ══════════════════════════════════════════
//  KLOK + DATUM
// ══════════════════════════════════════════
function updateClock(){
  const n = new Date();
  document.getElementById('clock').textContent =
    String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}
setInterval(updateClock, 1000); updateClock();

function vandaagStr(){ return new Date().toISOString().slice(0,10); }
(function zetDatum(){
  const d = new Date();
  const dagen = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
  document.getElementById('datumLbl').textContent =
    `${dagen[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
})();

// ══════════════════════════════════════════
//  FULLSCREEN
// ══════════════════════════════════════════
function toggleFullscreen(){
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen();
  }
}
document.addEventListener('fullscreenchange', ()=>{
  document.getElementById('fsBtn').style.display = document.fullscreenElement ? 'none' : 'flex';
});

// ══════════════════════════════════════════
//  DARTCONNECT BORDEN (2x2 grid, links)
// ══════════════════════════════════════════
function calGet(key, def){ const v = parseFloat(localStorage.getItem(key)); return isNaN(v) ? def : v; }
function calSchaal(b){ return calGet(`tv_dc_schaal_${b}`, 1); }
function calOffX(b){ return calGet(`tv_dc_offx_${b}`, 0); }
function calOffY(b){ return calGet(`tv_dc_offy_${b}`, 0); }

// BELANGRIJK: een DartConnect-scoreboard volgt de tablet naar volgende wedstrijden zolang de pagina
// NIET opnieuw geladen wordt. Een herlaad met een oude code geeft "Something went wrong".
// Daarom wordt een bordvak alleen opnieuw opgebouwd als de code van DAT bord verandert.
function bouwTegel(b, code){
  const tile = document.createElement('div');
  tile.className = 'board-tile';
  tile.dataset.bord = b;
  tile.dataset.code = code || '';
  tile.innerHTML = `
      <div class="board-tile-hdr">
        <span class="num">🎯 BORD ${b}</span>
        <div class="board-tile-ctrl">
          ${code ? `<button class="tile-btn" title="kalibreren" onclick="toggleCalib(${b})">⚙</button>` : ''}
        </div>
      </div>
      ${code
        ? `<div class="dc-viewport" id="dcView${b}" data-bord="${b}">
             <iframe id="dcFrame${b}" src="${dcUrl(code)}"></iframe>
           </div>
           <div class="calib-panel" id="calib${b}">
             <div class="calib-grp"><span>zoom</span>
               <button class="calib-btn" onclick="calZet(${b},'schaal',-0.05)">−</button>
               <button class="calib-btn" onclick="calZet(${b},'schaal',0.05)">+</button>
             </div>
             <div class="calib-grp"><span>positie</span>
               <button class="calib-btn" onclick="calZet(${b},'offy',-20)">↑</button>
               <button class="calib-btn" onclick="calZet(${b},'offy',20)">↓</button>
               <button class="calib-btn" onclick="calZet(${b},'offx',-20)">←</button>
               <button class="calib-btn" onclick="calZet(${b},'offx',20)">→</button>
             </div>
             <button class="calib-reset" onclick="calReset(${b})">reset</button>
           </div>`
        : (SPONSORS.length
            ? `<div class="spot" data-bord="${b}">
                 <div class="spot-glans"></div>
                 <div class="spot-voet">Bord ${b} — koppeling volgt</div>
               </div>`
            : `<div class="board-empty"><span class="icon">📴</span><span class="txt">Bord ${b} — koppeling volgt</span></div>`)
      }`;
  return tile;
}
function renderBoards(){
  const wrap = document.getElementById('boardsWrap');
  for (let b=1; b<=4; b++){
    const code = dartCodes[b] || '';
    const oud = wrap.querySelector(`.board-tile[data-bord="${b}"]`);
    if (oud && oud.dataset.code === code) continue;          // ongewijzigd: NIET aanraken
    const oudeView = oud && oud.querySelector('.dc-viewport');
    if (oudeView) boardResizeObserver.unobserve(oudeView);
    const tile = bouwTegel(b, code);
    if (oud) spotLaatLos(oud.querySelector('.spot'));         // logo van een leeg vak terug in de balk
    if (oud) wrap.replaceChild(tile, oud);
    else {
      // op de juiste plek (volgorde 1..4) invoegen
      const volgende = [...wrap.children].find(t => +t.dataset.bord > b);
      wrap.insertBefore(tile, volgende || null);
    }
    if (code) {
      const viewport = document.getElementById(`dcView${b}`);
      if (viewport) boardResizeObserver.observe(viewport);
      toepassenCalib(b);
    } else {
      startSpotlight(tile.querySelector('.spot'));
    }
  }
}

// ══════════════════════════════════════════
//  SPONSOR IN DE SPOTLIGHT
//  Een leeg bordvak toont een willekeurige sponsor, wisselt ca. elke minuut.
//  Staan er meerdere borden leeg, dan krijgt elk vak een andere sponsor.
//  Raakt alleen lege vakken aan — gekoppelde DartConnect-borden blijven ongemoeid.
// ══════════════════════════════════════════
const SPOT_DUUR_MS  = 60000;   // hoe lang een logo groot in beeld staat
const SPOT_VLIEG_MS = 1300;    // duur van de vlucht balk <-> groot vak
let spotStapel = [];
const spotInGebruik = new Set();   // sponsors die nu groot staan (hun plek in de balk is leeg)

function spotSchud(){
  spotStapel = SPONSORS.map((_,i)=>i);
  for (let i = spotStapel.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [spotStapel[i], spotStapel[j]] = [spotStapel[j], spotStapel[i]];
  }
}
// Kaartjes in de logobalk van een sponsor (2 stuks: de balk staat er dubbel in voor de naadloze scroll)
function balkItems(idx){ return [...document.querySelectorAll(`#sponsorTrack .sponsor-item[data-idx="${idx}"]`)]; }
function zichtbaarItem(idx){
  const w = window.innerWidth;
  return balkItems(idx).find(el=>{ const r = el.getBoundingClientRect(); return r.width && r.left >= 0 && r.right <= w; }) || null;
}
// Kies (willekeurig, iedereen eerst één keer) een sponsor die nu volledig zichtbaar in de balk staat
function spotKies(){
  for (let ronde = 0; ronde < 2; ronde++){
    if (!spotStapel.length) spotSchud();
    const kandidaat = spotStapel.find(i => !spotInGebruik.has(i) && SPONSORS[i].logo && zichtbaarItem(i));
    if (kandidaat !== undefined){ spotStapel.splice(spotStapel.indexOf(kandidaat),1); return kandidaat; }
    spotSchud();
  }
  // niemand zichtbaar (zou zelden gebeuren): pak gewoon iemand die vrij is
  const vrij = SPONSORS.map((_,i)=>i).filter(i=>!spotInGebruik.has(i));
  return vrij.length ? vrij[Math.floor(Math.random()*vrij.length)] : 0;
}
function balkGat(idx, aan){ balkItems(idx).forEach(el=>el.classList.toggle('weg', aan)); }

// Laat een kopie van het logo vliegen van rect A naar rect B. Beide zijn functies, zodat een
// bewegend doel (de scrollende balk) frame voor frame gevolgd wordt.
function vlieg(src, vanFn, naarFn, duur, klaar){
  const kloon = document.createElement('img');
  kloon.src = src; kloon.className = 'vlieg-logo';
  document.body.appendChild(kloon);
  const ease = t => t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;   // easeInOutCubic
  const t0 = performance.now();
  (function stap(nu){
    const t = Math.min(1, (nu - t0) / duur), e = ease(t);
    const a = vanFn(), b = naarFn();
    const x = a.left + (b.left - a.left)*e, y = a.top + (b.top - a.top)*e;
    const w = a.width + (b.width - a.width)*e, h = a.height + (b.height - a.height)*e;
    const boog = Math.sin(Math.PI*t) * 0.06;                         // lichte 'pop' halverwege
    kloon.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:scale(${1+boog});`;
    if (t < 1) requestAnimationFrame(stap);
    else { klaar && klaar(); kloon.remove(); }
  })(t0);
}
// Rechthoek van het logo binnen een kaartje/vak, berekend uit de echte beeldverhouding
function logoRect(img){
  const r = img.getBoundingClientRect();
  const nw = img.naturalWidth || r.width, nh = img.naturalHeight || r.height;
  const s = Math.min(r.width / nw, r.height / nh);
  const w = nw*s, h = nh*s;
  return { left: r.left + (r.width-w)/2, top: r.top + (r.height-h)/2, width: w, height: h };
}
// Waar 'terug in de balk' heen moet als het gat net buiten beeld is: de rechterrand van de balk
function balkInstap(){
  const p = document.getElementById('sponsorPanel').getBoundingClientRect();
  return { left: p.right - 60, top: p.top + p.height/2 - 26, width: 120, height: 52 };
}

// Groot logo terug de balk in
function spotTerug(spot){
  const slide = spot.querySelector('.spot-slide');
  if (!slide) return;
  const idx = +spot.dataset.idx;
  const img = slide.querySelector('img');
  delete spot.dataset.idx;
  if (!img || isNaN(idx)){ slide.remove(); return; }
  const van = logoRect(img);
  slide.remove();
  const naar = () => { const el = zichtbaarItem(idx); return el ? logoRect(el.querySelector('img')) : balkInstap(); };
  vlieg(img.src, ()=>van, naar, SPOT_VLIEG_MS, ()=>{ balkGat(idx, false); spotInGebruik.delete(idx); });
}

// Volgend logo uit de balk naar het grote vak
function spotUit(spot){
  const idx = spotKies();
  const s = SPONSORS[idx];
  spotInGebruik.add(idx);
  spot.dataset.idx = idx;

  const slide = document.createElement('div');
  slide.className = 'spot-slide';
  const img = document.createElement('img');
  img.alt = s.naam || '';
  slide.appendChild(img);
  spot.appendChild(slide);

  const bron = zichtbaarItem(idx);
  const toon = ()=>{
    slide.classList.add('in');
    const glans = spot.querySelector('.spot-glans');
    if (glans){ glans.classList.remove('flits'); void glans.offsetWidth; glans.classList.add('flits'); }
  };
  img.onload = ()=>{
    if (!document.body.contains(spot)) return;
    if (!bron){ balkGat(idx, true); toon(); return; }     // geen zichtbaar kaartje: gewoon infaden
    const van = logoRect(bron.querySelector('img'));
    balkGat(idx, true);                                    // gat in de balk (blijft meeschuiven)
    vlieg(img.src, ()=>van, ()=>logoRect(img), SPOT_VLIEG_MS, toon);
  };
  img.onerror = ()=>{ slide.innerHTML = `<div class="naam">${escapeHtml(s.naam||'')}</div>`; balkGat(idx, true); toon(); };
  img.src = s.logo;
}

function spotWissel(spot){
  if (!spot || !document.body.contains(spot)) return false;
  spotTerug(spot);
  setTimeout(()=>{ if (document.body.contains(spot)) spotUit(spot); }, SPOT_VLIEG_MS * 0.55);
  return true;
}
// Een leeg vak wordt gekoppeld (of opnieuw opgebouwd): zijn logo terug in de balk zetten
function spotLaatLos(spot){
  if (!spot) return;
  const idx = +spot.dataset.idx;
  if (!isNaN(idx)){ balkGat(idx, false); spotInGebruik.delete(idx); }
}
function startSpotlight(spot){
  if (!spot) return;
  const b = +spot.dataset.bord || 1;
  // eerste keer: even wachten tot de logobalk is opgebouwd en loopt
  setTimeout(()=>{ if (document.body.contains(spot)) spotUit(spot); }, 1500 + (b-1)*400);
  // per bord iets verschoven, zodat niet alle lege vakken tegelijk wisselen
  setTimeout(function volgende(){
    if (!spotWissel(spot)) return;               // vak is intussen gekoppeld → stoppen
    setTimeout(volgende, SPOT_DUUR_MS);
  }, SPOT_DUUR_MS + (b-1) * 7000);
}

// Meet elke bord-tegel en bereken de 'cover'-schaal zodat het native 1600x900-canvas
// altijd de hele tegel vult (zonder DartConnect intern te laten scrollen).
const boardResizeObserver = new ResizeObserver(entries=>{
  for (const entry of entries){
    const b = entry.target.dataset.bord;
    const { width, height } = entry.contentRect;
    if (width > 0 && height > 0){
      baseScale[b] = Math.max(width / NATIVE_W, height / NATIVE_H);
      toepassenCalib(b);
    }
  }
});

function toepassenCalib(b){
  const iframe = document.getElementById(`dcFrame${b}`);
  if (!iframe) return;
  const totaalSchaal = (baseScale[b]||1) * calSchaal(b);
  iframe.style.transform = `scale(${totaalSchaal}) translate(${-calOffX(b)}px,${-calOffY(b)}px)`;
}
function calZet(b, wat, delta){
  const map = {schaal:`tv_dc_schaal_${b}`, offx:`tv_dc_offx_${b}`, offy:`tv_dc_offy_${b}`};
  const key = map[wat];
  let v = wat==='schaal' ? calSchaal(b) : (wat==='offx' ? calOffX(b) : calOffY(b));
  v = Math.round((v+delta)*100)/100;
  if (wat==='schaal') v = Math.max(0.2, Math.min(3, v));
  localStorage.setItem(key, v);
  toepassenCalib(b);
}
function calReset(b){
  localStorage.removeItem(`tv_dc_schaal_${b}`);
  localStorage.removeItem(`tv_dc_offx_${b}`);
  localStorage.removeItem(`tv_dc_offy_${b}`);
  toepassenCalib(b);
}
function toggleCalib(b){
  document.getElementById(`calib${b}`).classList.toggle('open');
}
async function laadDartCodes(){
  try{
    const rows = await sbGet('instellingen','sleutel=like.dartconnect_bord_*');
    const nieuw = {1:'',2:'',3:'',4:''};
    rows.forEach(r=>{
      const b = r.sleutel.replace('dartconnect_bord_','');
      if (nieuw.hasOwnProperty(b)) nieuw[b] = r.waarde || '';
    });
    const gewijzigd = JSON.stringify(nieuw) !== JSON.stringify(dartCodes);
    dartCodes = nieuw;
    if (gewijzigd) renderBoards();
    setSync(true);
  }catch(e){ setSync(false); }
}

function setSync(ok){
  document.getElementById('syncDot').className = 'sync-dot ' + (ok ? 'ok' : 'error');
}

// ══════════════════════════════════════════
//  KOMENDE WEDSTRIJDEN (rechts, 2 tijdsloten)
// ══════════════════════════════════════════
function getDivKey(m){
  const d=(m.divisie||'').toLowerCase();
  if(m.is_inhaal) return 'inhaal';
  if(d.includes('ere')) return 'ere';
  if(d.includes('eerste')||d.includes('1e')) return 'eerste';
  if(d.includes('beker')) return 'beker';
  return 'general';
}
function divChip(m){
  const k=getDivKey(m);
  const labels={ere:'Ere',eerste:'1e Div',beker:'Beker',inhaal:'Inhaal',general:'Div'};
  return `<span class="div-chip ${k}">${escapeHtml(labels[k]||m.divisie||'')}</span>`;
}

async function laadKomendeWedstrijden(){
  try{
    const vandaag = vandaagStr();
    // Alleen wedstrijden die nog NIET op een bord staan (bord is null) — zodra iemand
    // een wedstrijd in het dashboard op een bord zet, verdwijnt 'ie hier direct uit de lijst.
    const rows = await sbGet('wedstrijden',
      `datum=eq.${vandaag}&status=neq.gespeeld&bord=is.null&tijdstip=not.is.null&order=tijdstip.asc`);
    renderSidebar(rows);
    setSync(true);
  }catch(e){
    setSync(false);
  }
}

function renderSidebar(rows){
  const body = document.getElementById('sidebarBody');
  if (!rows.length){
    body.innerHTML = `<div class="empty-msg"><span class="icon">🌙</span>Geen openstaande wedstrijden voor vandaag.</div>`;
    return;
  }
  // Groepeer op tijdstip, pak de eerstvolgende 2 unieke tijdsloten
  const perTijd = {};
  rows.forEach(w=>{
    const t = w.tijdstip || '--:--';
    (perTijd[t] = perTijd[t] || []).push(w);
  });
  const tijden = Object.keys(perTijd).sort();
  // Wedstrijden die al op een bord staan zijn al uit 'rows' gefilterd (zie laadKomendeWedstrijden).
  // Toon simpelweg het eerstvolgende tijdstip van wat er nog open staat.
  const volgende = tijden.slice(0, 1);

  if (!volgende.length){
    body.innerHTML = `<div class="empty-msg"><span class="icon">🌙</span>Geen wedstrijden meer na de huidige ronde.</div>`;
    return;
  }

  const blokken = volgende.map((t)=>{
    const matches = perTijd[t];
    const pills = matches.map(w=>`
      <div class="match-pill">
        ${divChip(w)}
        <span class="teams">${escapeHtml(w.thuis||'?')}<span class="vs">vs</span>${escapeHtml(w.uit||'?')}</span>
      </div>`).join('');
    return `<div class="slot-block">
        <div class="slot-hdr"><span class="tijd">${t}</span><span class="tag">eerstvolgend</span></div>
        <div class="slot-list">${pills}</div>
      </div>`;
  }).join('');
  body.innerHTML = `<div class="slot-columns">${blokken}</div>`;
  pasNamenIn(body);
}

// Lange namen (bv. "Marieke van der Waal vs Rianne van der Heiden") passend maken door
// alleen dát kaartje iets kleiner te zetten, tot minimaal 65% van de normale grootte.
function pasNamenIn(root){
  requestAnimationFrame(()=>{
    // Past het blok niet in de hoogte (mededeling actief of 5+ wedstrijden)? Dan alles
    // in stapjes iets kleiner, tot minimaal 70%.
    const panel = root.closest('.upcoming-panel');
    let k = 1; panel.style.setProperty('--k', k);
    while (root.scrollHeight > root.clientHeight + 1 && k > 0.7){
      k = Math.round((k - 0.05)*100)/100; panel.style.setProperty('--k', k);
    }
    root.querySelectorAll('.match-pill .teams').forEach(el=>{
      el.style.fontSize = '';
      const basis = parseFloat(getComputedStyle(el).fontSize);
      let f = basis;
      while (el.scrollWidth > el.clientWidth + 1 && f > basis * 0.65){
        f -= 1; el.style.fontSize = f + 'px';
      }
    });
  });
}
window.addEventListener('resize', ()=>pasNamenIn(document.getElementById('sidebarBody')));

// ══════════════════════════════════════════
//  MEDEDELING (bovenaan, ingesteld vanuit index.html)
// ══════════════════════════════════════════
async function laadMededeling(){
  try{
    const rows = await sbGet('instellingen','sleutel=in.(tv_mededeling_tekst,tv_mededeling_actief)');
    const tekst = rows.find(r=>r.sleutel==='tv_mededeling_tekst')?.waarde || '';
    const actief = rows.find(r=>r.sleutel==='tv_mededeling_actief')?.waarde === 'true';
    const banner = document.getElementById('mddBanner');
    const wasZichtbaar = banner.classList.contains('show');
    if (actief && tekst){
      document.getElementById('mddTxt').textContent = tekst;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
    if (wasZichtbaar !== banner.classList.contains('show')) pasNamenIn(document.getElementById('sidebarBody'));
  }catch(e){ /* stille fout — sync-dot toont algemene verbindingsstatus al */ }
}

// ══════════════════════════════════════════
//  SPONSORBAND (doorlopend, naadloos)
// ══════════════════════════════════════════
function renderSponsors(){
  const panel = document.getElementById('sponsorPanel');
  const track = document.getElementById('sponsorTrack');
  if (!SPONSORS.length){ panel.style.display = 'none'; return; }

  const itemHtml = (s,i) => s.logo
    ? `<span class="sponsor-item" data-idx="${i}"><img src="${s.logo}" alt="${s.naam||''}"></span>`
    : `<span class="sponsor-item sponsor-naam" data-idx="${i}">${s.naam}</span>`;

  const eenmaal = SPONSORS.map(itemHtml).join('');
  // Inhoud dubbel plaatsen zodat de scroll naadloos kan lussen (kopie 2 staat exact 1x
  // de breedte van kopie 1 verderop, en na het scrollen van precies die afstand
  // ziet het er weer identiek uit aan het begin — geen zichtbare sprong).
  track.innerHTML = eenmaal + eenmaal;

  // Pas meten als alle logo's geladen zijn: de breedte hangt nu af van het logo zelf.
  const imgs = Array.from(track.querySelectorAll('img'));
  Promise.all(imgs.map(img => img.complete ? null :
    new Promise(res => { img.onload = img.onerror = res; })))
  .then(() => requestAnimationFrame(()=>{
    // Meet de breedte van precies 1 kopie (= gap + breedte van alle sponsor-items samen)
    const gap = 70; // moet gelijk zijn aan de 'gap' in .sponsor-track CSS
    const kinderen = Array.from(track.children);
    const helft = kinderen.length / 2;
    let eenKopieBreedte = 0;
    for (let i = 0; i < helft; i++){
      eenKopieBreedte += kinderen[i].getBoundingClientRect().width + gap;
    }
    track.style.setProperty('--scroll-dist', `${eenKopieBreedte}px`);

    const duur = Math.max(8, eenKopieBreedte / SPONSOR_SNELHEID_PX_PER_SEC);
    track.style.animationDuration = `${duur}s`;
  }));
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
async function initAll(){
  renderSponsors();
  renderBoards();          // tegels direct tonen, ook als er nog geen codes zijn
  await laadDartCodes();
  await laadKomendeWedstrijden();
  await laadMededeling();
}
initAll();
setInterval(laadDartCodes, CODE_REFRESH_MS);
setInterval(laadKomendeWedstrijden, MATCH_REFRESH_MS);
setInterval(laadMededeling, MDD_REFRESH_MS);
</script>
