<script>
/**
 * NIEUWE PLANNING LOGICA
 * Criteria: 
 * 1. 1e Divisie: 4 periodes (1-10, 11-20, 21-30, 31-40) evenredig verdeeld.
 * 2. Ere Divisie: 1e helft (1-20) klaar op de helft van de avonden.
 * 3. Max 32 wedstrijden per avond.
 * 4. Geen speler > 2 wedstrijden per avond.
 */

async function ptVerdeelEnDownload() {
    // Haal instellingen op
    const totaalAvonden = parseInt(document.getElementById('pt-avonden').value) || 27;
    const maxPerAvond = parseInt(document.getElementById('pt-slot-count').value) || 32;
    const csvData = window.ptWedstrijden || []; 

    if (csvData.length === 0) {
        alert("Geen wedstrijden gevonden. Laad eerst je CSV!");
        return;
    }

    // 1. Sorteren in pools
    let pools = { Ere_H1:[], Ere_H2:[], Eerste_P1:[], Eerste_P2:[], Eerste_P3:[], Eerste_P4:[] };
    csvData.forEach(w => {
        if(w.divisie === 'Ere') {
            w.ronde <= 20 ? pools.Ere_H1.push(w) : pools.Ere_H2.push(w);
        } else {
            if(w.ronde <= 10) pools.Eerste_P1.push(w);
            else if(w.ronde <= 20) pools.Eerste_P2.push(w);
            else if(w.ronde <= 30) pools.Eerste_P3.push(w);
            else pools.Eerste_P4.push(w);
        }
    });

    // 2. Initialisatie planning
    let planning = Array.from({length: totaalAvonden}, () => []);
    let spelerLog = Array.from({length: totaalAvonden}, () => ({}));

    // Hulpfunctie: check limieten
    const magSpelen = (avondIdx, w) => {
        if (planning[avondIdx].length >= maxPerAvond) return false;
        let countA = spelerLog[avondIdx][w.teamA] || 0;
        let countB = spelerLog[avondIdx][w.teamB] || 0;
        return (countA < 2 && countB < 2);
    };

    // 3. Verdeel-algoritme (Evenredig per categorie)
    const categorieen = ['Ere_H1', 'Ere_H2', 'Eerste_P1', 'Eerste_P2', 'Eerste_P3', 'Eerste_P4'];
    
    // Verdeel per categorie om een goede mix te krijgen
    categorieen.forEach(cat => {
        pools[cat].forEach(w => {
            let geplaatst = false;
            // Zoek een avond, start bij de eerste avond
            for(let i = 0; i < totaalAvonden; i++) {
                if (magSpelen(i, w)) {
                    planning[i].push(w);
                    spelerLog[i][w.teamA] = (spelerLog[i][w.teamA] || 0) + 1;
                    spelerLog[i][w.teamB] = (spelerLog[i][w.teamB] || 0) + 1;
                    geplaatst = true;
                    break;
                }
            }
        });
    });

    // 4. Resultaat tonen
    console.log("Planning gegenereerd over " + totaalAvonden + " avonden:", planning);
    alert("Planning is berekend! Check de console voor details. (Functionaliteit voor download volgt hier)");
    
    // Optioneel: render een tabel in een div met ID 'pt-output'
}

// ... (Rest van je bestaande functies zoals laadData, etc.) ...
</script>
