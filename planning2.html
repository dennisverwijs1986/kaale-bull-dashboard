<body>
<script>
/**
 * GEÏNTEGREERDE PLANNING LOGICA
 * Criteria verwerkt:
 * 1. 1e Div: 4 periodes evenredig over 27 avonden.
 * 2. Ere Div: 1e helft op de helft van de tijd.
 * 3. Max 32 wedstrijden per avond.
 * 4. Max 2 wedstrijden per speler per avond.
 */

async function ptVerdeelEnDownload() {
    // Data ophalen uit het systeem (aanname: window.ptWedstrijden is gevuld via je CSV import)
    const csvData = window.ptWedstrijden || [];
    const totaalAvonden = parseInt(document.getElementById('pt-avonden').value) || 27;
    const maxPerAvond = parseInt(document.getElementById('pt-slot-count').value) || 32;

    if (csvData.length === 0) {
        alert("Geen wedstrijden geladen. Importeer eerst een CSV!");
        return;
    }

    // 1. Sorteren in pools (Categorisering)
    let pools = { Ere_H1:[], Ere_H2:[], Eerste_P1:[], Eerste_P2:[], Eerste_P3:[], Eerste_P4:[] };
    csvData.forEach(w => {
        if(w.divisie === 'Ere') {
            w.ronde <= 20 ? pools.Ere_H1.push(w) : pools.Ere_H2.push(w);
        } else {
            if(w.ronde <= 10) pools.Eerste_P1.push(w);
            else if(w.ronde <= 20) pools.Eerste_P2.push(w);
            else if(w.ronde <= 30) pools.Eerste_P3.push(w);
            else pools.Eerste_P4.push(w);
        }
    });

    // 2. Planning initialiseren
    let planning = Array.from({length: totaalAvonden}, () => []);
    let spelerLog = Array.from({length: totaalAvonden}, () => ({}));

    // 3. Verdeel-algoritme
    const categorieen = ['Ere_H1', 'Ere_H2', 'Eerste_P1', 'Eerste_P2', 'Eerste_P3', 'Eerste_P4'];
    
    categorieen.forEach(cat => {
        pools[cat].forEach(w => {
            let geplaatst = false;
            // Zoek een avond waar nog plek is en de spelerslimiet niet wordt overschreden
            for(let i = 0; i < totaalAvonden; i++) {
                let countA = spelerLog[i][w.teamA] || 0;
                let countB = spelerLog[i][w.teamB] || 0;
                
                if (planning[i].length < maxPerAvond && countA < 2 && countB < 2) {
                    planning[i].push(w);
                    spelerLog[i][w.teamA] = countA + 1;
                    spelerLog[i][w.teamB] = countB + 1;
                    geplaatst = true;
                    break;
                }
            }
        });
    });

    console.log("Nieuwe planning gegenereerd:", planning);
    alert("Planning is succesvol herberekend volgens de nieuwe criteria.");
    
    // Hier kun je je CSV download-logica aanroepen
    // downloadCSV(planning);
}

</script>
