<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kaale Bull — Speelschema</title>
<meta name="description" content="Het actuele speelschema van dartsclub De Kaale Bull.">
<meta name="theme-color" content="#0f1520">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/favicon-48.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speelschema">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{
  --bg:#0f1520; --s1:#161f30; --s2:#1e2a40; --s3:#243350; --border:#2a3a56;
  --text:#f1f5f9; --muted:#94a3b8; --dim:#64748b;
  --green:#10b981; --red:#ef4444; --orange:#f59e0b; --cyan:#06b6d4;
  --ere:#a855f7; --eerste:#3b82f6; --beker:#f59e0b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);font-size:16px;line-height:1.35;
  min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
button,select,input{font-family:inherit;font-size:inherit;color:inherit;}

/* ── KOP ── */
.kop{
  position:sticky;top:0;z-index:20;background:var(--s1);border-bottom:1px solid var(--border);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.kop-rij{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.logo{font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px;}
.logo small{display:block;font-weight:400;font-size:.75rem;color:var(--muted);}
.sync{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);white-space:nowrap;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);}
.dot.ok{background:var(--green);box-shadow:0 0 6px var(--green);}
.dot.fout{background:var(--red);}

/* ── MENU ONDERIN ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--s1);border-top:1px solid var(--border);
  display:flex;justify-content:center;padding:4px 4px calc(4px + env(safe-area-inset-bottom));}
.nav-in{display:flex;width:100%;max-width:640px;}
.nav button{flex:1;border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:.7rem;font-weight:600;padding:7px 0 5px;cursor:pointer;position:relative;}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.nav button.actief{color:#93c5fd;}
.nav .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--green);
  color:#052e1f;font-size:.66rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;}

/* ── LIVE BORDEN ── */
.live-intro{color:var(--muted);font-size:.85rem;margin:2px 0 12px;}
.bordkaart{display:block;width:100%;text-align:left;background:var(--s1);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;margin-bottom:10px;cursor:default;}
.bordkaart.live{border-color:rgba(16,185,129,.55);background:rgba(16,185,129,.07);cursor:pointer;}
.bk-kop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.bk-nr{font-weight:800;font-size:1rem;}
.bk-status{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-radius:6px;padding:3px 7px;}
.bk-status.live{background:var(--green);color:#052e1f;display:inline-flex;align-items:center;gap:5px;}
.bk-status.live::before{content:'';width:6px;height:6px;border-radius:50%;background:#052e1f;animation:puls 1.4s infinite;}
.bk-status.wacht{background:var(--s3);color:var(--muted);}
.bk-status.vrij{background:var(--s2);color:var(--dim);}
.bk-namen{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere;}
.bk-namen .vs{color:var(--dim);font-weight:400;font-size:.8rem;margin:0 6px;}
.bk-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;font-size:.8rem;color:var(--muted);}
.bk-actie{margin-top:8px;font-size:.82rem;font-weight:700;color:#6ee7b7;}
.bk-leeg{color:var(--dim);font-size:.9rem;}
a.bordkaart{color:inherit;text-decoration:none;}
.dc-knop{display:block;text-align:center;background:var(--eerste);color:#fff;text-decoration:none;font-weight:800;border-radius:10px;padding:11px;margin:0 0 12px;}
button.bord{border:0;cursor:pointer;font-family:inherit;}

/* ── SCOREBORD (volledig scherm) ── */
.scorebord{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;}
.sb-kop{display:flex;align-items:center;gap:10px;background:var(--s1);border-bottom:1px solid var(--border);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;}
.sb-terug{border:0;background:var(--s2);border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;}
.sb-titel{flex:1;min-width:0;font-size:.85rem;line-height:1.25;}
.sb-titel b{display:block;font-size:.95rem;}
.sb-titel span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.sb-ext{color:#93c5fd;font-size:.78rem;text-decoration:none;white-space:nowrap;}
.sb-vak{flex:1;position:relative;overflow:hidden;}
.sb-vak iframe{position:absolute;top:0;left:0;width:1600px;height:900px;border:0;transform-origin:0 0;background:#000;}
.sb-melding{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;color:var(--muted);padding:24px;gap:6px;}
.sb-tip{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);}
@media (orientation:landscape){ .sb-tip{display:none;} }

main{padding:12px 16px;max-width:640px;margin:0 auto;}

/* ── MEDEDELING ── */
.mededeling{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);color:#fde68a;
  border-radius:10px;padding:10px 12px;font-size:.9rem;margin-bottom:12px;white-space:pre-line;}

/* ── AVONDKEUZE ── */
.avonden{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none;}
.avonden::-webkit-scrollbar{display:none;}
.avond{flex:0 0 auto;border:1px solid var(--border);background:var(--s1);border-radius:10px;
  padding:7px 12px;text-align:center;cursor:pointer;min-width:66px;}
.avond b{display:block;font-size:.95rem;}
.avond span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.avond.actief{background:var(--eerste);border-color:var(--eerste);}
.avond.actief span{color:#dbeafe;}
.avond.vandaag:not(.actief){border-color:var(--green);}

.avond-titel{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:6px 0 10px;}
.avond-titel h2{margin:0;font-size:1.15rem;}
.avond-titel .teller{font-size:.8rem;color:var(--muted);}

/* ── TIJDSLOT ── */
.slot{margin-bottom:14px;}
.slot-kop{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.slot-tijd{font-family:ui-monospace,monospace;font-weight:700;font-size:1.05rem;color:var(--orange);}
.label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:5px;padding:2px 6px;}
.label.volgend{background:rgba(245,158,11,.18);color:var(--orange);}
.label.klaar{background:var(--s2);color:var(--dim);}

/* ── WEDSTRIJDKAART ── */
.kaart{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--border);
  border-left:4px solid var(--dim);border-radius:10px;padding:10px 12px;margin-bottom:6px;}
.kaart.ere{border-left-color:var(--ere);}
.kaart.eerste{border-left-color:var(--eerste);}
.kaart.beker{border-left-color:var(--beker);}
.kaart.gespeeld{opacity:.5;}
.kaart.mijn{background:var(--s2);border-top-color:#3b5584;border-right-color:#3b5584;border-bottom-color:#3b5584;}
.kaart.opbord{border-top-color:rgba(16,185,129,.6);border-right-color:rgba(16,185,129,.6);border-bottom-color:rgba(16,185,129,.6);background:rgba(16,185,129,.08);}
.k-midden{flex:1;min-width:0;}
.k-namen{font-weight:600;font-size:.98rem;overflow-wrap:anywhere;}
.k-namen .vs{color:var(--dim);font-weight:400;font-size:.8rem;margin:0 6px;}
.k-namen .ik{color:#93c5fd;}
.k-info{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center;}
.chip{font-size:.68rem;font-weight:700;border-radius:5px;padding:2px 6px;}
.chip.ere{background:rgba(168,85,247,.2);color:#d8b4fe;}
.chip.eerste{background:rgba(59,130,246,.2);color:#93c5fd;}
.chip.beker{background:rgba(245,158,11,.2);color:#fcd34d;}
.chip.alg{background:var(--s3);color:var(--muted);}
.chip.inhaal{background:rgba(239,68,68,.15);color:#fca5a5;}
.k-rechts{flex:0 0 auto;text-align:right;font-size:.78rem;}
.bord{display:inline-flex;align-items:center;gap:5px;background:var(--green);color:#052e1f;
  font-weight:800;border-radius:7px;padding:4px 8px;font-size:.8rem;}
.bord::before{content:'';width:7px;height:7px;border-radius:50%;background:#052e1f;animation:puls 1.4s infinite;}
@keyframes puls{50%{opacity:.25;}}
.vink{color:var(--dim);font-weight:600;}

/* ── MIJN WEDSTRIJDEN ── */
.kiezer{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px;}
.kiezer label{display:block;font-weight:600;margin-bottom:8px;}
.kiezer select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px 10px;}
.kiezer p{color:var(--muted);font-size:.82rem;margin:10px 0 0;}
.ik-balk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.ik-balk h2{margin:0;font-size:1.15rem;}
.knop-klein{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:.8rem;cursor:pointer;}
.datumkop{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px;}
.datumkop.vandaag{color:var(--green);}
.kaart .tijd-groot{font-family:ui-monospace,monospace;font-weight:700;color:var(--orange);font-size:1rem;min-width:46px;}
.volgende-kaart{box-shadow:0 0 0 2px var(--orange);}
/* ── JOUW BEURT ── */
.beurt{border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;}
.beurt .ico{font-size:1.6rem;line-height:1;}
.beurt b{display:block;font-size:1.02rem;}
.beurt span{font-size:.82rem;opacity:.85;}
.beurt.nu{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.6);color:#a7f3d0;}
.beurt.klaar{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.55);color:#fde68a;}
.beurt.wacht{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.45);color:#bfdbfe;}
.beurt.later{background:var(--s1);border:1px solid var(--border);color:var(--text);}

/* ── AGENDA ── */
.agenda{background:var(--s1);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;}
.agenda summary{padding:11px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;}
.agenda summary::-webkit-details-marker{display:none;}
.agenda summary::after{content:'›';color:var(--muted);transition:transform .2s;}
.agenda[open] summary::after{transform:rotate(90deg);}
.agenda-in{padding:0 14px 14px;}
.agenda-knoppen{display:flex;gap:8px;margin:4px 0 10px;}
.agenda-knoppen a{flex:1;text-align:center;background:var(--eerste);color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;border-radius:8px;padding:10px 4px;}
.agenda-in p{margin:0;color:var(--muted);font-size:.8rem;line-height:1.5;}

/* ── STANDEN ── */
.seg{display:flex;gap:6px;background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:10px;}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 6px;font-weight:700;font-size:.85rem;color:var(--muted);cursor:pointer;}
.seg button.actief{background:var(--s3);color:var(--text);}
.periodes{display:flex;gap:6px;margin-bottom:10px;}
.periodes button{flex:1;border:1px solid var(--border);background:var(--s1);border-radius:9px;padding:6px 2px;cursor:pointer;}
.periodes button b{display:block;font-size:.85rem;}
.periodes button span{font-size:.62rem;color:var(--muted);}
.periodes button.actief{background:var(--eerste);border-color:var(--eerste);}
.periodes button.actief span{color:#dbeafe;}
table.stand{width:100%;border-collapse:collapse;font-size:.88rem;}
table.stand th{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:6px 6px;border-bottom:1px solid var(--border);}
table.stand td{padding:8px 6px;border-bottom:1px solid rgba(42,58,86,.6);}
table.stand .num{text-align:right;font-variant-numeric:tabular-nums;}
table.stand .pos{width:28px;color:var(--muted);font-weight:700;}
table.stand tr.leider td{color:#fcd34d;font-weight:700;}
table.stand tr.ik td{background:rgba(59,130,246,.14);}
table.stand tr.zone-po td.pos{color:var(--orange);}
table.stand tr.zone-po td{background:rgba(245,158,11,.06);}
table.stand tr.zone-deg td.pos{color:var(--red);}
table.stand tr.zone-deg td{background:rgba(239,68,68,.07);}
table.stand tr.streep td{border-top:2px solid var(--border);}
.zone-tag{font-size:.6rem;font-weight:800;text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;}
.zone-tag.po{background:rgba(245,158,11,.2);color:#fcd34d;}
.zone-tag.deg{background:rgba(239,68,68,.2);color:#fca5a5;}
.zone-tag.prom{background:rgba(16,185,129,.2);color:#6ee7b7;margin-left:0;}
.zone-tag.titel{background:rgba(245,197,24,.18);color:#fcd34d;}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
.tags .zone-tag{margin-left:0;}
.seg + .seg{margin-top:-4px;}
.stand-noot{color:var(--dim);font-size:.75rem;margin-top:10px;}

/* ── TESTVERSIE ── */
/* ── UITSLAGEN ── */
.score{font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap;}
.score b{color:#6ee7b7;}
.verslag{display:inline-block;margin-top:4px;color:#93c5fd;font-size:.75rem;font-weight:700;text-decoration:none;white-space:nowrap;}
.k-namen .winst{font-weight:800;}
.k-namen .verlies{color:var(--muted);font-weight:500;}
.kaart.gespeeld{opacity:.92;}
.avond.verleden:not(.actief){opacity:.65;}
.uitslagen{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:12px 12px 6px;margin:16px 0 12px;}
.uitslagen h3{margin:0 0 8px;font-size:1rem;}
.vorm{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);}
.vorm i{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:.72rem;}
.vorm i.w{background:rgba(16,185,129,.2);color:#6ee7b7;border:1px solid rgba(16,185,129,.5);}
.vorm i.v{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.45);}
.res{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid rgba(42,58,86,.6);font-size:.9rem;}
.res .rd{color:var(--muted);font-size:.75rem;min-width:46px;}
.res .rt{flex:1;min-width:0;overflow-wrap:anywhere;}
.res .rs{text-align:right;}
.res .wv{display:inline-block;width:20px;height:20px;border-radius:50%;text-align:center;line-height:20px;font-size:.66rem;font-weight:800;margin-right:4px;}
.res .wv.w{background:rgba(16,185,129,.2);color:#6ee7b7;}
.res .wv.v{background:rgba(239,68,68,.15);color:#fca5a5;}
.meer{width:100%;border:0;background:none;color:#93c5fd;font-weight:700;font-size:.82rem;padding:8px;cursor:pointer;}

/* ── BEKER ── */
.roadmap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.roadmap span{font-size:.72rem;font-weight:800;padding:4px 8px;border-radius:8px;background:var(--s1);border:1px solid var(--border);color:var(--dim);}
.roadmap span.klaar{border-color:rgba(16,185,129,.5);color:#6ee7b7;}
.roadmap span.bezig{border-color:rgba(245,158,11,.5);color:#fcd34d;}
.kampioen{background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.45);border-radius:12px;padding:10px 12px;margin-bottom:10px;color:#fde68a;font-weight:700;}
.bfase{margin-bottom:14px;}
.bfasen{overflow-x:auto;scrollbar-width:none;}
.bfasen::-webkit-scrollbar{display:none;}
.bfasen button{flex:0 0 auto;min-width:84px;}
.bgroep{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin:10px 0 6px;}
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:6px;font-size:.88rem;}
.duel.mijn{background:var(--s2);border-color:#3b5584;}
.duel .da{text-align:right;overflow-wrap:anywhere;}
.duel .db{text-align:left;overflow-wrap:anywhere;}
.duel .dm{text-align:center;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);min-width:48px;white-space:nowrap;}
.duel .dm .verslag{display:block;font-size:.68rem;margin-top:2px;}
.duel .winst{font-weight:800;color:var(--text);}
.duel .verlies{color:var(--muted);}
.duel .ik{color:#93c5fd;}
.bfase h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 6px;}
.bm{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--border);border-left:4px solid var(--beker);border-radius:10px;padding:9px 12px;margin-bottom:6px;}
.bm.mijn{background:var(--s2);}
.bm .bn{flex:1;min-width:0;font-size:.92rem;}
.bm .bn div{overflow-wrap:anywhere;}
.bm .bn .winst{font-weight:800;}
.bm .bn .verlies{color:var(--muted);}
.bm .bn .ik{color:#93c5fd;}
.bm .bs{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;}
.bm .bs small{display:block;font-weight:600;color:var(--dim);font-size:.7rem;}

/* ── SPONSORS & DELEN ── */
.sponsors{margin-top:22px;text-align:center;}
.sponsors h4{margin:0 0 10px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);}
.sp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.sp-grid div{background:var(--s1);border:1px solid var(--border);border-radius:10px;height:56px;display:flex;align-items:center;justify-content:center;padding:6px;}
.sp-grid img{max-width:100%;max-height:44px;object-fit:contain;}
.deel{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;background:#25d366;color:#052e16;border:0;border-radius:10px;padding:11px;font-weight:800;font-size:.9rem;cursor:pointer;}
.ik-knoppen{display:flex;gap:6px;}

.testbalk{background:#7c3aed;color:#fff;text-align:center;font-size:.75rem;font-weight:800;letter-spacing:.06em;padding:4px;}

.nnb-blok{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.45);border-radius:12px;padding:12px 12px 6px;margin-bottom:14px;}
.nnb-kop{font-weight:800;color:#fcd34d;margin-bottom:4px;}
.nnb-uitleg{font-size:.82rem;color:#fde68a;margin:0 0 10px;}
.nnb-label{display:inline-block;background:rgba(245,158,11,.2);color:#fcd34d;font-weight:800;border-radius:7px;padding:4px 8px;font-size:.75rem;}

.leeg{text-align:center;color:var(--muted);padding:36px 12px;}
.leeg .ico{font-size:2rem;display:block;margin-bottom:6px;}
.voet{color:var(--dim);font-size:.75rem;text-align:center;margin-top:18px;}

/* ── INSTALLEER-TIP ── */
.installeer{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:30;
  max-width:616px;margin:0 auto;background:var(--s3);border:1px solid #3b5584;border-radius:12px;
  padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:.88rem;}
.installeer .tekst{flex:1;}
.installeer .ja{background:var(--eerste);border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;}
.installeer .nee{background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:4px;}
[hidden]{display:none !important;}
</style>
</head>
<body>

<header class="kop">
  <div class="kop-rij">
    <div class="logo">🎯 <div>De Kaale Bull<small>Speelschema</small></div></div>
    <div class="sync"><span class="dot" id="dot"></span><span id="syncTekst">laden…</span></div>
  </div>
</header>

<main>
  <div class="mededeling" id="mededeling" hidden></div>
  <section id="viewAlles"></section>
  <section id="viewMijn" hidden></section>
  <section id="viewLive" hidden></section>
  <section id="viewStand" hidden></section>
  <div class="voet">Ververst automatisch · wijzigingen van de wedstrijdleiding zie je direct</div>
</main>

<nav class="nav" aria-label="Menu">
  <div class="nav-in">
    <button id="tabAlles" data-view="alles" class="actief">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Schema
    </button>
    <button id="tabMijn" data-view="mijn">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Mijn
    </button>
    <button id="tabLive" data-view="live">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Live borden
      <span class="badge" id="liveBadge" hidden></span>
    </button>
    <button id="tabStand" data-view="stand">
      <svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Standen
    </button>
  </div>
</nav>

<div class="scorebord" id="scorebord" hidden>
  <div class="sb-kop">
    <button class="sb-terug" id="sbTerug">‹ Terug</button>
    <div class="sb-titel" id="sbTitel"></div>
    <a class="sb-ext" id="sbExt" href="#" target="_blank" rel="noopener">DartConnect ↗</a>
  </div>
  <div class="sb-vak" id="sbVak"><iframe id="sbFrame" title="Live scorebord" allow="fullscreen"></iframe><div class="sb-melding" id="sbMelding" hidden></div></div>
  <div class="sb-tip">Draai je telefoon voor een groter scorebord</div>
</div>

<div class="installeer" id="installeer" hidden>
  <div class="tekst" id="installeerTekst"></div>
  <button class="ja" id="installeerJa" hidden>Installeer</button>
  <button class="nee" id="installeerNee" aria-label="Sluiten">✕</button>
</div>

<script>
// ══════════════════════════════════════════
//  CONFIG — alleen LEZEN uit Supabase, deze pagina wijzigt nooit iets
// ══════════════════════════════════════════
const SB_URL = 'https://ctxurzqtglckairgbjno.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0eHVyenF0Z2xja2Fpcmdiam5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzExNjYsImV4cCI6MjA5NDcwNzE2Nn0.Ty3nNEyNfZVebxqXRS5RALM7JA5AdghIYAS6VjfFITQ';
const HDR = { apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}` };
const sbGet = async (t,q='') => {
  const r = await fetch(`${SB_URL}/rest/v1/${t}?${q}`, { headers:HDR, cache:'no-store' });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
};
const REFRESH_MS = 20000;
const BYE = 'vrije ronde';

// ══════════════════════════════════════════
//  HULPJES
// ══════════════════════════════════════════
function esc(s){ return s==null ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function opslaan(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }
function lezen(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function isoLokaal(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function vandaag(){ return isoLokaal(new Date()); }
function alsDatum(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
const fmtKort = new Intl.DateTimeFormat('nl-NL',{weekday:'short'});
const fmtDag  = new Intl.DateTimeFormat('nl-NL',{day:'numeric',month:'short'});
const fmtLang = new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long'});
function divKey(w){
  const d=(w.divisie||'').toLowerCase();
  if (d.includes('ere')) return 'ere';
  if (d.includes('eerste')||d.includes('1e')) return 'eerste';
  if (d.includes('beker')) return 'beker';
  return 'alg';
}
function divLabel(w){
  const k=divKey(w);
  if (k==='ere') return 'Eredivisie';
  if (k==='eerste') return 'Eerste Divisie';
  return w.divisie || 'Wedstrijd';
}
function isBye(w){ return (w.thuis||'').toLowerCase()===BYE || (w.uit||'').toLowerCase()===BYE || !w.thuis || !w.uit; }

// Planning wordt pas zichtbaar na het kantelmoment (instelling planning_kantel_dag, standaard 24):
// vóór de 24e t/m eind volgende maand, vanaf de 24e t/m eind van de maand daarna.
function zichtbaarTot(kantel){
  const n=new Date();
  const extra = n.getDate() >= kantel ? 3 : 2;
  return isoLokaal(new Date(n.getFullYear(), n.getMonth()+extra, 0));
}

// ══════════════════════════════════════════
//  STAAT
// ══════════════════════════════════════════
const S = {
  rijen: [], byes: [], nnb: [], spelers: [],
  gekozenAvond: null,
  ik: null,
  view: 'mijn',
  kantel: 24,
  geladen: false,
  borden: {1:null,2:null,3:null,4:null},   // wedstrijd per bord
  codes:  {1:'',2:'',3:'',4:''},           // DartConnect-link per bord
  schrijvers: {1:'',2:'',3:'',4:''},
  openBord: null,                          // bord dat nu groot in beeld staat
  ikId: null, ikIdVoor: null,              // speler-id voor de agenda-links
  standDiv: 'ere', standPeriode: null, stand: null, standTijd: 0,
  offline: false, cacheTijd: null,
};
const BORDEN=[1,2,3,4];

// ?speler=Naam in de link → meteen de eigen planning (handig om persoonlijk te delen)
(function leesUrl(){
  const p=new URLSearchParams(location.search);
  const sp=p.get('speler');
  if (sp){ S.ik=sp.trim(); opslaan('kb_schema_ik', S.ik); S.view='mijn'; }
  else {
    S.ik = lezen('kb_schema_ik');
    // De app opent altijd op Mijn wedstrijden (met ?view=... in de link kan een ander tabblad)
    const v = p.get('view');
    S.view = (v==='alles' || v==='live' || v==='stand') ? v : 'mijn';
  }
})();

// ══════════════════════════════════════════
//  LADEN
// ══════════════════════════════════════════
let bezig=false;
async function laad(){
  if (bezig) return; bezig=true;
  try{
    const inst = await sbGet('instellingen','select=sleutel,waarde&sleutel=in.(planning_kantel_dag,app_mededeling_tekst,app_mededeling_actief)');
    const I = Object.fromEntries(inst.map(r=>[r.sleutel, r.waarde]));
    S.kantel = parseInt(I.planning_kantel_dag,10) || 24;
    const tot = zichtbaarTot(S.kantel);
    const velden='select=id,datum,tijdstip,divisie,thuis,uit,status,is_inhaal,originele_datum,bord,datum_nnb,uitslag,legs_thuis,legs_uit,verslag_url';
    const [rijen, nnb, bekerRij] = await Promise.all([
      sbGet('wedstrijden', `${velden}&datum=lte.${tot}&order=datum.asc,tijdstip.asc.nullslast,id.asc`),
      sbGet('wedstrijden', `${velden}&datum_nnb=eq.true&status=neq.gespeeld&order=id.asc`),
      sbGet('beker_toernooi','select=staat&order=id.desc&limit=1').catch(()=>[])
    ]);
    // Bekeruitslagen staan in het bekertoernooi (score per wedstrijd), gekoppeld via _wedstrijdId
    S.bekerUitslag = {};
    const fasen = (bekerRij[0] && bekerRij[0].staat && bekerRij[0].staat.fases) || {};
    Object.values(fasen).forEach(f=>(f.matches||[]).forEach(m=>{ if (m._wedstrijdId && m.winnaar) S.bekerUitslag[m._wedstrijdId] = m; }));
    rijen.forEach(w=>{
      const m = S.bekerUitslag[w.id];
      if (!m || (w.legs_thuis!=null && w.legs_uit!=null)) return;
      if (m.scoreA!=null && m.scoreB!=null){
        if (m.a===w.thuis){ w.legs_thuis=m.scoreA; w.legs_uit=m.scoreB; }
        else if (m.b===w.thuis){ w.legs_thuis=m.scoreB; w.legs_uit=m.scoreA; }
      }
      if (!w.uitslag) w.uitslag = 'Winnaar: '+m.winnaar;
    });
    S.rijen = rijen.filter(w=>!isBye(w));
    S.byes = rijen.filter(w=>isBye(w) && w.status==='gespeeld');
    S.nnb = nnb.filter(w=>!isBye(w));
    const namen = new Set();
    [...S.rijen, ...S.nnb].forEach(w=>{ namen.add(w.thuis); namen.add(w.uit); });
    S.spelers = [...namen].filter(Boolean).sort((a,b)=>a.localeCompare(b,'nl'));

    const mdd = document.getElementById('mededeling');
    const tekst = (I.app_mededeling_tekst||'').trim();
    if (String(I.app_mededeling_actief)==='true' && tekst){ mdd.textContent='📣 '+tekst; mdd.hidden=false; } else mdd.hidden=true;

    S.geladen=true; S.offline=false;
    opslaan('kb_schema_cache', JSON.stringify({ t:Date.now(), rijen:S.rijen, byes:S.byes, nnb:S.nnb, kantel:S.kantel,
      mdd: mdd.hidden ? '' : mdd.textContent }));
    zetSync(true);
    render();
  }catch(e){
    S.offline=true;
    zetSync(false);
    if (!S.geladen) document.getElementById('viewAlles').innerHTML =
      `<div class="leeg"><span class="ico">📡</span>Kan het schema nu niet ophalen.<br>Controleer je internet — we proberen het automatisch opnieuw.</div>`;
  }finally{ bezig=false; }
}

const hhmm = d => `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
function zetSync(ok){
  document.getElementById('dot').className = 'dot ' + (ok ? 'ok' : 'fout');
  if (ok) S.cacheTijd = Date.now();
  document.getElementById('syncTekst').textContent = ok
    ? `bijgewerkt ${hhmm(new Date())}`
    : (S.cacheTijd ? `offline · stand van ${hhmm(new Date(S.cacheTijd))}` : 'geen verbinding');
}

// Laatst bekende planning van dit toestel: direct tonen bij opstarten, en als er geen internet is.
(function laadUitCache(){
  try{
    const c = JSON.parse(lezen('kb_schema_cache') || 'null');
    if (!c || !Array.isArray(c.rijen)) return;
    const vd = vandaag();
    S.rijen = c.rijen;
    S.byes = c.byes || [];
    S.nnb = c.nnb || [];
    S.kantel = c.kantel || 24;
    const namen = new Set(); [...S.rijen, ...S.nnb].forEach(w=>{ namen.add(w.thuis); namen.add(w.uit); });
    S.spelers = [...namen].filter(Boolean).sort((a,b)=>a.localeCompare(b,'nl'));
    if (c.mdd){ const m=document.getElementById('mededeling'); m.textContent=c.mdd; m.hidden=false; }
    S.cacheTijd = c.t; S.geladen = true;
    document.getElementById('syncTekst').textContent = `stand van ${hhmm(new Date(c.t))}`;
  }catch(e){}
})();

// ══════════════════════════════════════════
//  WEERGAVE
// ══════════════════════════════════════════
function render(){
  document.querySelectorAll('.nav [data-view]').forEach(b=>b.classList.toggle('actief', b.dataset.view===S.view));
  document.getElementById('viewAlles').hidden = S.view!=='alles';
  document.getElementById('viewMijn').hidden  = S.view!=='mijn';
  document.getElementById('viewLive').hidden  = S.view!=='live';
  document.getElementById('viewStand').hidden = S.view!=='stand';
  if (S.view==='alles') renderAlles(); else if (S.view==='mijn') renderMijn();
  else if (S.view==='live') renderLive(); else renderStand();
}

// Uitslag van een gespeelde wedstrijd: winnaar uit de legstand, anders uit "Winnaar:/Verliezer: naam"
function winnaarVan(w){
  if (w.legs_thuis!=null && w.legs_uit!=null && w.legs_thuis!==w.legs_uit) return w.legs_thuis>w.legs_uit ? w.thuis : w.uit;
  const m = String(w.uitslag||'').match(/^(Winnaar|Verliezer):\s*(.+)$/i);
  if (!m) return null;
  const n=m[2].trim();
  return m[1].toLowerCase()==='winnaar' ? n : (n===w.thuis ? w.uit : w.thuis);
}
function veiligeLink(u){ return /^https:\/\/recap\.dartconnect\.com\/[A-Za-z0-9\/_.-]+$/.test(u||'') ? u : null; }
function verslagHtml(w){
  const u=veiligeLink(w.verslag_url);
  return u ? `<a class="verslag" href="${esc(u)}" target="_blank" rel="noopener">Verslag ›</a>` : '';
}

function namenHtml(w){
  const win = w.status==='gespeeld' ? winnaarVan(w) : null;
  const n = x => {
    const cls=[]; if (S.ik && x===S.ik) cls.push('ik'); if (win) cls.push(x===win?'winst':'verlies');
    return cls.length ? `<span class="${cls.join(' ')}">${esc(x)}</span>` : esc(x);
  };
  return `${n(w.thuis)}<span class="vs">vs</span>${n(w.uit)}`;
}

function rechtsHtml(w){
  if (w.status==='gespeeld'){
    if (w.legs_thuis!=null && w.legs_uit!=null){
      const a = w.legs_thuis>w.legs_uit ? `<b>${w.legs_thuis}</b>` : w.legs_thuis;
      const b = w.legs_uit>w.legs_thuis ? `<b>${w.legs_uit}</b>` : w.legs_uit;
      return `<span class="score">${a}-${b}</span><br>${verslagHtml(w)}`;
    }
    return `<span class="vink">✓ gespeeld</span>${verslagHtml(w) ? '<br>'+verslagHtml(w) : ''}`;
  }
  if (w.bord) return SCOREBORD_AAN && S.codes[w.bord]
    ? `<button class="bord" data-open-bord="${esc(w.bord)}">Bord ${esc(w.bord)}</button>`
    : `<span class="bord">Bord ${esc(w.bord)}</span>`;
  return '';
}

function kaartHtml(w, opties={}){
  const k=divKey(w);
  const cls=['kaart',k];
  if (w.status==='gespeeld') cls.push('gespeeld');
  else if (w.bord) cls.push('opbord');
  if (S.ik && (w.thuis===S.ik || w.uit===S.ik)) cls.push('mijn');
  if (opties.volgende) cls.push('volgende-kaart');
  const inhaal = w.is_inhaal ? `<span class="chip inhaal">Inhaal</span>` : '';
  const tijd = opties.metTijd ? `<div class="tijd-groot">${esc(w.tijdstip||'--:--')}</div>` : '';
  return `<div class="${cls.join(' ')}">
    ${tijd}
    <div class="k-midden">
      <div class="k-namen">${namenHtml(w)}</div>
      <div class="k-info"><span class="chip ${k}">${esc(divLabel(w))}</span>${inhaal}</div>
    </div>
    <div class="k-rechts">${opties.nnb ? '<span class="nnb-label">NNB</span>' : rechtsHtml(w)}</div>
  </div>`;
}

// Waar staat de gekozen speler vanavond? Op basis van wat de wedstrijdleiding op de borden zet.
function beurtInfo(){
  if (!S.ik) return null;
  const vd=vandaag();
  const vanavond = S.rijen.filter(w=>w.datum===vd);
  const mijn = vanavond.filter(w=>(w.thuis===S.ik||w.uit===S.ik) && w.status!=='gespeeld');
  if (!mijn.length) return null;
  const m = mijn.find(w=>w.bord) || mijn[0];
  const tegen = m.thuis===S.ik ? m.uit : m.thuis;
  if (m.bord) return { soort:'nu', ico:'🎯', kop:`Je speelt nu op bord ${m.bord}`, sub:`tegen ${tegen}` };
  const begonnen = vanavond.some(w=>w.bord || w.status==='gespeeld');
  if (!begonnen){
    const tijden = mijn.map(w=>w.tijdstip).filter(Boolean);
    return { soort:'later', ico:'🗓️', kop: tijden.length ? `Vanavond speel je om ${tijden.join(' en ')}` : 'Je speelt vanavond',
             sub: mijn.length>1 ? `${mijn.length} wedstrijden` : `tegen ${tegen}` };
  }
  // Wachtrij: alles van vanavond dat nog niet gespeeld is en nog niet op een bord staat, in volgorde van het schema
  const wachtrij = vanavond.filter(w=>w.status!=='gespeeld' && !w.bord);
  const plek = wachtrij.indexOf(m);
  if (plek < 4) return { soort:'klaar', ico:'⏳', kop:'Je bent eerstvolgend, houd je klaar', sub:`tegen ${tegen}${m.tijdstip ? ` · gepland ${m.tijdstip}` : ''}` };
  return { soort:'wacht', ico:'🕐', kop:`Nog ${plek} wedstrijd${plek===1?'':'en'} vóór jou`, sub:`tegen ${tegen}${m.tijdstip ? ` · gepland ${m.tijdstip}` : ''}` };
}
function beurtHtml(){
  const b = beurtInfo(); if (!b) return '';
  return `<div class="beurt ${b.soort}"><div class="ico">${b.ico}</div><div><b>${esc(b.kop)}</b><span>${esc(b.sub)}</span></div></div>`;
}

function avondenLijst(){ return [...new Set(S.rijen.map(w=>w.datum))]; }

function renderAlles(){
  const el=document.getElementById('viewAlles');
  const avonden=avondenLijst();
  if (!avonden.length){
    el.innerHTML=`<div class="leeg"><span class="ico">🌙</span>Er staan nog geen wedstrijden gepland.</div>`;
    return;
  }
  const vd=vandaag();
  // Op een speelavond: vandaag. Daarna, tot de volgende speelavond: de laatst gespeelde avond (uitslagen).
  if (!S.gekozenAvond || !avonden.includes(S.gekozenAvond)){
    const verleden = avonden.filter(d=>d<vd);
    S.gekozenAvond = avonden.includes(vd) ? vd
      : (verleden.length ? verleden[verleden.length-1] : (avonden.find(d=>d>vd) || avonden[avonden.length-1]));
  }

  const chips = avonden.map(d=>{
    const dt=alsDatum(d);
    const c=['avond']; if (d===S.gekozenAvond) c.push('actief'); if (d===vd) c.push('vandaag'); if (d<vd) c.push('verleden');
    return `<button class="${c.join(' ')}" data-avond="${d}"><span>${d===vd?'vandaag':esc(fmtKort.format(dt))}</span><b>${esc(fmtDag.format(dt))}</b></button>`;
  }).join('');

  const rijen=S.rijen.filter(w=>w.datum===S.gekozenAvond);
  const perTijd={};
  rijen.forEach(w=>{ const t=w.tijdstip||'Tijd volgt'; (perTijd[t]=perTijd[t]||[]).push(w); });
  const tijden=Object.keys(perTijd).sort((a,b)=> a==='Tijd volgt' ? 1 : b==='Tijd volgt' ? -1 : a.localeCompare(b));
  // Eerstvolgend tijdslot (alleen vandaag): eerste slot met een wedstrijd die nog niet gespeeld is en niet op een bord staat
  const eerstvolgend = S.gekozenAvond===vd ? tijden.find(t=>perTijd[t].some(w=>w.status!=='gespeeld' && !w.bord)) : null;

  const open = rijen.filter(w=>w.status!=='gespeeld').length;
  const slots = tijden.map(t=>{
    const lijst=perTijd[t];
    const allesKlaar = lijst.every(w=>w.status==='gespeeld');
    const lbl = t===eerstvolgend ? `<span class="label volgend">eerstvolgend</span>` : allesKlaar ? `<span class="label klaar">klaar</span>` : '';
    return `<div class="slot"><div class="slot-kop"><span class="slot-tijd">${esc(t)}</span>${lbl}</div>${lijst.map(w=>kaartHtml(w)).join('')}</div>`;
  }).join('');

  const titel = fmtLang.format(alsDatum(S.gekozenAvond));
  el.innerHTML = `
    ${beurtHtml()}
    <div class="avonden" id="avonden">${chips}</div>
    <div class="avond-titel"><h2>${S.gekozenAvond<vd ? 'Uitslagen van '+esc(titel) : esc(titel.charAt(0).toUpperCase()+titel.slice(1))}</h2>
      <span class="teller">${rijen.length} wedstrijden${open<rijen.length && open ? ` · ${open} open` : ''}</span></div>
    ${slots}
    <button class="deel" id="deelApp">📲 Stuur de app door</button>`;
  el.querySelector('#deelApp').addEventListener('click', deelApp);

  el.querySelectorAll('[data-avond]').forEach(b=>b.addEventListener('click',()=>{ S.gekozenAvond=b.dataset.avond; renderAlles(); }));
  const actief=el.querySelector('.avond.actief'); if (actief) actief.scrollIntoView({block:'nearest',inline:'center'});
}

function renderMijn(){
  const el=document.getElementById('viewMijn');
  if (!S.ik || !S.spelers.includes(S.ik)){
    const opts = S.spelers.map(n=>`<option value="${esc(n)}"${n===S.ik?' selected':''}>${esc(n)}</option>`).join('');
    el.innerHTML = `<div class="kiezer">
        <label for="kies">Wie ben jij?</label>

      html += `<div class="datumkop${d===vd?' vandaag':''}">${d===vd?'Vandaag · ':''}${esc(t)}</div>`;
      html += perDag[d].map(w=>kaartHtml(w,{metTijd:true, volgende: w===volgende})).join('');
    });

  html += uitslagenHtml(mijnAlle);
  html += agendaHtml();
  el.innerHTML = html;
  el.querySelector('#wissel').addEventListener('click',()=>{ S.ik=null; S.ikId=null; opslaan('kb_schema_ik',null); render(); });
  el.querySelector('#deelMijn').addEventListener('click',()=>deelMijn(mijn));

  haalIkId();
}

function uitslagenHtml(mijnAlle){
  const vd=vandaag();
  const gespeeld = mijnAlle.filter(w=>w.status==='gespeeld')
    .concat(S.byes.filter(w=>w.thuis===S.ik || w.uit===S.ik))
    .sort((a,b)=> (b.datum+(b.tijdstip||'')).localeCompare(a.datum+(a.tijdstip||'')));
  if (!gespeeld.length) return '';
  const metUitslag = gespeeld.filter(w=>!isBye(w) && winnaarVan(w));
  const w = metUitslag.filter(x=>winnaarVan(x)===S.ik).length, v = metUitslag.length - w;
  const vorm = metUitslag.slice(0,5).reverse().map(x=>winnaarVan(x)===S.ik ? '<i class="w">W</i>' : '<i class="v">V</i>').join('');
  const lijst = (S.alleUitslagen ? gespeeld : gespeeld.slice(0,5)).map(x=>{
    const dt = esc(fmtDag.format(alsDatum(x.datum)));
    if (isBye(x)) return `<div class="res"><span class="rd">${dt}</span><span class="rt">Vrije ronde</span><span class="rs"><span class="wv w">W</span><span class="score">3-0</span></span></div>`;
    const tegen = x.thuis===S.ik ? x.uit : x.thuis;
    const win = winnaarVan(x);
    const mijnLegs = x.thuis===S.ik ? x.legs_thuis : x.legs_uit, hunLegs = x.thuis===S.ik ? x.legs_uit : x.legs_thuis;
    const score = mijnLegs!=null && hunLegs!=null ? `<span class="score">${mijnLegs}-${hunLegs}</span>` : '';
    const wv = win ? `<span class="wv ${win===S.ik?'w':'v'}">${win===S.ik?'W':'V'}</span>` : '';
    const beker = divKey(x)==='beker' ? ' <span class="chip beker">Beker</span>' : '';
    return `<div class="res"><span class="rd">${dt}</span><span class="rt">tegen ${esc(tegen)}${beker}</span><span class="rs">${wv}${score}${verslagHtml(x)?'<br>'+verslagHtml(x):''}</span></div>`;
  }).join('');
  return `<div class="uitslagen"><h3>Mijn uitslagen</h3>
    ${metUitslag.length ? `<div class="vorm">Vorm ${vorm}<span style="margin-left:auto">${w} gewonnen · ${v} verloren</span></div>` : ''}
    ${lijst}
    ${!S.alleUitslagen && gespeeld.length>5 ? `<button class="meer" id="meerUitslagen">Toon alle ${gespeeld.length} uitslagen</button>` : ''}
  </div>`;
}

const PERIODE_LABELS = {1:'Ronde 1–10', 2:'Ronde 11–20', 3:'Ronde 21–30', 4:'Ronde 31–42'};
const ERE_PLAYOFF = [17,18,19], ERE_DEGRADATIE = [20,21];
let standBezig=false;
async function laadStand(force){
  if (standBezig || (!force && S.stand && Date.now()-S.standTijd < 60000)) { renderStand(); return; }
  standBezig=true;
  try{
    const [pst, ere, stats, volgende, bekerStaat, bekerLinks] = await Promise.all([
      sbGet('periodestand_eerste_divisie','select=*&order=periode.asc,positie.asc'),
      sbGet('wedstrijden','select=thuis,uit,uitslag,legs_thuis,legs_uit&divisie=eq.Eredivisie&status=eq.gespeeld'),
      sbGet('stats_snapshots','select=peildatum,divisie,speler,wedstrijden,s180,t140,t100,gem,hoogste_finish,beste_leg&order=peildatum.desc&limit=300'),
      sbGet('wedstrijden',`select=speelronde&divisie=eq.Eerste%20Divisie&status=neq.gespeeld&datum_nnb=eq.false&datum=gte.${vandaag()}&order=datum.asc,tijdstip.asc&limit=20`),
      sbGet('beker_toernooi','select=staat&order=id.desc&limit=1').catch(()=>[]),
      sbGet('wedstrijden','select=id,verslag_url&divisie=ilike.Beker*&verslag_url=not.is.null').catch(()=>[])
    ]);
    // Statistieken: per divisie alleen de laatste peildatum
    const laatste={}; stats.forEach(r=>{ if (!laatste[r.divisie] || r.peildatum>laatste[r.divisie]) laatste[r.divisie]=r.peildatum; });
    S.beker = { staat: bekerStaat[0]?.staat || null, links: Object.fromEntries(bekerLinks.map(r=>[r.id, r.verslag_url])) };
    S.stand = { pst, ere: berekenEre(ere), eind: berekenEind(pst),
                stats: stats.filter(r=>r.peildatum===laatste[r.divisie]), peil: laatste };
    S.standTijd = Date.now();
    if (!S.standPeriode){
      // Periode die nu loopt: die van de eerstvolgende speelronde in de planning (1–10, 11–20, 21–30, 31–42)
      const rondes = volgende.map(w=>parseInt(w.speelronde,10)).filter(n=>!isNaN(n));
      const r = rondes.length ? Math.min(...rondes) : null;
      S.standPeriode = r===null ? 'eind' : r<=10 ? 1 : r<=20 ? 2 : r<=30 ? 3 : 4;
    }
  }catch(e){ if (!S.stand) S.stand = { fout:true }; }
  finally{ standBezig=false; }
  if (S.view==='stand') renderStand();
}
function berekenEre(data){
  const t={}, rij=n=>t[n]||(t[n]={speler:n,g:0,w:0,v:0,lv:0,lt:0,p:0,zonder:0});
  const bye=n=>!n||n.toLowerCase()===BYE;
  data.forEach(m=>{
    const metLegs = m.legs_thuis!==null && m.legs_uit!==null;
    let winnaar=null;
    if (metLegs) winnaar = m.legs_thuis>m.legs_uit ? m.thuis : m.uit;
    else if (m.uitslag){
      const mt=m.uitslag.match(/^(Winnaar|Verliezer):\s*(.+)$/i);
      if (mt){ const n=mt[2].trim(); winnaar = mt[1].toLowerCase()==='winnaar' ? n : (n===m.thuis ? m.uit : m.thuis); }
    }
    [[m.thuis,m.legs_thuis,m.legs_uit],[m.uit,m.legs_uit,m.legs_thuis]].forEach(([n,voor,tegen])=>{
      if (bye(n)) return; const r=rij(n); r.g++;
      if (winnaar===n) r.w++; else if (winnaar) r.v++;
      if (metLegs){ r.lv+=voor; r.lt+=tegen; r.p+=voor; } else r.zonder++;
    });
  });
  const l=Object.values(t).sort((a,b)=>b.p-a.p||b.w-a.w||a.v-b.v||(b.lv-b.lt)-(a.lv-a.lt)||a.speler.localeCompare(b.speler));
  l.forEach((r,i)=>{ const v=l[i-1]; r.pos=(v&&v.p===r.p&&v.w===r.w&&v.v===r.v&&(v.lv-v.lt)===(r.lv-r.lt))?v.pos:i+1; });
  return l;
}
// Eindstand Eerste Divisie: totaal over de periodes, directe promotie (nr. 1 en 2),
// periodetitels en play-off tickets — zelfde regels als periode.html
function berekenEind(data){
  const tot={};
  data.forEach(r=>{ const t=tot[r.speler]||(tot[r.speler]={speler:r.speler,w:0,g:0,p:0});
    t.w+=Number(r.wedstrijden_gespeeld); t.g+=Number(r.gewonnen); t.p+=Number(r.periodepunten); });
  const lijst=Object.values(tot).sort((a,b)=>b.p-a.p||b.g-a.g||a.speler.localeCompare(b.speler));
  lijst.forEach((t,i)=>t.pos=i+1);
  const promo=new Set(lijst.slice(0,2).map(t=>t.speler));
  const titels={}, tickets={};
  [1,2,3,4].forEach(p=>{
    const rijen=data.filter(r=>r.periode===p); if (!rijen.length) return;
    (titels[rijen[0].speler]=titels[rijen[0].speler]||[]).push(p);
    const k=rijen.find(r=>!tickets[r.speler] && !promo.has(r.speler)); if (k) tickets[k.speler]=p;
  });
  const vijfde=lijst.find(t=>!tickets[t.speler] && !promo.has(t.speler)); if (vijfde) tickets[vijfde.speler]='E';
  lijst.forEach(t=>{ t.promo=promo.has(t.speler); t.titels=titels[t.speler]||[]; t.ticket=tickets[t.speler]||null; });
  return lijst;
}

const B_FASES = {
  ronde1:{label:'Ronde 1',kort:'Ronde 1',bo:5}, wr2:{label:'Winnaarsronde 2',kort:'WR 2',bo:5}, vr2:{label:'Verliezersronde 2',kort:'VR 2',bo:5},
  vr3_tussen:{label:'Verliezersronde 3 — tussenronde',kort:'VR 3 tussen',bo:5}, vr3:{label:'Verliezersronde 3',kort:'VR 3',bo:5}, wr3:{label:'Winnaarsronde 3',kort:'WR 3',bo:5},
  wr_kwart:{label:'Winnaarsronde — kwartfinale',kort:'WR kwart',bo:5}, vr_kwart:{label:'Verliezersronde — kwartfinale',kort:'VR kwart',bo:5},
  wr_halve:{label:'Winnaarsronde — halve finale',kort:'WR halve',bo:7}, vr_halve:{label:'Verliezersronde — halve finale',kort:'VR halve',bo:7},
  wr_finale:{label:'Winnaarsronde — finale',kort:'WR finale',bo:9}, vr_finale:{label:'Verliezersronde — finale',kort:'VR finale',bo:9},
};
const B_VOLGORDE = ['ronde1','wr2','vr2','vr3_tussen','vr3','wr3','wr_kwart','vr_kwart','wr_halve','vr_halve','wr_finale','vr_finale'];
function bekerHtml(){
  const st = S.beker && S.beker.staat;
  if (!st || !st.fases) return `<div class="leeg"><span class="ico">🏆</span>Het bekertoernooi is nog niet geloot.</div>`;
  const f = st.fases;
  const r1 = (f.ronde1 && f.ronde1.matches) || [];
  const fasen = B_VOLGORDE.filter(id=>f[id] && (f[id].matches||[]).length);
  // Standaard de fase die nu loopt (eerste niet-afgeronde), anders de laatste
  // Standaard de nieuwste fase die nog loopt, anders de laatste
  if (!S.bekerFase || !fasen.includes(S.bekerFase)) S.bekerFase = fasen.filter(id=>!f[id].afgerond).pop() || fasen[fasen.length-1];

  const wachtNaam = m => { const rm=r1.find(x=>x.nr===m._wachtOpWedstrijd); return rm ? `winnaar ${rm.a} / ${rm.b}` : 'nog onbekend'; };
  const naamA = m => m.a || (m._wachtOpWedstrijd ? wachtNaam(m) : 'nog onbekend');
  const naamB = m => m.b || 'nog onbekend';

  // ── Jouw beker ──
  let jouw = '';
  if (S.ik){
    const mijn = [];
    B_VOLGORDE.forEach(id=>(f[id]?.matches||[]).forEach(m=>{ if (m.a===S.ik || m.b===S.ik) mijn.push({id,m}); }));
    const bye = (f.ronde1?.bye||[]).includes(S.ik);
    if (mijn.length || bye){
      const open = mijn.find(x=>!x.m.winnaar);
      const laatste = mijn.filter(x=>x.m.winnaar).pop();
      let status;
      if (st.kampioenWR===S.ik) status='🏆 Bekerwinnaar!';
      else if (st.kampioenVR===S.ik) status='🥈 Winnaar verliezersronde!';
      else if (open){
        const tegen = open.m.a===S.ik ? naamB(open.m) : naamA(open.m);
        status = `Volgende: <b>${esc(B_FASES[open.id].label)}</b> tegen <b>${esc(tegen)}</b>`;
      } else if (laatste && laatste.m.winnaar!==S.ik){
        // Toernooiregels: verliezers van ronde 1 → verliezersronde 2; bye-spelers die hun eerste duel (WR 2) verliezen
        // krijgen één troostronde in de verliezersronde; verder is een nederlaag het einde.
        const eersteDuel = mijn[0] === laatste;
        if (laatste.id==='ronde1') status='Je gaat door in de <b>verliezersronde</b>. Je tegenstander volgt na de loting.';
        else if (laatste.id==='wr2' && bye && eersteDuel) status='Je krijgt een troostronde in de <b>verliezersronde</b>. Je tegenstander volgt na de loting.';
        else status='Je bent uitgeschakeld. Bedankt voor het meedoen!';
      } else if (laatste) status='Gewonnen! Je tegenstander in de volgende ronde volgt na de loting.';
      else status='Je wacht op de volgende loting.';
      const res = mijn.filter(x=>x.m.winnaar).map(x=>{
        const ikA = x.m.a===S.ik, tegen = ikA ? x.m.b : x.m.a, won = x.m.winnaar===S.ik;
        const sc = x.m.scoreA!=null ? (ikA ? `${x.m.scoreA}-${x.m.scoreB}` : `${x.m.scoreB}-${x.m.scoreA}`) : '';
        return `<div class="res"><span class="rd">${esc(B_FASES[x.id].kort)}</span><span class="rt">tegen ${esc(tegen)}</span><span class="rs"><span class="wv ${won?'w':'v'}">${won?'W':'V'}</span><span class="score">${sc}</span></span></div>`;
      }).join('');
      jouw = `<div class="uitslagen" style="margin-top:0"><h3>Jouw beker</h3><div style="font-size:.9rem;margin-bottom:6px">${status}</div>${bye && !mijn.some(x=>x.id==='ronde1') ? '<div class="stand-noot" style="margin:0 0 6px">Bye in ronde 1.</div>' : ''}${res}</div>`;
    }
  }

  const kamp = [st.kampioenWR ? `🏆 Bekerwinnaar: ${esc(st.kampioenWR)}` : '', st.kampioenVR ? `🥈 Winnaar verliezersronde: ${esc(st.kampioenVR)}` : '']
    .filter(Boolean).map(t=>`<div class="kampioen">${t}</div>`).join('');

  // ── Fasekeuze ──
  const chips = fasen.map(id=>{
    const ms=f[id].matches, klaar=ms.filter(m=>m.winnaar).length;
    return `<button data-bfase="${id}" class="${id===S.bekerFase?'actief':''}"><b>${esc(B_FASES[id].kort)}</b><span>${f[id].afgerond?'klaar ✓':`${klaar}/${ms.length} gespeeld`}</span></button>`;
  }).join('');

  // ── Duels van de gekozen fase: eerst nog te spelen, dan gespeeld ──
  const fase = f[S.bekerFase];
  const regel = m => {
    const isMijn = S.ik && (m.a===S.ik || m.b===S.ik);
    const cls = x => [S.ik&&x===S.ik?'ik':'', m.winnaar ? (x===m.winnaar?'winst':'verlies') : ''].join(' ');
    const a = m.a ? `<span class="${cls(m.a)}">${esc(m.a)}</span>` : `<span class="verlies">${esc(naamA(m))}</span>`;
    const b = m.b ? `<span class="${cls(m.b)}">${esc(m.b)}</span>` : `<span class="verlies">${esc(naamB(m))}</span>`;
    const sc = m.scoreA!=null && m.scoreB!=null ? `${m.scoreA} – ${m.scoreB}` : 'vs';
    const link = m._wedstrijdId && veiligeLink(S.beker.links[m._wedstrijdId]);
    return `<div class="duel${isMijn?' mijn':''}"><div class="da">${a}</div><div class="dm">${sc}${link?`<a class="verslag" href="${esc(link)}" target="_blank" rel="noopener">Verslag ›</a>`:''}</div><div class="db">${b}</div></div>`;
  };
  const open = fase.matches.filter(m=>!m.winnaar), klaar = fase.matches.filter(m=>m.winnaar);
  const byes = S.bekerFase==='ronde1' && (fase.bye||[]).length ? `<div class="stand-noot">${fase.bye.length} spelers hadden een bye en stroomden direct door naar winnaarsronde 2.</div>` : '';
  const lijst = (open.length ? `<div class="bgroep">Nog te spelen (${open.length})</div>${open.map(regel).join('')}` : '')
              + (klaar.length ? `<div class="bgroep">Gespeeld (${klaar.length})</div>${klaar.map(regel).join('')}` : '');

  return `${kamp}${jouw}<div class="periodes bfasen">${chips}</div>
    <div class="avond-titel"><h2 style="font-size:1rem">${esc(B_FASES[S.bekerFase].label)}</h2><span class="teller">best of ${B_FASES[S.bekerFase].bo}</span></div>
    ${lijst}${byes}`;
}

function knoppen(attr, opties, actief){
  return opties.map(([w,l])=>`<button data-${attr}="${w}" class="${String(actief)===String(w)?'actief':''}">${l}</button>`).join('');
}
function renderStand(){
  const el=document.getElementById('viewStand');
  S.standSoort = S.standSoort || 'rang';
  S.statsSort = S.statsSort || 'gem';
  const kop = `<div class="seg">${knoppen('soort',[['rang','Ranglijst'],['stats','Statistieken'],['beker','Beker']],S.standSoort)}</div>` +
    (S.standSoort==='beker' ? '' : `<div class="seg">${knoppen('div',[['ere','Eredivisie'],['eerste','Eerste Divisie']],S.standDiv)}</div>`);
  let inhoud;
  if (!S.stand) inhoud = `<div class="leeg"><span class="ico">⏳</span>Laden…</div>`;
  else if (S.stand.fout) inhoud = `<div class="leeg"><span class="ico">📡</span>Kan de standen nu niet ophalen.</div>`;
  else if (S.standSoort==='beker') inhoud = bekerHtml();
  else if (S.standSoort==='stats') inhoud = statsHtml();
  else if (S.standDiv==='eerste') inhoud = eersteHtml();
  else inhoud = ereHtml();
  el.innerHTML = `<div class="avond-titel"><h2>Standen</h2></div>${kop}${inhoud}`;
  el.querySelectorAll('[data-soort]').forEach(b=>b.addEventListener('click',()=>{ S.standSoort=b.dataset.soort; renderStand(); }));
  el.querySelectorAll('[data-div]').forEach(b=>b.addEventListener('click',()=>{ S.standDiv=b.dataset.div; renderStand(); }));
  el.querySelectorAll('[data-periode]').forEach(b=>b.addEventListener('click',()=>{ const v=b.dataset.periode; S.standPeriode = v==='eind' ? 'eind' : Number(v); renderStand(); }));
  el.querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click',()=>{ S.statsSort=b.dataset.sort; renderStand(); }));
  el.querySelectorAll('[data-bfase]').forEach(b=>b.addEventListener('click',()=>{ S.bekerFase=b.dataset.bfase; renderStand(); }));
  const af = el.querySelector('.bfasen .actief'); if (af) af.scrollIntoView({block:'nearest',inline:'center'});
}
function eersteHtml(){
  const per = [1,2,3,4].map(p=>`<button data-periode="${p}" class="${S.standPeriode===p?'actief':''}"><b>P${p}</b><span>${PERIODE_LABELS[p].replace('Ronde ','')}</span></button>`).join('')
    + `<button data-periode="eind" class="${S.standPeriode==='eind'?'actief':''}"><b>Eind</b><span>totaal</span></button>`;
  let tabel;
  if (S.standPeriode==='eind'){
    const l=S.stand.eind;
    tabel = l.length ? `<table class="stand"><thead><tr><th></th><th>Speler</th><th class="num">Wedstr.</th><th class="num">Winst</th><th class="num">Ptn</th></tr></thead><tbody>${
      l.map(t=>{ const tags=[];
        if (t.promo) tags.push('<span class="zone-tag prom">⬆ promotie</span>');
        if (t.titels.length) tags.push(`<span class="zone-tag titel">🏆 P${t.titels.join(', P')}</span>`);
        if (t.ticket) tags.push(`<span class="zone-tag po">🎟 ${t.ticket==='E'?'eindstand':'P'+t.ticket}</span>`);
        return `<tr class="${t.promo?'leider':''}${t.speler===S.ik?' ik':''}"><td class="pos">${t.pos}</td><td>${esc(t.speler)}${tags.length?`<div class="tags">${tags.join('')}</div>`:''}</td><td class="num">${t.w}</td><td class="num">${t.g}</td><td class="num"><b>${t.p}</b></td></tr>`;
      }).join('')}</tbody></table>
      <div class="stand-noot">⬆ Nr. 1 en 2 promoveren direct. 🏆 Periodetitel. 🎟 Play-off ticket: per periode de beste speler zonder ticket, plus één via de eindstand.</div>`
      : `<div class="leeg"><span class="ico">🎯</span>Nog geen gespeelde wedstrijden.</div>`;
  } else {
    const rijen = S.stand.pst.filter(r=>r.periode===S.standPeriode);
    tabel = rijen.length
      ? `<table class="stand"><thead><tr><th></th><th>Speler</th><th class="num">Wedstr.</th><th class="num">Winst</th><th class="num">Ptn</th></tr></thead><tbody>${
          rijen.map(r=>`<tr class="${r.positie==1?'leider':''}${r.speler===S.ik?' ik':''}"><td class="pos">${r.positie==1?'🏆':r.positie}</td><td>${esc(r.speler)}</td><td class="num">${r.wedstrijden_gespeeld}</td><td class="num">${r.gewonnen}</td><td class="num"><b>${r.periodepunten}</b></td></tr>`).join('')
        }</tbody></table><div class="stand-noot">Punten = gewonnen legs. ${PERIODE_LABELS[S.standPeriode]}.</div>`
      : `<div class="leeg"><span class="ico">🎯</span>Nog geen gespeelde wedstrijden in deze periode.</div>`;
  }
  return `<div class="periodes">${per}</div>${tabel}`;
}
function ereHtml(){
  const l=S.stand.ere;
  if (!l.length) return `<div class="leeg"><span class="ico">🎯</span>Nog geen gespeelde wedstrijden.</div>`;
  const zonder = l.reduce((n,r)=>n+r.zonder,0)/2;
  const geenLegs = l.every(r=>r.lv===0 && r.lt===0);   // nog geen enkele legstand ingelezen: punten weglaten
  const rij = (r,i)=>{ const plek=i+1; let cls='', tag='';
    if (ERE_PLAYOFF.includes(plek)){ cls='zone-po'; if (plek===ERE_PLAYOFF[0]) tag='<span class="zone-tag po">play-offs</span>'; }
    if (ERE_DEGRADATIE.includes(plek)){ cls='zone-deg'; if (plek===ERE_DEGRADATIE[0]) tag='<span class="zone-tag deg">degradatie</span>'; }
    if (plek===ERE_PLAYOFF[0]||plek===ERE_DEGRADATIE[0]) cls+=' streep';
    if (r.speler===S.ik) cls+=' ik';
    return `<tr class="${cls}"><td class="pos">${r.pos}</td><td>${esc(r.speler)}${tag}</td><td class="num">${r.g}</td>` +
      (geenLegs ? `<td class="num">${r.w}</td><td class="num">${r.v}</td>` : `<td class="num">${r.w}-${r.v}</td><td class="num"><b>${r.p}</b>${r.zonder?' *':''}</td>`) + `</tr>`;
  };
  const kop = geenLegs ? '<th class="num">G</th><th class="num">W</th><th class="num">V</th>' : '<th class="num">G</th><th class="num">W-V</th><th class="num">Ptn</th>';
  const noot = geenLegs
    ? 'Gesorteerd op winst en verlies. De punten (gewonnen legs) verschijnen zodra de legstanden zijn ingelezen.'
    : `Punten = gewonnen legs.${zonder ? ` * ${Math.round(zonder)} gespeelde wedstrijd(en) hebben nog geen legstand en tellen nog niet mee voor de punten.` : ''}`;
  return `<table class="stand"><thead><tr><th></th><th>Speler</th>${kop}</tr></thead><tbody>${l.map(rij).join('')}</tbody></table><div class="stand-noot">${noot}</div>`;
}
function statsHtml(){
  const naam = S.standDiv==='eerste' ? 'Eerste Divisie' : 'Eredivisie';
  const rijen = S.stand.stats.filter(r=>r.divisie===naam);
  if (!rijen.length) return `<div class="leeg"><span class="ico">📊</span>Nog geen statistieken voor de ${naam}.</div>`;
  const def = STAT_SORT[S.statsSort];
  const num = (r,k) => r[k]===null || r[k]===undefined || r[k]==='' ? null : Number(r[k]);
  // Spelers zonder waarde voor de hoofdstatistiek tellen niet mee
  const l = rijen.filter(r=>num(r,def.sorteer[0][0])!==null).sort((a,b)=>{
    for (const [k,hoog] of def.sorteer){ const x=num(a,k)??-1, y=num(b,k)??-1; if (x!==y) return hoog ? y-x : x-y; }
    return a.speler.localeCompare(b.speler);
  });
  // Gedeelde plek bij precies dezelfde waarden
  l.forEach((r,i)=>{ const v=l[i-1]; r._pos = v && def.sorteer.every(([k])=>num(v,k)===num(r,k)) ? v._pos : i+1; });
  const fmt = (r,k)=>{ const v=r[k]; if (v===null||v===undefined||v==='') return '–'; return k==='gem' ? Number(v).toFixed(2).replace('.',',') : v; };
  const peil = S.stand.peil[naam];
  return `<div class="periodes">${knoppenSort()}</div>
    <table class="stand"><thead><tr><th></th><th>Speler</th>${def.kolommen.map(([,t])=>`<th class="num">${t}</th>`).join('')}</tr></thead><tbody>${
      l.map(r=>`<tr class="${r.speler===S.ik?'ik':''}"><td class="pos">${r._pos}</td><td>${esc(r.speler)}</td>${
        def.kolommen.map(([k],i)=>`<td class="num">${i===0?`<b>${fmt(r,k)}</b>`:fmt(r,k)}</td>`).join('')}</tr>`).join('')
    }</tbody></table>
    <div class="stand-noot">Stand van ${esc(fmtLang.format(alsDatum(peil)))} (DartConnect).${S.statsSort==='gem' ? ' Gemiddelde per 3 darts.' : ''}${S.statsSort==='beste_leg' ? ' Minste aantal darts voor een leg.' : ''}</div>`;
}
function knoppenSort(){
  return Object.entries(STAT_SORT).map(([k,d])=>`<button data-sort="${k}" class="${S.statsSort===k?'actief':''}"><b>${d.kort}</b><span>${d.label}</span></button>`).join('');
}

// ── Scorebord groot in beeld ──
const sb = {
  el: document.getElementById('scorebord'), vak: document.getElementById('sbVak'),
  frame: document.getElementById('sbFrame'), melding: document.getElementById('sbMelding'),
  titel: document.getElementById('sbTitel'), ext: document.getElementById('sbExt'),
  geladenUrl: ''
};
function schaalScorebord(){
  const w=sb.vak.clientWidth, h=sb.vak.clientHeight;
  if (!w || !h) return;
  const s=Math.min(w/1600, h/900);
  const x=(w-1600*s)/2, y=Math.max(0,(h-900*s)/2);
  sb.frame.style.transform=`translate(${x}px,${y}px) scale(${s})`;
}
new ResizeObserver(schaalScorebord).observe(sb.vak);

function werkScorebordBij(){
  const b=S.openBord, w=S.borden[b], url=dcUrl(S.codes[b]);
  sb.titel.innerHTML = `<b>Bord ${b}</b><span>${w ? `${esc(w.thuis)} vs ${esc(w.uit)}` : 'Live stand'}</span>`;
  if (url){
    sb.melding.hidden=true; sb.frame.hidden=false;
    sb.ext.href=url; sb.ext.hidden=false;
    // Alleen opnieuw laden als de koppeling van dit bord echt veranderd is (zoals op de TV)
    if (url!==sb.geladenUrl){ sb.frame.src=url; sb.geladenUrl=url; }
  } else {
    sb.frame.hidden=true; sb.frame.removeAttribute('src'); sb.geladenUrl='';
    sb.ext.hidden=true;
    sb.melding.innerHTML='<span style="font-size:2rem">🎯</span>De live stand van dit bord is niet (meer) beschikbaar.<br>Misschien is de wedstrijd net afgelopen.';
    sb.melding.hidden=false;
  }
  schaalScorebord();
}
function openScorebord(b){
  if (!SCOREBORD_AAN || !S.codes[b]) return;
  S.openBord=b; sb.el.hidden=false; document.body.style.overflow='hidden';
  telScorebord(b);
  try{ history.pushState({scorebord:b}, ''); }catch(e){}
  werkScorebordBij();
}
// Anonieme telling: één seintje per apparaat per bord per dag (geen naam)
function telScorebord(b){
  if (TESTVERSIE) return;
  try{
    const id=lezen('kb_schema_apparaat'); if (!id) return;
    const sleutel='kb_schema_bord_'+b;
    if (lezen(sleutel)===vandaag()) return;
    fetch(`${SB_URL}/rest/v1/app_scorebord_kijkers`, {
      method:'POST',
      headers:{ ...HDR, 'Content-Type':'application/json', 'Prefer':'return=minimal' },
      body: JSON.stringify({ apparaat:id, bord:b })
    }).then(r=>{ if (r.ok || r.status===409) opslaan(sleutel, vandaag()); }).catch(()=>{});
  }catch(e){}
}
function sluitScorebord(viaTerug){
  if (!S.openBord) return;
  S.openBord=null; sb.el.hidden=true; document.body.style.overflow='';
  sb.frame.removeAttribute('src'); sb.geladenUrl='';
  if (!viaTerug){ try{ if (history.state && history.state.scorebord) history.back(); }catch(e){} }
}
document.getElementById('sbTerug').addEventListener('click',()=>sluitScorebord(false));
window.addEventListener('popstate',()=>sluitScorebord(true));

const TESTVERSIE = false;  // op true zetten voor een testpagina: geen service worker, geen telling
if (!TESTVERSIE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { scope:'./' }).catch(()=>{});

// ══════════════════════════════════════════
//  ANONIEME TELLING — één seintje per apparaat per dag (browser of geïnstalleerde app).
//  Alleen een willekeurig apparaatnummer, geen naam of andere gegevens.
// ══════════════════════════════════════════
(function telBezoek(){
  if (TESTVERSIE) return;
  try{
    let id = lezen('kb_schema_apparaat');
    if (!id){
      id = (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
        const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
      opslaan('kb_schema_apparaat', id);
    }
    const app = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    const sleutel = 'kb_schema_geteld_' + (app ? 'app' : 'web');
    if (lezen(sleutel) === vandaag()) return;      // vandaag al geteld
    fetch(`${SB_URL}/rest/v1/app_bezoeken`, {
      method:'POST',
      headers:{ ...HDR, 'Content-Type':'application/json', 'Prefer':'return=minimal' },
      body: JSON.stringify({ apparaat:id, geinstalleerd:app })
    }).then(r=>{ if (r.ok || r.status===409) opslaan(sleutel, vandaag()); }).catch(()=>{});
  }catch(e){}
})();

(function installeerTip(){
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (TESTVERSIE) return;
  if (standalone || lezen('kb_schema_tip_weg')) return;
  const box=document.getElementById('installeer'), tekst=document.getElementById('installeerTekst'), ja=document.getElementById('installeerJa');
  document.getElementById('installeerNee').addEventListener('click',()=>{ box.hidden=true; opslaan('kb_schema_tip_weg','1'); });
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  if (ios){
    tekst.innerHTML='Zet het schema als app op je beginscherm: tik op <b>Deel</b> <span aria-hidden="true">⎙</span> en kies <b>Zet op beginscherm</b>.';
    box.hidden=false;
    return;
  }
  let prompt=null;
  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault(); prompt=e;
    tekst.textContent='Installeer het speelschema als app op je telefoon.';
    ja.hidden=false; box.hidden=false;
  });
  ja.addEventListener('click', async ()=>{
    if (!prompt) return;
    prompt.prompt(); await prompt.userChoice.catch(()=>{});
    prompt=null; box.hidden=true;
  });
  window.addEventListener('appinstalled',()=>{ box.hidden=true; opslaan('kb_schema_tip_weg','1'); });
})();
</script>
</body>
</html>
