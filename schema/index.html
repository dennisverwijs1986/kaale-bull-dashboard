// ══════════════════════════════════════════
//  PWA: service worker + installeer-tip
// ══════════════════════════════════════════
const TESTVERSIE = false;  // op true zetten voor een testpagina: geen service worker, geen telling
if (!TESTVERSIE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { scope:'./' }).catch(()=>{});

// ══════════════════════════════════════════
//  ANONIEME TELLING — één seintje per apparaat per dag (browser of geïnstalleerde app).
//  Alleen een willekeurig apparaatnummer, geen naam of andere gegevens.
// ══════════════════════════════════════════
(function telBezoek(){
  if (TESTVERSIE) return;
  try{
    let id = lezen('kb_schema_apparaat');
    if (!id){
      id = (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
        const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
      opslaan('kb_schema_apparaat', id);
    }
    const app = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    const sleutel = 'kb_schema_geteld_' + (app ? 'app' : 'web');
    if (lezen(sleutel) === vandaag()) return;      // vandaag al geteld
    fetch(`${SB_URL}/rest/v1/app_bezoeken`, {
      method:'POST',
      headers:{ ...HDR, 'Content-Type':'application/json', 'Prefer':'return=minimal' },
      body: JSON.stringify({ apparaat:id, geinstalleerd:app })
    }).then(r=>{ if (r.ok || r.status===409) opslaan(sleutel, vandaag()); }).catch(()=>{});
  }catch(e){}
})();

(function installeerTip(){
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (TESTVERSIE) return;
  if (standalone || lezen('kb_schema_tip_weg')) return;
  const box=document.getElementById('installeer'), tekst=document.getElementById('installeerTekst'), ja=document.getElementById('installeerJa');
  document.getElementById('installeerNee').addEventListener('click',()=>{ box.hidden=true; opslaan('kb_schema_tip_weg','1'); });
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  if (ios){
    tekst.innerHTML='Zet het schema als app op je beginscherm: tik op <b>Deel</b> <span aria-hidden="true">⎙</span> en kies <b>Zet op beginscherm</b>.';
    box.hidden=false;
    return;
  }
  let prompt=null;
  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault(); prompt=e;
    tekst.textContent='Installeer het speelschema als app op je telefoon.';
    ja.hidden=false; box.hidden=false;
  });
  ja.addEventListener('click', async ()=>{
    if (!prompt) return;
    prompt.prompt(); await prompt.userChoice.catch(()=>{});
    prompt=null; box.hidden=true;
  });
  window.addEventListener('appinstalled',()=>{ box.hidden=true; opslaan('kb_schema_tip_weg','1'); });
})();

<!-- ===== Easter egg: tik 3x snel op 🎯 voor een 180 ===== -->
<style>
  #ee-pijl { font-weight:inherit; cursor:pointer; display:inline-block; -webkit-tap-highlight-color:transparent; user-select:none; transition:transform .12s; }
  #ee-pijl.tik { transform:scale(1.35) rotate(-12deg); }
  #ee180 { position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, #1e3a8a 0%, #080d16 70%); opacity:0; transition:opacity .25s; overflow:hidden; cursor:pointer; }
  #ee180.aan { opacity:1; }
  #ee180 canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #ee180 svg { width:min(78vw, 46vh); height:auto; position:relative; filter:drop-shadow(0 10px 30px rgba(0,0,0,.6)); }
  #ee180 .ee-tekst { position:relative; margin-top:3vh; text-align:center; font-weight:900; line-height:1; letter-spacing:1px; }
  #ee180 .ee-getal { font-size:min(26vw, 15vh); color:#fff; text-shadow:0 0 30px #3b82f6, 0 6px 0 #1d4ed8; }
  #ee180 .ee-roep { font-size:min(7vw, 4.5vh); color:#fcd34d; text-transform:uppercase; opacity:0; transform:scale(.3); }
  #ee180 .ee-roep.knal { animation:eeKnal .5s cubic-bezier(.2,1.6,.4,1) forwards; }
  #ee180 .ee-sluit { position:absolute; bottom:4vh; font-size:.8rem; color:#94a3b8; }
  #ee180.schud { animation:eeSchud .45s; }
  @keyframes eeKnal { to { opacity:1; transform:scale(1); } }
  @keyframes eeSchud { 0%,100%{transform:none} 20%{transform:translate(-8px,4px)} 40%{transform:translate(7px,-5px)} 60%{transform:translate(-5px,3px)} 80%{transform:translate(4px,-2px)} }
</style>
<script>
(() => {
  const pijl = document.getElementById('ee-pijl');
  if (!pijl) return;
  let tikken = [], bezig = false;
  pijl.addEventListener('click', () => {
    pijl.classList.add('tik'); setTimeout(() => pijl.classList.remove('tik'), 120);
    const nu = Date.now();
    tikken = tikken.filter(t => nu - t < 900); tikken.push(nu);
    if (tikken.length >= 3 && !bezig) { tikken = []; start(); }
  });

  // Klein geluidje zonder bestanden (Web Audio)
  let ac;
  function tok(freq = 180) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(freq, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(50, ac.currentTime + .12);
      g.gain.setValueAtTime(.35, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .15);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + .16);
    } catch (e) {}
  }
  function trilling(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  // Dartbord tekenen
  function bord() {
    const volgorde = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
    const ring = (r1, r2, a1, a2, kleur) => {
      const p = (r, a) => [(r*Math.cos(a)).toFixed(2), (r*Math.sin(a)).toFixed(2)];
      const [x1,y1]=p(r2,a1),[x2,y2]=p(r2,a2),[x3,y3]=p(r1,a2),[x4,y4]=p(r1,a1);
      return `<path d="M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z" fill="${kleur}"/>`;
    };
    let s = `<circle r="200" fill="#111"/>`, cijfers = '';
    volgorde.forEach((n, i) => {
      const mid = (-90 + i*18) * Math.PI/180, a1 = mid - Math.PI/20, a2 = mid + Math.PI/20;
      const even = i % 2 === 0, enkel = even ? '#1a1a1a' : '#efe6cf', kleur = even ? '#d63a3a' : '#1f9d55';
      s += ring(16, 99, a1, a2, enkel) + ring(99, 107, a1, a2, kleur) + ring(107, 162, a1, a2, enkel) + ring(162, 170, a1, a2, kleur);
      cijfers += `<text x="${(186*Math.cos(mid)).toFixed(1)}" y="${(186*Math.sin(mid)).toFixed(1)}" fill="#fff" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="Arial">${n}</text>`;
    });
    s += `<circle r="16" fill="#1f9d55"/><circle r="6.4" fill="#d63a3a"/>`;
    const pijlen = [-4.2, 0, 4.2].map((d, i) => {
      const a = (-90 + d) * Math.PI/180, x = (103*Math.cos(a)).toFixed(1), y = (103*Math.sin(a)).toFixed(1);
      return `<g class="ee-dart" data-i="${i}" transform="translate(${x} ${y})" style="opacity:0">
        <g class="ee-vlucht"><g transform="rotate(${-18 + i*14})">
          <rect x="-1.2" y="0" width="2.4" height="12" fill="#cbd5e1"/>
          <rect x="-3" y="12" width="6" height="26" rx="2" fill="#64748b"/>
          <rect x="-3" y="18" width="6" height="2" fill="#94a3b8"/><rect x="-3" y="24" width="6" height="2" fill="#94a3b8"/>
          <rect x="-1.2" y="38" width="2.4" height="14" fill="#e2e8f0"/>
          <path d="M0 50 L-11 72 L0 66 L11 72 Z" fill="#3b82f6"/>
        </g></g></g>`;
    }).join('');
    return `<svg viewBox="-205 -205 410 410">${s}${cijfers}${pijlen}</svg>`;
  }

  // Confetti
  function confetti(canvas) {
    const ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const kleuren = ['#3b82f6','#fcd34d','#ffffff','#d63a3a','#1f9d55'];
    const stukjes = Array.from({length: 160}, () => ({
      x: innerWidth/2, y: innerHeight*0.45, vx: (Math.random()-.5)*14, vy: -Math.random()*14-4,
      w: 5+Math.random()*6, h: 8+Math.random()*8, r: Math.random()*6, vr: (Math.random()-.5)*.4,
      k: kleuren[Math.random()*kleuren.length|0]
    }));
    let t0 = performance.now();
    (function teken(t) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      stukjes.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.k; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore(); });
      if (t - t0 < 4000 && canvas.isConnected) requestAnimationFrame(teken);
    })(t0);
  }

  function start() {
    bezig = true;
    const rustig = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const el = document.createElement('div');
    el.id = 'ee180';
    el.innerHTML = `<canvas></canvas>${bord()}
      <div class="ee-tekst"><div class="ee-getal">0</div><div class="ee-roep">One hundred and eighty!</div></div>
      <div class="ee-sluit">tik om te sluiten</div>`;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('aan'));

    const getal = el.querySelector('.ee-getal'), timers = [];
    const sluit = () => { timers.forEach(clearTimeout); el.classList.remove('aan'); setTimeout(() => { el.remove(); bezig = false; }, 260); };
    el.addEventListener('click', sluit);

    el.querySelectorAll('.ee-dart').forEach((d, i) => {
      timers.push(setTimeout(() => {
        d.style.opacity = 1;
        if (!rustig) d.querySelector('.ee-vlucht').animate(
          [{ transform: 'translate(40px, 320px) scale(2.6)', opacity: 0 },
           { opacity: 1, offset: .5 },
           { transform: 'translate(0px, 0px) scale(1)', opacity: 1 }],
          { duration: 320, easing: 'cubic-bezier(.3,.7,.4,1)' });
        timers.push(setTimeout(() => {
          tok(200 + i*40); trilling(30);
          getal.textContent = 60 * (i + 1);
          if (!rustig) { getal.animate([{ transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 200 }); }
        }, rustig ? 0 : 300));
      }, 500 + i * 550));
    });

    timers.push(setTimeout(() => {
      el.querySelector('.ee-roep').classList.add('knal');
      trilling([60, 40, 120]); tok(420); setTimeout(() => tok(520), 120);
      if (!rustig) { el.classList.add('schud'); confetti(el.querySelector('canvas')); }
    }, 500 + 3 * 550 + 200));

    timers.push(setTimeout(sluit, 7500));
  }
})();
</script>
