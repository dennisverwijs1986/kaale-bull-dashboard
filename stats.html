<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaale Bull — Seizoensstatistieken</title>
<style>
  :root {
    --bg: #1a1a2e;
    --bg2: #16213e;
    --bg3: #0f3460;
    --green: #00d4aa;
    --green-dim: #00d4aa18;
    --gold: #ffd700;
    --silver: #c0c0c0;
    --bronze: #cd7f32;
    --text: #e0e0e0;
    --text-dim: #7a8a99;
    --border: #ffffff14;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }

  header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; font-weight: 600; color: var(--green); }
  header .sub { color: var(--text-dim); font-size: 13px; }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  /* Upload */
  .upload-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 2.5rem 2rem; text-align: center; cursor: pointer; background: var(--bg2); transition: border-color .2s, background .2s; margin-bottom: 24px; }
  .upload-zone:hover { border-color: var(--green); background: var(--green-dim); }
  .upload-zone .icon { font-size: 2rem; margin-bottom: 8px; }
  .upload-zone .hint { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  #fileInput { display: none; }

  /* Controls */
  .controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .season-tag { background: var(--green-dim); border: 1px solid var(--green); color: var(--green); border-radius: 999px; padding: 4px 14px; font-size: 12px; font-weight: 600; }
  .btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: var(--radius); padding: 6px 14px; cursor: pointer; font-size: 12px; transition: border-color .15s, color .15s; }
  .btn:hover { border-color: var(--green); color: var(--green); }

  /* Division tabs */
  .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { background: var(--bg2); border: 1px solid var(--border); color: var(--text-dim); border-radius: var(--radius); padding: 7px 18px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; }
  .tab.active { background: var(--bg3); border-color: var(--green); color: var(--green); }
  .tab:hover:not(.active) { border-color: var(--text-dim); color: var(--text); }

  /* Division section */
  .division { display: none; }
  .division.active { display: block; }

  /* Section label */
  .section-label { font-size: 11px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: .08em; margin: 24px 0 12px; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Tables */
  .table-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .card-head { padding: 10px 14px; font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border); background: var(--bg3); }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 7px 12px; font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); text-align: right; }
  th:first-child, th:nth-child(2) { text-align: left; }
  td { padding: 7px 12px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--green-dim); }
  .rank { width: 28px; color: var(--text-dim); font-size: 12px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .green { color: var(--green); font-weight: 600; }
  .gold-txt { color: var(--gold); }
  .silver-txt { color: var(--silver); }
  .bronze-txt { color: var(--bronze); }

  /* Grid layouts */
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }

  @media (max-width: 800px) {
    .grid-3, .grid-2 { grid-template-columns: 1fr; }
  }

  /* Print */
  @media print {
    body { background: #fff; color: #111; }
    header { background: #1a1a2e; }
    .upload-zone, .btn, .controls .btn { display: none !important; }
    .tabs { display: none !important; }
    .division { display: block !important; page-break-before: always; }
    .division:first-of-type { page-break-before: avoid; }
    .table-card { border: 1px solid #ddd; page-break-inside: avoid; break-inside: avoid; }
    .card-head { background: #f0f0f0; color: #333; }
    td, th { border-color: #eee; }
    .green { color: #007a5e; }
    var(--bg2) { background: #fff; }
  }
</style>
</head>
<body>

<header>
  <span style="font-size:1.3rem">🎯</span>
  <h1>Kaale Bull</h1>
  <span class="sub">— Seizoensstatistieken</span>
</header>

<div class="container">
  <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="icon">📊</div>
    <div style="font-size:15px;font-weight:600">CSV uploaden</div>
    <div class="hint">DartConnect leaderboard export (puntkomma-gescheiden) — sleep of klik</div>
  </div>
  <input type="file" id="fileInput" accept=".csv">
  <div id="output"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.0/papaparse.min.js"></script>
<script>
const fileInput = document.getElementById('fileInput');
const dropZone  = document.getElementById('dropZone');
const output    = document.getElementById('output');

fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor='var(--green)'; });
dropZone.addEventListener('dragleave', () => dropZone.style.borderColor='');
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor=''; handleFile(e.dataTransfer.files[0]); });

function n(v) { return (typeof v==='number' && !isNaN(v)) ? v : 0; }
function f2(v) { return parseFloat(v).toFixed(2); }

function medalOrNum(i) {
  if (i===0) return '<span class="gold-txt">🥇</span>';
  if (i===1) return '<span class="silver-txt">🥈</span>';
  if (i===2) return '<span class="bronze-txt">🥉</span>';
  return i+1;
}

function handleFile(file) {
  if (!file) return;
  Papa.parse(file, {
    header: true, delimiter: ';', dynamicTyping: true, skipEmptyLines: true,
    complete: r => render(r.data, file.name),
    error: err => output.innerHTML = `<p style="color:#f66;padding:1rem">Fout: ${err.message}</p>`
  });
}

function render(rows, filename) {
  // Bereken velden
  const players = rows.map(r => ({
    naam:    ((r['First']||'') + ' ' + (r['Last']||'')).trim(),
    div:     r['Division'] || 'Onbekend',
    matches: n(r['Matches']),
    s180:    n(r['180']),
    hvPlus:  n(r['T40_59']) + n(r['T60_79']),  // 140+
    hPlus:   n(r['T00_19']) + n(r['T20_39']),  // 100+
    gem:     parseFloat(r['3DA']) || 0,
    hFinish: n(r['HDO']),
    bestLeg: n(r['Best Leg']) || 0,
  })).filter(p => p.naam && p.matches > 0);

  const divisions = [...new Set(players.map(p => p.div))].sort();
  const season = filename.replace('.csv','').replace('Leaderboard_export_','').replace(/_/g,'-');

  // Tabs HTML
  const tabsHtml = divisions.map((d,i) =>
    `<div class="tab ${i===0?'active':''}" onclick="switchTab(${i})">${d}</div>`
  ).join('');

  // Build division sections
  const divsHtml = divisions.map((div, di) => {
    const pp = players.filter(p => p.div === div);

    // 1. Ranglijst: ALLE spelers, gesorteerd op 180 desc
    const ranglijst = [...pp]
      .sort((a,b) => b.s180 - a.s180 || b.hvPlus - a.hvPlus);

    const rangRows = ranglijst.map((p,i) => `<tr>
      <td class="rank">${medalOrNum(i)}</td>
      <td>${p.naam}</td>
      <td class="num green">${p.s180}</td>
      <td class="num">${p.hvPlus}</td>
      <td class="num">${p.hPlus}</td>
      <td class="num">${f2(p.gem)}</td>
      <td class="num">${p.bestLeg > 0 ? p.bestLeg : '—'}</td>
    </tr>`).join('');

    // 2. Top 10 beste 3DA
    const top3da = [...pp].sort((a,b) => b.gem - a.gem).slice(0,10);
    const top3daRows = top3da.map((p,i) => `<tr>
      <td class="rank">${medalOrNum(i)}</td>
      <td>${p.naam}</td>
      <td class="num green">${f2(p.gem)}</td>
    </tr>`).join('');

    // 3. Alle 100+ finishes
    const finishes = [...pp].filter(p => p.hFinish >= 100).sort((a,b) => b.hFinish - a.hFinish);
    const finishRows = finishes.length > 0
      ? finishes.map((p,i) => `<tr>
          <td class="rank">${medalOrNum(i)}</td>
          <td>${p.naam}</td>
          <td class="num green">${p.hFinish}</td>
        </tr>`).join('')
      : '<tr><td colspan="3" style="color:var(--text-dim);padding:10px 12px">Geen 100+ finishes</td></tr>';

    // 4. Beste leg onder 18 darts
    const legUnder18 = [...pp].filter(p => p.bestLeg > 0 && p.bestLeg < 18).sort((a,b) => a.bestLeg - b.bestLeg);
    const legRows = legUnder18.length > 0
      ? legUnder18.map((p,i) => `<tr>
          <td class="rank">${medalOrNum(i)}</td>
          <td>${p.naam}</td>
          <td class="num green">${p.bestLeg}</td>
        </tr>`).join('')
      : '<tr><td colspan="3" style="color:var(--text-dim);padding:10px 12px">Geen legs onder 18 darts</td></tr>';

    return `<div class="division ${di===0?'active':''}" data-div="${di}">

      <div class="section-label">📋 Ranglijst — 180's</div>
      <div class="table-card">
        <div class="card-head">Alle spelers — gesorteerd op 180</div>
        <table>
          <thead><tr>
            <th></th><th>Speler</th>
            <th class="num">180</th>
            <th class="num">140+</th>
            <th class="num">100+</th>
            <th class="num">3DA</th>
            <th class="num">Beste leg</th>
          </tr></thead>
          <tbody>${rangRows || '<tr><td colspan="7" style="color:var(--text-dim);padding:10px 12px">Geen data</td></tr>'}</tbody>
        </table>
      </div>

      <div class="section-label" style="margin-top:28px">📊 Overige statistieken</div>
      <div class="grid-3">
        <div class="table-card">
          <div class="card-head">🏆 Top 10 beste 3DA</div>
          <table>
            <thead><tr><th></th><th>Speler</th><th class="num">Gem.</th></tr></thead>
            <tbody>${top3daRows}</tbody>
          </table>
        </div>
        <div class="table-card">
          <div class="card-head">🎯 100+ finishes</div>
          <table>
            <thead><tr><th></th><th>Speler</th><th class="num">Finish</th></tr></thead>
            <tbody>${finishRows}</tbody>
          </table>
        </div>
        <div class="table-card">
          <div class="card-head">⚡ Beste leg (onder 18 darts)</div>
          <table>
            <thead><tr><th></th><th>Speler</th><th class="num">Darts</th></tr></thead>
            <tbody>${legRows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  }).join('');

  dropZone.style.display = 'none';
  output.innerHTML = `
    <div class="controls">
      <span class="season-tag">📅 Seizoen ${season}</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="document.getElementById('fileInput').click()">📂 Andere CSV</button>
        <button class="btn" onclick="window.print()">🖨️ Afdrukken / PDF</button>
      </div>
    </div>
    <div class="tabs" id="tabs">${tabsHtml}</div>
    ${divsHtml}
  `;
}

function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  document.querySelectorAll('.division').forEach((d,i) => d.classList.toggle('active', i===idx));
}
</script>
</body>
</html>
