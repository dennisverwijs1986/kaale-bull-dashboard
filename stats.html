<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaale Bull — Seizoensstatistieken</title>
<style>
  :root {
    --bg: #1a1a2e;
    --bg2: #16213e;
    --bg3: #0f3460;
    --green: #00d4aa;
    --green-dim: #00d4aa18;
    --gold: #ffd700;
    --silver: #c0c0c0;
    --bronze: #cd7f32;
    --text: #e0e0e0;
    --text-dim: #7a8a99;
    --border: #ffffff14;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }

  header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; font-weight: 600; color: var(--green); }
  header .sub { color: var(--text-dim); font-size: 13px; }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  /* Upload */
  .upload-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 2.5rem 2rem; text-align: center; cursor: pointer; background: var(--bg2); transition: border-color .2s, background .2s; margin-bottom: 24px; }
  .upload-zone:hover { border-color: var(--green); background: var(--green-dim); }
  .upload-zone .icon { font-size: 2rem; margin-bottom: 8px; }
  .upload-zone .hint { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  #fileInput { display: none; }

  /* Controls */
  .controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .season-tag { background: var(--green-dim); border: 1px solid var(--green); color: var(--green); border-radius: 999px; padding: 4px 14px; font-size: 12px; font-weight: 600; }
  .btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: var(--radius); padding: 6px 14px; cursor: pointer; font-size: 12px; transition: border-color .15s, color .15s; }
  .btn:hover { border-color: var(--green); color: var(--green); }
  .snap-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 20px; font-size: 13px; }
  .snap-bar input[type=date] { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 13px; color-scheme: dark; }
  .snap-bar .btn-save { border-color: var(--green); color: var(--green); }
  .snap-status { font-size: 12px; color: var(--text-dim); }
  .archief { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; margin: -12px 0 24px; font-size: 13px; color: var(--text-dim); }
  .archief select, .controls select { background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 13px; color-scheme: dark; max-width: 100%; }
  .snap-status.ok { color: var(--green); }
  .snap-status.err { color: #ff6b6b; }

  /* Division tabs */
  .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { background: var(--bg2); border: 1px solid var(--border); color: var(--text-dim); border-radius: var(--radius); padding: 7px 18px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; }
  .tab.active { background: var(--bg3); border-color: var(--green); color: var(--green); }
  .tab:hover:not(.active) { border-color: var(--text-dim); color: var(--text); }

  /* Division section */
  .division { display: none; }
  .division.active { display: block; }

  /* Section label */
  .section-label { font-size: 11px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: .08em; margin: 24px 0 12px; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Tables */
  .table-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .card-head { padding: 10px 14px; font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border); background: var(--bg3); }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 7px 12px; font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); text-align: right; }
  th:first-child, th:nth-child(2) { text-align: left; }
  td { padding: 7px 12px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--green-dim); }
  .rank { width: 28px; color: var(--text-dim); font-size: 12px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .green { color: var(--green); font-weight: 600; }
  .gold-txt { color: var(--gold); }
  .silver-txt { color: var(--silver); }
  .bronze-txt { color: var(--bronze); }

  /* Grid layouts */
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }

  @media (max-width: 800px) {
    .grid-3, .grid-2 { grid-template-columns: 1fr; }
  }

  /* Print */
  .pdf-links { visibility: hidden; height: 0; overflow: hidden; margin: 0; }

  @media print {
    :root {
      --bg: #fff; --bg2: #fff; --bg3: #f0f0f0;
      --green: #007a5e; --green-dim: #e8f5f1;
      --border: #ddd; --text: #111; --text-dim: #555;
    }
    @page { size: A4 landscape; margin: 8mm; }
    body { background: #fff; color: #111; font-size: 10px; }
    header { background: #1a1a2e !important; padding: 6px 14px !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .upload-zone, .btn, .snap-bar, .archief, .controls select { display: none !important; }
    .tabs { display: none !important; }
    .controls { margin-bottom: 8px !important; }
    .season-tag { border: 1px solid #007a5e !important; color: #007a5e !important; background: #e8f5f1 !important; font-size: 10px !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .container { padding: 0 !important; max-width: 100% !important; }

    /* Elke divisie op eigen pagina */
    .division { display: block !important; page-break-before: always; break-before: page; }
    .division:first-of-type { page-break-before: avoid; break-before: avoid; }

    /* 2-koloms layout: ranglijst links, 3 stats rechts */
    .print-layout { display: grid !important; grid-template-columns: 58% 40% !important; gap: 14px !important; align-items: start !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    .section-label { margin: 0 0 5px !important; font-size: 9px !important; }
    .table-card { border: 1px solid #ddd !important; page-break-inside: avoid; break-inside: avoid; }
    .card-head { background: #f0f0f0 !important; color: #333 !important; padding: 4px 8px !important; font-size: 9px !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    td, th { padding: 2.5px 6px !important; font-size: 9px !important; border-color: #eee !important; }
    .grid-3 { display: flex !important; flex-direction: column !important; gap: 8px !important; }

    /* Linkknoppen: alleen zichtbaar in de afdruk/PDF, niet op het scherm */
    .pdf-links { visibility: visible !important; height: auto !important; overflow: visible !important; display: flex !important; gap: 8px !important; margin-bottom: 8px !important; }
    .pdf-link-btn {
      display: inline-flex !important; align-items: center; gap: 5px;
      background: #007a5e !important; color: #fff !important; text-decoration: none;
      padding: 4px 11px !important; border-radius: 5px; font-size: 9px !important; font-weight: 600;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
  }
</style>
</head>
<body>

<header>
  <span style="font-size:1.3rem">🎯</span>
  <h1>Kaale Bull</h1>
  <span class="sub">— Seizoensstatistieken</span>
</header>

<div class="container">
  <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="icon">📊</div>
    <div style="font-size:15px;font-weight:600">CSV uploaden</div>
    <div class="hint">DartConnect leaderboard export (puntkomma-gescheiden) — sleep of klik</div>
  </div>
  <div class="archief" id="archiefBalk">
    <label for="archiefKeuze">Of bekijk een opgeslagen tussenstand:</label>
    <select id="archiefKeuze" onchange="laadTussenstand(this.value)"><option value="">Laden…</option></select>
  </div>
  <input type="file" id="fileInput" accept=".csv">
  <div id="output"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.0/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ctxurzqtglckairgbjno.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0eHVyenF0Z2xja2Fpcmdiam5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzExNjYsImV4cCI6MjA5NDcwNzE2Nn0.Ty3nNEyNfZVebxqXRS5RALM7JA5AdghIYAS6VjfFITQ';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let laatsteSpelers = [];
const fileInput = document.getElementById('fileInput');
const dropZone  = document.getElementById('dropZone');
const output    = document.getElementById('output');

fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor='var(--green)'; });
dropZone.addEventListener('dragleave', () => dropZone.style.borderColor='');
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor=''; handleFile(e.dataTransfer.files[0]); });

function n(v) { return (typeof v==='number' && !isNaN(v)) ? v : 0; }
function f2(v) { return parseFloat(v).toFixed(2); }

function medalOrNum(i) {
  if (i===0) return '<span class="gold-txt">🥇</span>';
  if (i===1) return '<span class="silver-txt">🥈</span>';
  if (i===2) return '<span class="bronze-txt">🥉</span>';
  return i+1;
}

function handleFile(file) {
  if (!file) return;
  Papa.parse(file, {
    header: true, delimiter: '', dynamicTyping: true, skipEmptyLines: true,
    complete: r => render(r.data, file.name),
    error: err => output.innerHTML = `<p style="color:#f66;padding:1rem">Fout: ${err.message}</p>`
  });
}

function render(rows, filename) {
  // Bereken velden
  const players = rows.map(r => ({
    naam:    ((r['First']||'') + ' ' + (r['Last']||'')).trim(),
    div:     r['Division'] || 'Onbekend',
    matches: n(r['Matches']),
    s180:    n(r['180']),
    hvPlus:  n(r['T40_59']) + n(r['T60_79']),  // 140+
    hPlus:   n(r['T00_19']) + n(r['T20_39']),  // 100+
    gem:     parseFloat(r['3DA']) || 0,
    hFinish: n(r['HDO']),
    bestLeg: n(r['Best Leg']) || 0,
  })).filter(p => p.naam && p.matches > 0);
  laatsteSpelers = players;
  const season = filename.replace('.csv','').replace('Leaderboard_export_','').replace(/_/g,'-');
  renderSpelers(players, `📅 Seizoen ${season}`, true);
}

// Toont de tabellen voor een lijst spelers; bron = CSV-upload (opslaanbaar) of opgeslagen tussenstand
function renderSpelers(players, label, opslaanbaar) {

  const divOrder = ['Eredivisie', 'Eerste Divisie'];
  const divisions = [...new Set(players.map(p => p.div))].sort((a, b) => {
    const ia = divOrder.indexOf(a), ib = divOrder.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return a.localeCompare(b);
  });
  // Tabs HTML
  const tabsHtml = divisions.map((d,i) =>
    `<div class="tab ${i===0?'active':''}" onclick="switchTab(${i})">${d}</div>`
  ).join('');

  // Build division sections
  const divsHtml = divisions.map((div, di) => {
    const pp = players.filter(p => p.div === div);

    // 1. Ranglijst: ALLE spelers, gesorteerd op 180 desc
    const ranglijst = [...pp]
      .sort((a,b) => b.s180 - a.s180 || b.hvPlus - a.hvPlus);

    const rangRows = ranglijst.map((p,i) => `<tr>
      <td class="rank">${medalOrNum(i)}</td>
      <td>${p.naam}</td>
      <td class="num">${p.matches}</td>
      <td class="num green">${p.s180}</td>
      <td class="num">${p.hvPlus}</td>
      <td class="num">${p.hPlus}</td>
      <td class="num">${f2(p.gem)}</td>
      <td class="num">${p.bestLeg > 0 ? p.bestLeg : '—'}</td>
    </tr>`).join('');

    // 2. Top 10 beste 3DA
    const top3da = [...pp].sort((a,b) => b.gem - a.gem).slice(0,10);
    const top3daRows = top3da.map((p,i) => `<tr>
      <td class="rank">${medalOrNum(i)}</td>
      <td>${p.naam}</td>
      <td class="num green">${f2(p.gem)}</td>
    </tr>`).join('');

    // 3. Alle 100+ finishes
    const finishes = [...pp].filter(p => p.hFinish >= 100).sort((a,b) => b.hFinish - a.hFinish);
    const finishRows = finishes.length > 0
      ? finishes.map((p,i) => `<tr>
          <td class="rank">${medalOrNum(i)}</td>
          <td>${p.naam}</td>
          <td class="num green">${p.hFinish}</td>
        </tr>`).join('')
      : '<tr><td colspan="3" style="color:var(--text-dim);padding:10px 12px">Geen 100+ finishes</td></tr>';

    // 4. Beste leg onder 18 darts
    const legUnder18 = [...pp].filter(p => p.bestLeg > 0 && p.bestLeg < 18).sort((a,b) => a.bestLeg - b.bestLeg);
    const legRows = legUnder18.length > 0
      ? legUnder18.map((p,i) => `<tr>
          <td class="rank">${medalOrNum(i)}</td>
          <td>${p.naam}</td>
          <td class="num green">${p.bestLeg}</td>
        </tr>`).join('')
      : '<tr><td colspan="3" style="color:var(--text-dim);padding:10px 12px">Geen legs onder 18 darts</td></tr>';

    return `<div class="division ${di===0?'active':''}" data-div="${di}">

      <div class="pdf-links">
        <a class="pdf-link-btn" href="https://tv.dartconnect.com/league/KaalBHC/22804/standings" target="_blank" rel="noopener">📊 Bekijk ranglijst</a>
        <a class="pdf-link-btn" href="https://leaderboard.dartconnect.com/leaderboard?x=1789469694786#l-t2ww_22804_all-all_01-all-all-all-all-all" target="_blank" rel="noopener">🏆 Bekijk leaderboard</a>
      </div>

      <div class="print-layout"><div>
      <div class="section-label">📋 Ranglijst — 180's</div>
      <div class="table-card">
        <div class="card-head">Statistieken ${div}</div>
        <table>
          <thead><tr>
            <th></th><th>Speler</th>
            <th class="num">Wedstrijden</th>
            <th class="num">180</th>
            <th class="num">140+</th>
            <th class="num">100+</th>
            <th class="num">3DA</th>
            <th class="num">Beste leg</th>
          </tr></thead>
          <tbody>${rangRows || '<tr><td colspan="8" style="color:var(--text-dim);padding:10px 12px">Geen data</td></tr>'}</tbody>
        </table>
      </div>

      </div><div>
      <div class="section-label">📊 Overige statistieken</div>
      <div class="grid-3">
        <div class="table-card">
          <div class="card-head">🏆 Top 10 beste 3DA</div>
          <table>
            <thead><tr><th></th><th>Speler</th><th class="num">Gem.</th></tr></thead>
            <tbody>${top3daRows}</tbody>
          </table>
        </div>
        <div class="table-card">
          <div class="card-head">🎯 100+ finishes</div>
          <table>
            <thead><tr><th></th><th>Speler</th><th class="num">Finish</th></tr></thead>
            <tbody>${finishRows}</tbody>
          </table>
        </div>
        <div class="table-card">
          <div class="card-head">⚡ Beste leg (onder 18 darts)</div>
          <table>
            <thead><tr><th></th><th>Speler</th><th class="num">Darts</th></tr></thead>
            <tbody>${legRows}</tbody>
          </table>
        </div>
      </div>
      </div></div>
    </div>`;
  }).join('');

  dropZone.style.display = 'none';
  document.getElementById('archiefBalk').style.display = 'none';
  const snapBar = opslaanbaar ? `
    <div class="snap-bar">
      <span>Opslaan als tussenstand van</span>
      <input type="date" id="snapDatum" value="${vandaag()}">
      <button class="btn btn-save" id="snapKnop" onclick="opslaanTussenstand()">💾 Opslaan</button>
      <span class="snap-status" id="snapStatus">Nog niet opgeslagen</span>
    </div>` : '';
  output.innerHTML = `
    <div class="controls">
      <span class="season-tag">${label}</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select aria-label="Opgeslagen tussenstand" onchange="laadTussenstand(this.value)">${archiefOpties()}</select>
        <button class="btn" onclick="document.getElementById('fileInput').click()">📂 Andere CSV</button>
        <button class="btn" onclick="window.print()">🖨️ Afdrukken / PDF</button>
      </div>
    </div>
    ${snapBar}
    <div class="tabs" id="tabs">${tabsHtml}</div>
    ${divsHtml}
  `;
}

// ── Opgeslagen tussenstanden ──
let archiefData = [];   // gesorteerde lijst peildata (nieuwste eerst)

function datumNL(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
}

function archiefOpties(gekozen) {
  if (!archiefData.length) return '<option value="">Nog geen opgeslagen tussenstanden</option>';
  return '<option value="">📁 Opgeslagen tussenstand…</option>' +
    archiefData.map(d => `<option value="${d}" ${d === gekozen ? 'selected' : ''}>${datumNL(d)}</option>`).join('');
}

async function laadArchief() {
  const sel = document.getElementById('archiefKeuze');
  const { data, error } = await supabaseClient.from('stats_snapshot_peildata').select('peildatum').order('peildatum', { ascending: false });
  if (error) { sel.innerHTML = '<option value="">Kon tussenstanden niet laden</option>'; return; }
  archiefData = [...new Set((data || []).map(r => r.peildatum))];
  sel.innerHTML = archiefOpties();
  document.querySelectorAll('.controls select').forEach(s => s.innerHTML = archiefOpties());
}

async function laadTussenstand(datum) {
  if (!datum) return;
  const { data, error } = await supabaseClient.from('stats_snapshots').select('*').eq('peildatum', datum);
  if (error || !data) { output.innerHTML = `<p style="color:#f66;padding:1rem">Fout bij laden: ${error ? error.message : 'geen data'}</p>`; return; }
  const players = data.map(r => ({
    naam: r.speler, div: r.divisie, matches: r.wedstrijden || 0, s180: r.s180 || 0,
    hvPlus: r.t140 || 0, hPlus: r.t100 || 0, gem: Number(r.gem) || 0,
    hFinish: r.hoogste_finish || 0, bestLeg: r.beste_leg || 0,
  })).filter(p => p.matches > 0);
  renderSpelers(players, `📁 Tussenstand ${datumNL(datum)}`, false);
  document.querySelectorAll('.controls select').forEach(s => s.innerHTML = archiefOpties(datum));
}

laadArchief();

function vandaag() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// Slaat de geüploade leaderboard-stand op in stats_snapshots (basis voor de tussenbalans).
// Zelfde datum nogmaals opslaan overschrijft die tussenstand.
async function opslaanTussenstand() {
  const status = document.getElementById('snapStatus');
  const knop = document.getElementById('snapKnop');
  const datum = document.getElementById('snapDatum').value;
  if (!datum) { status.className = 'snap-status err'; status.textContent = 'Kies eerst een datum.'; return; }
  if (!laatsteSpelers.length) { status.className = 'snap-status err'; status.textContent = 'Geen spelers in deze CSV.'; return; }
  knop.disabled = true;
  status.className = 'snap-status'; status.textContent = 'Bezig met opslaan…';
  try {
    // Namen omzetten naar de schrijfwijze uit het dashboard (DartConnect schrijft "Van" met hoofdletter)
    const { data: spelers, error: spErr } = await supabaseClient.from('spelers').select('naam');
    if (spErr) throw spErr;
    const naamMap = new Map((spelers || []).map(s => [s.naam.toLowerCase(), s.naam]));
    const onbekend = [];
    const rijen = laatsteSpelers.map(p => {
      const naam = naamMap.get(p.naam.toLowerCase());
      if (!naam) onbekend.push(p.naam);
      return {
        peildatum: datum,
        divisie: p.div,
        speler: naam || p.naam,
        wedstrijden: p.matches,
        s180: p.s180,
        t140: p.hvPlus,
        t100: p.hPlus,
        gem: Math.round(p.gem * 100) / 100,
        hoogste_finish: p.hFinish || null,
        beste_leg: p.bestLeg || null,
        bron: 'csv'
      };
    });
    const { error } = await supabaseClient.from('stats_snapshots')
      .upsert(rijen, { onConflict: 'peildatum,divisie,speler' });
    if (error) throw error;
    laadArchief();
    const d = new Date(datum + 'T12:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'long' });
    status.className = 'snap-status ok';
    status.textContent = `✓ Tussenstand van ${d} opgeslagen (${rijen.length} spelers)` +
      (onbekend.length ? ` — let op, onbekende naam: ${onbekend.join(', ')}` : '');
  } catch (e) {
    status.className = 'snap-status err';
    status.textContent = 'Opslaan mislukt: ' + (e.message || e);
  } finally {
    knop.disabled = false;
  }
}

function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  document.querySelectorAll('.division').forEach((d,i) => d.classList.toggle('active', i===idx));
}
</script>
