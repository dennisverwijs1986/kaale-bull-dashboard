<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaale Bull — Seizoensstatistieken</title>
<style>
  :root {
    --bg: #1a1a2e;
    --bg2: #16213e;
    --bg3: #0f3460;
    --green: #00d4aa;
    --green-dim: #00d4aa18;
    --gold: #ffd700;
    --silver: #c0c0c0;
    --bronze: #cd7f32;
    --text: #e0e0e0;
    --text-dim: #7a8a99;
    --border: #ffffff14;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }

  header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; font-weight: 600; color: var(--green); }
  header .sub { color: var(--text-dim); font-size: 13px; }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  /* Upload */
  .upload-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 2.5rem 2rem; text-align: center; cursor: pointer; background: var(--bg2); transition: border-color .2s, background .2s; margin-bottom: 24px; }
  .upload-zone:hover { border-color: var(--green); background: var(--green-dim); }
  .upload-zone .icon { font-size: 2rem; margin-bottom: 8px; }
  .upload-zone .hint { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  #fileInput { display: none; }

  /* Controls */
  .controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .season-tag { background: var(--green-dim); border: 1px solid var(--green); color: var(--green); border-radius: 999px; padding: 4px 14px; font-size: 12px; font-weight: 600; }
  .btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: var(--radius); padding: 6px 14px; cursor: pointer; font-size: 12px; transition: border-color .15s, color .15s; }
  .btn:hover { border-color: var(--green); color: var(--green); }
  .snap-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 20px; font-size: 13px; }
  .snap-bar input[type=date] { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 13px; color-scheme: dark; }
  .snap-bar .btn-save { border-color: var(--green); color: var(--green); }
  .snap-status { font-size: 12px; color: var(--text-dim); }
  .archief { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; margin: -12px 0 24px; font-size: 13px; color: var(--text-dim); }
  .archief select, .controls select { background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 13px; color-scheme: dark; max-width: 100%; }
  .snap-status.ok { color: var(--green); }
  .snap-status.err { color: #ff6b6b; }

  /* Division tabs */
  .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { background: var(--bg2); border: 1px solid var(--border); color: var(--text-dim); border-radius: var(--radius); padding: 7px 18px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; }
  .tab.active { background: var(--bg3); border-color: var(--green); color: var(--green); }
  .tab:hover:not(.active) { border-color: var(--text-dim); color: var(--text); }

  /* Division section */
  .division { display: none; }
  .division.active { display: block; }

  /* Section label */
  .section-label { font-size: 11px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: .08em; margin: 24px 0 12px; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Tables */
  .table-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .card-head { padding: 10px 14px; font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border); background: var(--bg3); }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 7px 12px; font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); text-align: right; }
  th:first-child, th:nth-child(2) { text-align: left; }
  td { padding: 7px 12px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--green-dim); }
  .rank { width: 28px; color: var(--text-dim); font-size: 12px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .green { color: var(--green); font-weight: 600; }
  .gold-txt { color: var(--gold); }
  .silver-txt { color: var(--silver); }
  .bronze-txt { color: var(--bronze); }

  /* Grid layouts */
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }

  @media (max-width: 800px) {
    .grid-3, .grid-2 { grid-template-columns: 1fr; }
  }

  /* Klikbare spelersnaam */
  .speler-link { cursor: pointer; border-bottom: 1px dotted var(--text-dim); }
  .speler-link:hover { color: var(--green); border-bottom-color: var(--green); }

  /* Spelerspaneel */
  .sp-overlay { position: fixed; inset: 0; background: #000a; z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
  .sp-overlay.open { display: flex; }
  .sp-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px #0008; transition: transform .2s; }
  .sp-head { position: sticky; top: 0; background: var(--bg3); padding: 14px 16px; display: flex; align-items: flex-start; gap: 10px; border-bottom: 1px solid var(--border); z-index: 1; }
  .sp-head h2 { font-size: 18px; font-weight: 700; }
  .sp-head .sp-sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .sp-close { margin-left: auto; background: transparent; border: none; color: var(--text-dim); font-size: 22px; line-height: 1; cursor: pointer; padding: 2px 6px; }
  .sp-close:hover { color: var(--green); }
  .sp-grip { display: none; }
  .sp-body { padding: 14px 16px 18px; }
  .sp-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }
  .sp-tile { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .sp-tile .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sp-tile .l { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .sp-h3 { font-size: 11px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: .08em; margin: 18px 0 8px; }
  .sp-table { width: 100%; border-collapse: collapse; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .sp-table th, .sp-table td { padding: 7px 10px; font-size: 13px; }
  .sp-table th { font-size: 10px; }
  .sp-table td:first-child { color: var(--text-dim); }
  .sp-table tr:hover td { background: transparent; }
  .sp-up { color: var(--green); font-weight: 600; }
  .sp-down { color: #ff7b7b; font-weight: 600; }
  .sp-same { color: var(--text-dim); }
  .sp-note { font-size: 11px; color: var(--text-dim); margin-top: 6px; line-height: 1.45; }
  .sp-trend svg { width: 100%; height: auto; display: block; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
  .gpunt { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .gpunt .glabel { display: none; pointer-events: none; }
  .gpunt.actief .glabel { display: inline; }
  .gpunt.actief .stip { stroke: #fff; stroke-width: 2; }
  .sp-legend { display: flex; gap: 14px; font-size: 11px; color: var(--text-dim); margin-top: 6px; flex-wrap: wrap; }
  .sp-legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--green); vertical-align: middle; margin-right: 5px; }
  .sp-legend i.vorig { border-top: 2px dashed var(--text-dim); }
  .sp-leeg { color: var(--text-dim); font-size: 13px; padding: 10px; background: var(--bg); border: 1px dashed var(--border); border-radius: 8px; }
  @media (max-width: 600px) {
    .sp-overlay { align-items: flex-end; padding: 0; }
    .sp-panel { max-width: 100%; max-height: 88vh; border-radius: 16px 16px 0 0; }
    .sp-grip { display: block; flex-basis: 100%; padding-bottom: 8px; }
    .sp-grip::before { content: ''; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--text-dim); opacity: .5; margin: 0 auto; }
    .sp-head { flex-wrap: wrap; padding-top: 8px; }
    .sp-head .sp-titel { flex: 1; }
    .sp-tile .v { font-size: 18px; }
  }
  @media print { .sp-overlay { display: none !important; } .speler-link { border: none; } }

  /* Print */
  .pdf-links { visibility: hidden; height: 0; overflow: hidden; margin: 0; }

  @media print {
    :root {
      --bg: #fff; --bg2: #fff; --bg3: #f0f0f0;
      --green: #007a5e; --green-dim: #e8f5f1;
      --border: #ddd; --text: #111; --text-dim: #555;
    }
    @page { size: A4 landscape; margin: 8mm; }
    body { background: #fff; color: #111; font-size: 10px; }
    header { background: #1a1a2e !important; padding: 6px 14px !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .upload-zone, .btn, .snap-bar, .archief, .controls select { display: none !important; }
    .tabs { display: none !important; }
    .controls { margin-bottom: 8px !important; }
    .season-tag { border: 1px solid #007a5e !important; color: #007a5e !important; background: #e8f5f1 !important; font-size: 10px !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .container { padding: 0 !important; max-width: 100% !important; }

    /* Elke divisie op eigen pagina */
    .division { display: block !important; page-break-before: always; break-before: page; }
    .division:first-of-type { page-break-before: avoid; break-before: avoid; }

    /* 2-koloms layout: ranglijst links, 3 stats rechts */
    .print-layout { display: grid !important; grid-template-columns: 58% 40% !important; gap: 14px !important; align-items: start !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    .section-label { margin: 0 0 5px !important; font-size: 9px !important; }
    .table-card { border: 1px solid #ddd !important; page-break-inside: avoid; break-inside: avoid; }
    .card-head { background: #f0f0f0 !important; color: #333 !important; padding: 4px 8px !important; font-size: 9px !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    td, th { padding: 2.5px 6px !important; font-size: 9px !important; border-color: #eee !important; }
    .grid-3 { display: flex !important; flex-direction: column !important; gap: 8px !important; }

    /* Linkknoppen: alleen zichtbaar in de afdruk/PDF, niet op het scherm */
    .pdf-links { visibility: visible !important; height: auto !important; overflow: visible !important; display: flex !important; gap: 8px !important; margin-bottom: 8px !important; }
    .pdf-link-btn {
      display: inline-flex !important; align-items: center; gap: 5px;
      background: #007a5e !important; color: #fff !important; text-decoration: none;
      padding: 4px 11px !important; border-radius: 5px; font-size: 9px !important; font-weight: 600;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
  }
</style>
</head>
<body>

<header>
  <span style="font-size:1.3rem">🎯</span>
  <h1>Kaale Bull</h1>
  <span class="sub">— Seizoensstatistieken</span>
</header>

<div class="container">
  <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="icon">📊</div>
    <div style="font-size:15px;font-weight:600">CSV uploaden</div>
    <div class="hint">DartConnect leaderboard export (puntkomma-gescheiden) — sleep of klik</div>
  </div>
  <div class="archief" id="archiefBalk">
    <label for="archiefKeuze">Of bekijk een opgeslagen tussenstand:</label>
    <select id="archiefKeuze" onchange="laadTussenstand(this.value)"><option value="">Laden…</option></select>
  </div>
  <input type="file" id="fileInput" accept=".csv">
  <div id="output"></div>
</div>

<div class="sp-overlay" id="spOverlay" onclick="if(event.target===this) sluitSpeler()">
  <div class="sp-panel" id="spPanel" role="dialog" aria-modal="true" aria-labelledby="spNaam">
    <div class="sp-head" id="spHead">
      <div class="sp-grip"></div>
      <div class="sp-titel">
        <h2 id="spNaam"></h2>
        <div class="sp-sub" id="spSub"></div>
      </div>
      <button class="sp-close" onclick="sluitSpeler()" aria-label="Sluiten">✕</button>
    </div>
    <div class="sp-body" id="spBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.0/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ctxurzqtglckairgbjno.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0eHVyenF0Z2xja2Fpcmdiam5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzExNjYsImV4cCI6MjA5NDcwNzE2Nn0.Ty3nNEyNfZVebxqXRS5RALM7JA5AdghIYAS6VjfFITQ';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let laatsteSpelers = [];
const fileInput = document.getElementById('fileInput');
const dropZone  = document.getElementById('dropZone');
const output    = document.getElementById('output');

fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor='var(--green)'; });
dropZone.addEventListener('dragleave', () => dropZone.style.borderColor='');
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor=''; handleFile(e.dataTransfer.files[0]); });

function n(v) { return (typeof v==='number' && !isNaN(v)) ? v : 0; }
function f2(v) { return parseFloat(v).toFixed(2); }

function medalOrNum(i) {
  if (i===0) return '<span class="gold-txt">🥇</span>';
  if (i===1) return '<span class="silver-txt">🥈</span>';
  if (i===2) return '<span class="bronze-txt">🥉</span>';
  return i+1;
}

function handleFile(file) {
  if (!file) return;
  Papa.parse(file, {
    header: true, delimiter: '', dynamicTyping: true, skipEmptyLines: true,
    complete: r => render(r.data, file.name),
    error: err => output.innerHTML = `<p style="color:#f66;padding:1rem">Fout: ${err.message}</p>`
  });
}

function render(rows, filename) {
  // Bereken velden
  const players = rows.map(r => ({
    naam:    ((r['First']||'') + ' ' + (r['Last']||'')).trim(),
    div:     r['Division'] || 'Onbekend',
    matches: n(r['Matches']),
    s180:    n(r['180']),
    hvPlus:  n(r['T40_59']) + n(r['T60_79']),  // 140+
    hPlus:   n(r['T00_19']) + n(r['T20_39']),  // 100+
    gem:     parseFloat(r['3DA']) || 0,
    hFinish: n(r['HDO']),
    bestLeg: n(r['Best Leg']) || 0,
  })).filter(p => p.naam && p.matches > 0);
  laatsteSpelers = players;
  const season = filename.replace('.csv','').replace('Leaderboard_export_','').replace(/_/g,'-');
  renderSpelers(players, `📅 Seizoen ${season}`, true);
}

// Toont de tabellen voor een lijst spelers; bron = CSV-upload (opslaanbaar) of opgeslagen tussenstand
function renderSpelers(players, label, opslaanbaar) {
  huidigeSpelers = players;
  huidigeBron = label.replace(/^\S+\s/, '');

  const divOrder = ['Eredivisie', 'Eerste Divisie'];
  const divisions = [...new Set(players.map(p => p.div))].sort((a, b) => {
    const ia = divOrder.indexOf(a), ib = divOrder.indexOf(b);
    if (ia !== -1 && ib !== -1) return ia - ib;
    if (ia !== -1) return -1;
    if (ib !== -1) return 1;
    return a.localeCompare(b);
  });
  // Tabs HTML
  const tabsHtml = divisions.map((d,i) =>
    `<div class="tab ${i===0?'active':''}" onclick="switchTab(${i})">${d}</div>`
  ).join('');

  // Build division sections
  const divsHtml = divisions.map((div, di) => {
    const pp = players.filter(p => p.div === div);

    // 1. Ranglijst: ALLE spelers, gesorteerd op 180 desc
    const ranglijst = [...pp]
      .sort((a,b) => b.s180 - a.s180 || b.hvPlus - a.hvPlus);

    const rangRows = ranglijst.map((p,i) => `<tr>
      <td class="rank">${medalOrNum(i)}</td>
      <td>${naamLink(p.naam)}</td>
      <td class="num">${p.matches}</td>
      <td class="num green">${p.s180}</td>
      <td class="num">${p.hvPlus}</td>
      <td class="num">${p.hPlus}</td>
      <td class="num">${f2(p.gem)}</td>
      <td class="num">${p.bestLeg > 0 ? p.bestLeg : '—'}</td>
    </tr>`).join('');

    // 2. Top 10 beste 3DA
    const top3da = [...pp].sort((a,b) => b.gem - a.gem).slice(0,10);
    const top3daRows = top3da.map((p,i) => `<tr>
      <td class="rank">${medalOrNum(i)}</td>
      <td>${naamLink(p.naam)}</td>
      <td class="num green">${f2(p.gem)}</td>
    </tr>`).join('');

    // 3. Alle 100+ finishes
    const finishes = [...pp].filter(p => p.hFinish >= 100).sort((a,b) => b.hFinish - a.hFinish);
    const finishRows = finishes.length > 0
      ? finishes.map((p,i) => `<tr>
          <td class="rank">${medalOrNum(i)}</td>
          <td>${naamLink(p.naam)}</td>
          <td class="num green">${p.hFinish}</td>
        </tr>`).join('')
      : '<tr><td colspan="3" style="color:var(--text-dim);padding:10px 12px">Geen 100+ finishes</td></tr>';

    // 4. Beste leg onder 18 darts
    const legUnder18 = [...pp].filter(p => p.bestLeg > 0 && p.bestLeg < 18).sort((a,b) => a.bestLeg - b.bestLeg);
    const legRows = legUnder18.length > 0
      ? legUnder18.map((p,i) => `<tr>
          <td class="rank">${medalOrNum(i)}</td>
          <td>${naamLink(p.naam)}</td>
          <td class="num green">${p.bestLeg}</td>
        </tr>`).join('')
      : '<tr><td colspan="3" style="color:var(--text-dim);padding:10px 12px">Geen legs onder 18 darts</td></tr>';

    return `<div class="division ${di===0?'active':''}" data-div="${di}">

      <div class="pdf-links">
        <a class="pdf-link-btn" href="https://tv.dartconnect.com/league/KaalBHC/22804/standings" target="_blank" rel="noopener">📊 Bekijk ranglijst</a>
        <a class="pdf-link-btn" href="https://leaderboard.dartconnect.com/leaderboard?x=1789469694786#l-t2ww_22804_all-all_01-all-all-all-all-all" target="_blank" rel="noopener">🏆 Bekijk leaderboard</a>
      </div>

      <div class="print-layout"><div>
      <div class="section-label">📋 Ranglijst — 180's</div>
      <div class="table-card">
        <div class="card-head">Statistieken ${div}</div>
        <table>
          <thead><tr>
            <th></th><th>Speler</th>
            <th class="num">Wedstrijden</th>
            <th class="num">180</th>
            <th class="num">140+</th>
            <th class="num">100+</th>
            <th class="num">3DA</th>
            <th class="num">Beste leg</th>
          </tr></thead>
          <tbody>${rangRows || '<tr><td colspan="8" style="color:var(--text-dim);padding:10px 12px">Geen data</td></tr>'}</tbody>
        </table>
      </div>

      </div><div>
      <div class="section-label">📊 Overige statistieken</div>
      <div class="grid-3">
        <div class="table-card">
          <div class="card-head">🏆 Top 10 beste 3DA</div>
          <table>
            <thead><tr><th></th><th>Speler</th><th class="num">Gem.</th></tr></thead>
            <tbody>${top3daRows}</tbody>
          </table>
        </div>
        <div class="table-card">
          <div class="card-head">🎯 100+ finishes</div>
          <table>
            <thead><tr><th></th><th>Speler</th><th class="num">Finish</th></tr></thead>
            <tbody>${finishRows}</tbody>
          </table>
        </div>
        <div class="table-card">
          <div class="card-head">⚡ Beste leg (onder 18 darts)</div>
          <table>
            <thead><tr><th></th><th>Speler</th><th class="num">Darts</th></tr></thead>
            <tbody>${legRows}</tbody>
          </table>
        </div>
      </div>
      </div></div>
    </div>`;
  }).join('');

  dropZone.style.display = 'none';
  document.getElementById('archiefBalk').style.display = 'none';
  const snapBar = opslaanbaar ? `
    <div class="snap-bar">
      <span>Opslaan als tussenstand van</span>
      <input type="date" id="snapDatum" value="${vandaag()}">
      <button class="btn btn-save" id="snapKnop" onclick="opslaanTussenstand()">💾 Opslaan</button>
      <span class="snap-status" id="snapStatus">Nog niet opgeslagen</span>
    </div>` : '';
  output.innerHTML = `
    <div class="controls">
      <span class="season-tag">${label}</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select aria-label="Opgeslagen tussenstand" onchange="laadTussenstand(this.value)">${archiefOpties()}</select>
        <button class="btn" onclick="document.getElementById('fileInput').click()">📂 Andere CSV</button>
        <button class="btn" onclick="window.print()">🖨️ Afdrukken / PDF</button>
      </div>
    </div>
    ${snapBar}
    <div class="tabs" id="tabs">${tabsHtml}</div>
    ${divsHtml}
  `;
}

// ── Opgeslagen tussenstanden ──
let archiefData = [];   // gesorteerde lijst peildata (oudste eerst)

function datumNL(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
}

function archiefOpties(gekozen) {
  if (!archiefData.length) return '<option value="">Nog geen opgeslagen tussenstanden</option>';
  return '<option value="">📁 Opgeslagen tussenstand…</option>' +
    archiefData.map(d => `<option value="${d}" ${d === gekozen ? 'selected' : ''}>${datumNL(d)}</option>`).join('');
}

async function laadArchief() {
  const sel = document.getElementById('archiefKeuze');
  const { data, error } = await supabaseClient.from('stats_snapshot_peildata').select('peildatum').order('peildatum', { ascending: true });
  if (error) { sel.innerHTML = '<option value="">Kon tussenstanden niet laden</option>'; return; }
  archiefData = [...new Set((data || []).map(r => r.peildatum))];
  sel.innerHTML = archiefOpties();
  document.querySelectorAll('.controls select').forEach(s => s.innerHTML = archiefOpties());
}

async function laadTussenstand(datum) {
  if (!datum) return;
  const { data, error } = await supabaseClient.from('stats_snapshots').select('*').eq('peildatum', datum);
  if (error || !data) { output.innerHTML = `<p style="color:#f66;padding:1rem">Fout bij laden: ${error ? error.message : 'geen data'}</p>`; return; }
  const players = data.map(r => ({
    naam: r.speler, div: r.divisie, matches: r.wedstrijden || 0, s180: r.s180 || 0,
    hvPlus: r.t140 || 0, hPlus: r.t100 || 0, gem: Number(r.gem) || 0,
    hFinish: r.hoogste_finish || 0, bestLeg: r.beste_leg || 0,
  })).filter(p => p.matches > 0);
  renderSpelers(players, `📁 Tussenstand ${datumNL(datum)}`, false);
  document.querySelectorAll('.controls select').forEach(s => s.innerHTML = archiefOpties(datum));
}

laadArchief();

function vandaag() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// Slaat de geüploade leaderboard-stand op in stats_snapshots (basis voor de tussenbalans).
// Zelfde datum nogmaals opslaan overschrijft die tussenstand.
async function opslaanTussenstand() {
  const status = document.getElementById('snapStatus');
  const knop = document.getElementById('snapKnop');
  const datum = document.getElementById('snapDatum').value;
  if (!datum) { status.className = 'snap-status err'; status.textContent = 'Kies eerst een datum.'; return; }
  if (!laatsteSpelers.length) { status.className = 'snap-status err'; status.textContent = 'Geen spelers in deze CSV.'; return; }
  knop.disabled = true;
  status.className = 'snap-status'; status.textContent = 'Bezig met opslaan…';
  try {
    // Namen omzetten naar de schrijfwijze uit het dashboard (DartConnect schrijft "Van" met hoofdletter)
    const { data: spelers, error: spErr } = await supabaseClient.from('spelers').select('naam');
    if (spErr) throw spErr;
    const naamMap = new Map((spelers || []).map(s => [s.naam.toLowerCase(), s.naam]));
    const onbekend = [];
    const rijen = laatsteSpelers.map(p => {
      const naam = naamMap.get(p.naam.toLowerCase());
      if (!naam) onbekend.push(p.naam);
      return {
        peildatum: datum,
        divisie: p.div,
        speler: naam || p.naam,
        wedstrijden: p.matches,
        s180: p.s180,
        t140: p.hvPlus,
        t100: p.hPlus,
        gem: Math.round(p.gem * 100) / 100,
        hoogste_finish: p.hFinish || null,
        beste_leg: p.bestLeg || null,
        bron: 'csv'
      };
    });
    const { error } = await supabaseClient.from('stats_snapshots')
      .upsert(rijen, { onConflict: 'peildatum,divisie,speler' });
    if (error) throw error;
    laadArchief();
    const d = new Date(datum + 'T12:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'long' });
    status.className = 'snap-status ok';
    status.textContent = `✓ Tussenstand van ${d} opgeslagen (${rijen.length} spelers)` +
      (onbekend.length ? ` — let op, onbekende naam: ${onbekend.join(', ')}` : '');
  } catch (e) {
    status.className = 'snap-status err';
    status.textContent = 'Opslaan mislukt: ' + (e.message || e);
  } finally {
    knop.disabled = false;
  }
}

// ── Spelerspaneel: tik op een naam voor eigen stats + vergelijking met vorig seizoen ──
const VORIG_SEIZOEN = '2025-26';
let huidigeSpelers = [];
let huidigeBron = '';
let histCache = null;      // historie_stats van vorig seizoen
let snapCache = null;      // alle wekelijkse tussenstanden van dit seizoen

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function naamLink(naam) {
  return `<span class="speler-link" data-naam="${esc(naam)}" role="button" tabindex="0">${esc(naam)}</span>`;
}
output.addEventListener('click', e => {
  const el = e.target.closest('.speler-link');
  if (el) openSpeler(el.dataset.naam);
});
output.addEventListener('keydown', e => {
  const el = e.target.closest('.speler-link');
  if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openSpeler(el.dataset.naam); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') sluitSpeler(); });

const zelfde = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
const perWed = (tot, wed) => wed > 0 ? tot / wed : 0;

async function laadHistorie() {
  if (histCache) return histCache;
  const { data, error } = await supabaseClient.from('historie_stats').select('*').eq('seizoen', VORIG_SEIZOEN);
  if (error) throw error;
  return (histCache = data || []);
}
async function laadSnapshots() {
  if (snapCache) return snapCache;
  const { data, error } = await supabaseClient.from('stats_snapshots')
    .select('peildatum,speler,divisie,wedstrijden,gem,s180').order('peildatum', { ascending: true });
  if (error) throw error;
  return (snapCache = data || []);
}
async function laadVorigeUitslagen(naam) {
  const [a, b] = await Promise.all([
    supabaseClient.from('historie_wedstrijden').select('thuis,uit,legs_thuis,legs_uit,winnaar,walkover').eq('seizoen', VORIG_SEIZOEN).ilike('thuis', naam),
    supabaseClient.from('historie_wedstrijden').select('thuis,uit,legs_thuis,legs_uit,winnaar,walkover').eq('seizoen', VORIG_SEIZOEN).ilike('uit', naam),
  ]);
  if (a.error) throw a.error;
  if (b.error) throw b.error;
  return [...(a.data || []), ...(b.data || [])];
}

async function openSpeler(naam) {
  const p = huidigeSpelers.find(x => zelfde(x.naam, naam));
  if (!p) return;
  document.getElementById('spNaam').textContent = p.naam;
  const divGenoten = huidigeSpelers.filter(x => x.div === p.div).sort((a, b) => b.gem - a.gem);
  const plek = divGenoten.findIndex(x => zelfde(x.naam, p.naam)) + 1;
  document.getElementById('spSub').textContent = `${p.div} · ${huidigeBron}`;
  document.getElementById('spBody').innerHTML = `
    <div class="sp-tiles">
      <div class="sp-tile"><div class="v green">${f2(p.gem)}</div><div class="l">Gemiddelde (3DA)</div></div>
      <div class="sp-tile"><div class="v">${plek}<span style="font-size:13px;color:var(--text-dim)">/${divGenoten.length}</span></div><div class="l">Plek op gemiddelde</div></div>
      <div class="sp-tile"><div class="v">${p.matches}</div><div class="l">Wedstrijden</div></div>
      <div class="sp-tile"><div class="v">${p.s180}</div><div class="l">180's</div></div>
      <div class="sp-tile"><div class="v">${p.hFinish || '—'}</div><div class="l">Hoogste finish</div></div>
      <div class="sp-tile"><div class="v">${p.bestLeg || '—'}</div><div class="l">Beste leg (darts)</div></div>
    </div>
    <div id="spRest"><div class="sp-note" style="padding:10px 0">Vorig seizoen ophalen…</div></div>`;
  const ov = document.getElementById('spOverlay');
  ov.classList.add('open');
  document.getElementById('spPanel').style.transform = '';
  document.body.style.overflow = 'hidden';
  document.getElementById('spPanel').scrollTop = 0;

  try {
    const [hist, snaps, uitslagen] = await Promise.all([laadHistorie(), laadSnapshots(), laadVorigeUitslagen(p.naam)]);
    if (!zelfde(document.getElementById('spNaam').textContent, p.naam)) return; // ander paneel geopend intussen
    const vorig = hist.find(h => zelfde(h.speler, p.naam));
    const reeks = snaps.filter(s => zelfde(s.speler, p.naam) && (s.wedstrijden || 0) > 0);
    document.getElementById('spRest').innerHTML =
      vergelijkHtml(p, vorig) + trendHtml(reeks, vorig) + uitslagenHtml(p.naam, uitslagen, vorig);
  } catch (e) {
    document.getElementById('spRest').innerHTML = `<div class="sp-leeg">Kon vorig seizoen niet laden: ${esc(e.message || e)}</div>`;
  }
}

function sluitSpeler() {
  const ov = document.getElementById('spOverlay');
  if (!ov.classList.contains('open')) return;
  ov.classList.remove('open');
  document.body.style.overflow = '';
}

// Vergelijkt een waarde met vorig seizoen; hogerBeter=false voor 'beste leg'
function delta(nu, toen, decimalen, hogerBeter = true) {
  if (!nu || !toen) return '<span class="sp-same">—</span>';
  const d = nu - toen;
  const drempel = decimalen ? 0.005 : 0.5;
  if (Math.abs(d) < drempel) return '<span class="sp-same">=</span>';
  const beter = hogerBeter ? d > 0 : d < 0;
  const txt = (d > 0 ? '+' : '−') + Math.abs(d).toFixed(decimalen);
  return `<span class="${beter ? 'sp-up' : 'sp-down'}">${beter ? '▲' : '▼'} ${txt}</span>`;
}

function vergelijkHtml(p, v) {
  if (!v) return `<div class="sp-h3">📅 Vergelijking met vorig seizoen</div>
    <div class="sp-leeg">Geen statistieken van seizoen ${VORIG_SEIZOEN} — dit is het eerste seizoen van ${esc(p.naam.split(' ')[0])} bij De Kaale Bull. 🎯</div>`;
  const vw = v.wedstrijden || 0;
  const rij = (label, nu, toen, dec, hogerBeter = true, nuTxt, toenTxt) => `<tr>
    <td>${label}</td>
    <td class="num">${nuTxt ?? (nu ? nu.toFixed(dec) : '—')}</td>
    <td class="num">${toenTxt ?? (toen ? toen.toFixed(dec) : '—')}</td>
    <td class="num">${delta(nu, toen, dec, hogerBeter)}</td>
  </tr>`;
  const vorigDiv = v.divisie && v.divisie !== p.div ? ` (toen ${esc(v.divisie)})` : '';
  return `<div class="sp-h3">📅 Dit seizoen vs. ${VORIG_SEIZOEN}${vorigDiv}</div>
    <table class="sp-table">
      <thead><tr><th>Statistiek</th><th class="num">Nu</th><th class="num">${VORIG_SEIZOEN}</th><th class="num">Verschil</th></tr></thead>
      <tbody>
        ${rij('Gemiddelde (3DA)', p.gem, Number(v.gem) || 0, 2)}
        ${rij("180's per wedstrijd", perWed(p.s180, p.matches), perWed(v.s180, vw), 2)}
        ${rij('140+ per wedstrijd', perWed(p.hvPlus, p.matches), perWed(v.t140, vw), 2)}
        ${rij('100+ per wedstrijd', perWed(p.hPlus, p.matches), perWed(v.t100, vw), 2)}
        ${rij('Hoogste finish', p.hFinish || 0, v.hoogste_finish || 0, 0)}
        ${rij('Beste leg (darts)', p.bestLeg || 0, v.beste_leg || 0, 0, false)}
        <tr><td>180's totaal</td><td class="num">${p.s180}</td><td class="num">${v.s180 || 0}</td><td class="num sp-same">${!v.s180 ? '—' : p.s180 >= v.s180 ? '🎉 al geëvenaard' : 'nog ' + (v.s180 - p.s180) + ' te gaan'}</td></tr>
      </tbody>
    </table>
    <div class="sp-note">180's, 140+ en 100+ staan per wedstrijd, zodat je ook halverwege het seizoen eerlijk vergelijkt (vorig seizoen ${vw} wedstrijden${v.first9 ? `, first 9: ${Number(v.first9).toFixed(2)}` : ''}${v.checkout_pct ? `, uitgooi-% ${Number(v.checkout_pct).toFixed(1)}%` : ''}). Vorig seizoen speelde iedereen in één divisie.</div>`;
}

// ── Klikbaar punt in een lijngrafiek (bolletje + label met de waarde) ──
function grafiekPunt({ cx, cy, tekst, titel, kleur, bg, r, raak, actief, W, T, L, R }) {
  const bw = tekst.length * 6.6 + 12, bh = 18;
  const boven = cy - r - 6 - bh >= 0;                      // past het label boven het punt? anders eronder
  const by = boven ? cy - r - 6 - bh : cy + r + 6;
  const bx = Math.min(Math.max(cx - bw / 2, L - 30), W - R - bw);  // binnen de grafiek houden
  return `<g class="gpunt${actief ? ' actief' : ''}" data-gpunt>
    <circle cx="${cx}" cy="${cy}" r="${raak}" fill="transparent">${titel ? `<title>${titel}</title>` : ''}</circle>
    <circle class="stip" cx="${cx}" cy="${cy}" r="${r}" fill="${kleur}"/>
    <g class="glabel"><rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="5" fill="${bg}" stroke="${kleur}" stroke-width="1"/>
      <text x="${bx + bw / 2}" y="${by + 12.5}" text-anchor="middle" font-size="11" font-weight="700" fill="${kleur}">${tekst}</text></g>
  </g>`;
}
document.addEventListener('click', e => {
  const g = e.target.closest && e.target.closest('[data-gpunt]');
  if (!g) return;
  const svg = g.ownerSVGElement || g.closest('svg');
  svg.querySelectorAll('[data-gpunt]').forEach(n => n.classList.toggle('actief', n === g));
  g.parentNode.appendChild(g);                             // actief label bovenop de rest
});

function trendHtml(reeks, v) {
  const titel = '<div class="sp-h3">📈 Gemiddelde door het seizoen</div>';
  const punten = reeks.filter(r => Number(r.gem) > 0);
  if (punten.length < 2) return titel + '<div class="sp-leeg">Na een paar opgeslagen tussenstanden zie je hier je gemiddelde door het seizoen heen.</div>';
  const W = 520, H = 190, L = 38, R = 12, T = 14, B = 30;
  const vorigGem = v ? Number(v.gem) || 0 : 0;
  const waarden = punten.map(r => Number(r.gem)).concat(vorigGem ? [vorigGem] : []);
  let min = Math.min(...waarden), max = Math.max(...waarden);
  const marge = Math.max(1, (max - min) * 0.15);
  min = Math.floor(min - marge); max = Math.ceil(max + marge);
  const x = i => L + (punten.length === 1 ? 0 : i * (W - L - R) / (punten.length - 1));
  const y = g => T + (max - g) * (H - T - B) / (max - min);
  const lijn = punten.map((r, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(Number(r.gem)).toFixed(1)}`).join(' ');
  const stappen = 4;
  const raster = Array.from({ length: stappen + 1 }, (_, k) => {
    const g = min + k * (max - min) / stappen;
    return `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="#ffffff10"/>
      <text x="${L - 6}" y="${y(g) + 4}" text-anchor="end" font-size="10" fill="#7a8a99">${g.toFixed(max - min < 8 ? 1 : 0)}</text>`;
  }).join('');
  const labelElke = Math.ceil(punten.length / 6);
  const xLabels = punten.map((r, i) => (i % labelElke === 0 || i === punten.length - 1)
    ? `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#7a8a99">${new Date(r.peildatum + 'T12:00:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' })}</text>` : '').join('');
  // Klikbare punten: tik op een bolletje voor het gemiddelde van die tussenstand (standaard de laatste)
  const raak = Math.max(8, Math.min(14, (W - L - R) / Math.max(1, punten.length - 1) / 2));
  const stippen = punten.map((r, i) => grafiekPunt({
    cx: x(i), cy: y(Number(r.gem)), tekst: Number(r.gem).toFixed(2), titel: `${datumNL(r.peildatum)}: ${Number(r.gem).toFixed(2)}`,
    kleur: '#00d4aa', bg: '#0f1923', r: 3.5, raak, actief: i === punten.length - 1, W, T, L, R
  })).join('');
  const vorigLijn = vorigGem ? `<line x1="${L}" x2="${W - R}" y1="${y(vorigGem)}" y2="${y(vorigGem)}" stroke="#7a8a99" stroke-width="1.5" stroke-dasharray="5 4"/>` : '';
  return titel + `<div class="sp-trend"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verloop gemiddelde">
      ${raster}${vorigLijn}
      <path d="${lijn}" fill="none" stroke="#00d4aa" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${xLabels}${stippen}
    </svg>
    <div class="sp-legend"><span><i></i>Dit seizoen (per tussenstand)</span>${vorigGem ? `<span><i class="vorig"></i>Eindgemiddelde ${VORIG_SEIZOEN}: ${vorigGem.toFixed(2)}</span>` : ''}</div></div>`;
}

function uitslagenHtml(naam, uitslagen, v) {
  const titel = `<div class="sp-h3">⚔️ Uitslagen ${VORIG_SEIZOEN}</div>`;
  if (!uitslagen.length) return v ? titel + '<div class="sp-leeg">Geen uitslagen van vorig seizoen gevonden.</div>' : '';
  let w = 0, l = 0, voor = 0, tegen = 0;
  const perTegenstander = new Map();
  uitslagen.forEach(u => {
    const thuis = zelfde(u.thuis, naam);
    const tegenstander = thuis ? u.uit : u.thuis;
    const mijn = thuis ? u.legs_thuis : u.legs_uit, hun = thuis ? u.legs_uit : u.legs_thuis;
    const gewonnen = zelfde(u.winnaar, naam);
    gewonnen ? w++ : l++;
    if (!u.walkover) { voor += mijn || 0; tegen += hun || 0; }
    const t = perTegenstander.get(tegenstander) || { w: 0, l: 0 };
    gewonnen ? t.w++ : t.l++;
    perTegenstander.set(tegenstander, t);
  });
  const pct = Math.round(100 * w / (w + l));
  const lijst = [...perTegenstander.entries()];
  // Toon de kortste lijst: van wie je won óf van wie je verloor
  const wonVan = lijst.filter(([, t]) => t.w > 0).map(([n]) => n).sort((a, b) => a.localeCompare(b, 'nl'));
  const verloorVan = lijst.filter(([, t]) => t.l > 0).map(([n]) => n).sort((a, b) => a.localeCompare(b, 'nl'));
  const toonWinst = wonVan.length <= verloorVan.length;
  const namen = toonWinst ? wonVan : verloorVan;
  const saldo = voor - tegen;
  return titel + `<div class="sp-tiles">
      <div class="sp-tile"><div class="v">${w}–${l}</div><div class="l">Gewonnen–verloren</div></div>
      <div class="sp-tile"><div class="v">${pct}%</div><div class="l">Winstpercentage</div></div>
      <div class="sp-tile"><div class="v ${saldo >= 0 ? 'green' : ''}">${saldo > 0 ? '+' : saldo < 0 ? '−' : ''}${Math.abs(saldo)}</div><div class="l">Legsaldo (${voor}–${tegen})</div></div>
    </div>
    ${namen.length ? `<div class="sp-note">${toonWinst ? '✅ Gewonnen van' : '❌ Verloren van'}: ${namen.map(esc).join(', ')}</div>` : ''}`;
}

// Paneel op de telefoon naar beneden wegvegen
(() => {
  const panel = document.getElementById('spPanel');
  let startY = null, dy = 0;
  panel.addEventListener('touchstart', e => {
    startY = (panel.scrollTop <= 0) ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  panel.addEventListener('touchmove', e => {
    if (startY === null) return;
    dy = e.touches[0].clientY - startY;
    if (dy > 0) panel.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  panel.addEventListener('touchend', () => {
    if (startY !== null && dy > 90) sluitSpeler();
    panel.style.transform = '';
    startY = null;
  });
})();

function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  document.querySelectorAll('.division').forEach((d,i) => d.classList.toggle('active', i===idx));
}
