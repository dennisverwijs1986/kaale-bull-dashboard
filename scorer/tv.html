<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaale Bull TV Scorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@500;600;700&display=swap">
<style>
[hidden]{display:none!important}
/* 2x2 borden zoals tv.html; per bord: balk in divisiekleur, twee spelers naast elkaar, laatste beurten onderin */
:root{
  --bg:#0a1120;--tile:#121c31;--tile2:#18243f;--line:#26365a;--fg:#f1f5f9;--muted:#8796b6;
  --ere:#a855f7;--eerste:#3b82f6;--beker:#f59e0b;--vrij:#64748b;--gold:#f5c542;--red:#ef4444;--green:#10b981;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--ui:"Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden}
.grid{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1.2vh;padding:1.2vh}
.tile{--c:var(--vrij);background:var(--tile);border:.3vh solid var(--line);border-radius:1.4vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;min-width:0;min-height:0}
.tile.ere{--c:var(--ere)}.tile.eerste{--c:var(--eerste)}.tile.beker{--c:var(--beker)}
.bar{display:flex;align-items:center;gap:1.2vh;padding:.6vh 1.4vh;background:color-mix(in srgb,var(--c) 22%,transparent);border-bottom:.35vh solid var(--c);font:700 2.6vh var(--ui);white-space:nowrap}
.bar .nr{font:800 3.4vh var(--num)}
.bar .chip{background:var(--c);color:#fff;border-radius:.8vh;padding:.1vh 1vh;font-size:2.2vh}
.tile.beker .bar .chip{color:#111}
.bar .fmt{margin-left:auto;color:var(--muted);font-size:2.2vh;font-weight:600}
.bar .live{width:1.3vh;height:1.3vh;border-radius:50%;background:var(--green);animation:p 1.6s infinite}
.bar .live.stale{background:var(--red);animation:none}
@keyframes p{50%{opacity:.3}}
.body{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;min-height:0}
.pl{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.6vh 1vh;min-width:0;position:relative}
.pl.active{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 26%,transparent),transparent 85%)}
.pl.active::after{content:"";position:absolute;left:12%;right:12%;top:0;height:.6vh;background:var(--gold);border-radius:0 0 .6vh .6vh}
.nm{font:700 3vh var(--num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pl:not(.active) .nm{color:#c3cde2}
.rem{font:800 14vh var(--num);line-height:.88;font-variant-numeric:tabular-nums}
.pl:not(.active) .rem{color:#aeb9d2}
.co{font:700 2.9vh var(--num);color:var(--gold);min-height:3.4vh;letter-spacing:.03em}
.avg{font:600 1.9vh var(--ui);color:var(--muted);font-variant-numeric:tabular-nums}
.legs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vh;padding-inline:.4vh}
.legs b{font:800 7vh var(--num);line-height:1;background:var(--c);color:#fff;border-radius:1vh;padding:0 1.4vh;font-variant-numeric:tabular-nums}
.tile.beker .legs b{color:#111}
.legs small{font:600 1.6vh var(--ui);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.turns{display:grid;grid-template-columns:1fr auto 1fr;border-top:.2vh solid var(--line);background:var(--tile2);font:700 2.8vh var(--num);font-variant-numeric:tabular-nums}
.turns .c{display:flex;justify-content:center;gap:2.2vh;padding:.5vh 0;min-width:0}
.turns .c span.hi{color:var(--gold)}
.turns .c span.b{color:var(--red)}
.turns .m{color:var(--muted);font-size:1.8vh;font-family:var(--ui);display:flex;align-items:center;padding-inline:1vh}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;color:var(--muted);grid-row:2 / span 2}
.empty b{font:800 9vh var(--num);color:#2c3b5c}
.done{grid-row:2 / span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;text-align:center;padding:2vh}
.done .w{font:800 5.5vh var(--num);line-height:1.05}
.done .s{font:800 10vh var(--num);color:var(--gold);line-height:1}
.done .st{font:600 2.2vh var(--ui);color:var(--muted)}
.hint{position:fixed;right:1.2vh;bottom:1.2vh;font:500 1.4vh var(--ui);color:#3a4a6c}
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<div class="hint" id="hint">Tik voor volledig scherm</div>
<script>
const SB='https://ctxurzqtglckairgbjno.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0eHVyenF0Z2xja2Fpcmdiam5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzExNjYsImV4cCI6MjA5NDcwNzE2Nn0.Ty3nNEyNfZVebxqXRS5RALM7JA5AdghIYAS6VjfFITQ';
const BORDEN=[1,2,3,4];

/* uitgooi-suggestie, gelijk aan de scorer */
const PREF=[];
for(let i=20;i>=10;i--)PREF.push({v:3*i,l:'T'+i});
for(let i=20;i>=1;i--)PREF.push({v:i,l:String(i)});
PREF.push({v:25,l:'25'},{v:50,l:'Bull'});
for(let i=9;i>=1;i--)PREF.push({v:3*i,l:'T'+i});
const DBL=[20,16,18,8,12,10,14,19,17,15,13,11,9,7,6,5,4,3,2,1].map(n=>({v:2*n,l:'D'+n}));DBL.push({v:50,l:'Bull'});
const cc={};
function checkout(r){
  if(r in cc)return cc[r];let res=null;
  if(r>=2&&r<=170){const one=DBL.find(d=>d.v===r);
    if(one)res=[one.l];else{let best=null,bc=1e9;
      DBL.forEach((d,j)=>PREF.forEach((a,i)=>{if(a.v+d.v===r){const c=i+j*3;if(c<bc){bc=c;best=[a.l,d.l]}}}));
      if(!best)DBL.forEach((d,j)=>PREF.forEach((a,i)=>{if(a.v+d.v>=r)return;PREF.forEach((b,k)=>{if(a.v+b.v+d.v===r&&a.v>=b.v){const c=i+k+j*3;if(c<bc){bc=c;best=[a.l,b.l,d.l]}}})}));
      res=best}}
  return cc[r]=res;
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function klasse(d){d=(d||'').toLowerCase();if(d.includes('beker'))return'beker';if(d.includes('eredivisie'))return'ere';if(d.includes('eerste'))return'eerste';return''}
function chip(d){const k=klasse(d);return k==='beker'?'Beker':k==='ere'?'Eredivisie':k==='eerste'?'Eerste Divisie':'Vrij'}
function avg(st,p){let pts=0,d=0;[...st.done.map(l=>l.turns),st.leg].forEach(T=>T.forEach(t=>{if(t.p===p){pts+=t.s;d+=t.darts}}));return d?(pts/d*3).toFixed(1):'–'}

function tile(n,row){
  const st=row&&row.staat;
  if(!st||!st.names){
    return`<div class="tile"><div class="bar"><span class="nr">Bord ${n}</span></div><div class="empty"><b>${n}</b>Geen wedstrijd</div></div>`;
  }
  const k=klasse(st.divisie),bo=st.legsToWin*2-1;
  const stale=Date.now()-new Date(row.updated_at).getTime()>3*60e3&&!st.over;
  const bar=`<div class="bar"><span class="live ${stale?'stale':''}"></span><span class="nr">Bord ${n}</span><span class="chip">${chip(st.divisie)}</span><span class="fmt">best of ${bo}</span></div>`;
  if(st.over){
    const w=st.legs[0]>st.legs[1]?0:1;
    return`<div class="tile ${k}">${bar}<div class="done"><div class="w">${esc(st.names[w])} wint</div><div class="s">${st.legs[0]} - ${st.legs[1]}</div><div class="st">${esc(st.names[0])} gem. ${avg(st,0)} · ${esc(st.names[1])} gem. ${avg(st,1)}</div></div></div>`;
  }
  const pl=p=>{const r=st.rem[p],co=st.turn===p&&r<=170?checkout(r):null;
    return`<div class="pl ${st.turn===p?'active':''}"><div class="nm">${esc(st.names[p])}</div><div class="rem">${r}</div><div class="co">${co?co.join(' · '):''}</div><div class="avg">gem. ${avg(st,p)}</div></div>`};
  const last=p=>st.leg.filter(t=>t.p===p).slice(-3).map(t=>`<span class="${t.bust?'b':t.s>=100?'hi':''}">${t.bust?'Bust':t.s}</span>`).join('')||'<span style="color:var(--muted)">–</span>';
  return`<div class="tile ${k}">${bar}<div class="body">${pl(0)}<div class="legs"><b>${st.legs[0]}-${st.legs[1]}</b><small>Leg ${st.done.length+1}</small></div>${pl(1)}</div>
    <div class="turns"><div class="c">${last(0)}</div><div class="m">laatste beurten</div><div class="c">${last(1)}</div></div></div>`;
}

let vorige='';
async function laad(){
  try{
    const r=await fetch(SB+'/rest/v1/scorer_live?select=bord,staat,updated_at',{headers:{apikey:KEY,Authorization:'Bearer '+KEY},cache:'no-store'});
    if(!r.ok)throw 0;
    const rows=await r.json();const per={};rows.forEach(x=>per[x.bord]=x);
    // alleen opnieuw tekenen als er iets veranderd is
    const sleutel=JSON.stringify(BORDEN.map(n=>per[n]&&[per[n].updated_at,!!per[n].staat]));
    const minuut=Math.floor(Date.now()/60e3);
    if(sleutel+minuut!==vorige){vorige=sleutel+minuut;document.getElementById('grid').innerHTML=BORDEN.map(n=>tile(n,per[n])).join('')}
  }catch(_){}
}
laad();setInterval(laad,1500);
document.addEventListener('click',()=>{try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}catch(_){}document.getElementById('hint').hidden=true});
try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(_){}
</script>
</body>
</html>
